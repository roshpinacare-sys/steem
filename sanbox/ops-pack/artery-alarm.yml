# ═══════════════════════════════════════════════════════════════════════════
# ARTERY ALARM — R314 · הזעקה-הממוקדת על עורק-רפה (הפער השיורי של G3)
# ═══════════════════════════════════════════════════════════════════════════
# המדידה קיימת — ה-mesh של saos-runtime מפיק את status.json (32 ריפו, שיניים-
# מרפאות). מה שהיה חסר — שהרפיון יזעק כ-issue וייסגר לבד כשחוזר לירוק.
# ה-workflow הזה קורא את המפה הציבורית ומנהל issue אחד חי.
#
# התקנה · סוכן עם גישת push ל-saos-runtime מעתיק את הקובץ אל
#   .github/workflows/artery-alarm.yml בענף main · rebase לפני · FF בלבד.
# חוקי-הבית · אפס סודות (המפה ציבורית) · fail-soft · issue אחד בלבד (idempotent).
# ═══════════════════════════════════════════════════════════════════════════

name: artery-alarm

on:
  schedule:
    - cron: "41 * * * *"   # שעתי — מאחורי מחזור ה-mesh העצמי (~20-25 דק')
  workflow_dispatch: {}

permissions:
  issues: write

concurrency:
  group: artery-alarm
  cancel-in-progress: false

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: measure and manage the single alarm issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          TITLE="רפיון-עורקים · המפה מדווחת סטייה"
          curl -sS -m 20 -o /tmp/status.json https://roshpinacare-sys.github.io/Domain/status.json || true
          python3 - <<'PY' > /tmp/verdict.env
          import json, datetime, sys
          try:
              d = json.load(open('/tmp/status.json'))
          except Exception:
              print('STATE=UNKNOWN'); sys.exit(0)
          gen = d.get('generatedAt'); s = d.get('summary') or {}
          age_min = None
          if gen:
              t = datetime.datetime.fromisoformat(gen.replace('Z','+00:00'))
              age_min = int((datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()//60)
          stale = int(s.get('STALE', 0) or 0) + int(s.get('IDLE', 0) or 0)
          bad = age_min is None or age_min > 180 or stale > 0
          body = "generatedAt=%s ageMin=%s ALIVE=%s STALE=%s IDLE=%s" % (gen, age_min, s.get('ALIVE'), s.get('STALE'), s.get('IDLE'))
          print("STATE=%s" % ("ALARM" if bad else "OK"))
          print("BODY=%s" % body)
          PY
          source /tmp/verdict.env
          NUM=$(gh issue list -R roshpinacare-sys/saos-runtime --search "$TITLE in:title state:open" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ "${STATE}" = "ALARM" ]; then
            if [ -z "${NUM}" ]; then
              gh issue create -R roshpinacare-sys/saos-runtime -t "$TITLE" -b "מפת-העורקים מדווחת · ${BODY}
          מדידה · $(date -u +%FT%TZ) · מקור · status.json הציבורי
          פקודה · בדיקת העורקים הרפים במפה והקמתם — המדידה מוכיחה, הריפוי בידי השיניים והסוכנים."
            else
              gh issue comment -R roshpinacare-sys/saos-runtime "${NUM}" -b "עדכון · ${BODY} · $(date -u +%FT%TZ)"
            fi
          else
            if [ -n "${NUM}" ]; then
              gh issue close -R roshpinacare-sys/saos-runtime "${NUM}" -c "חזרה-לירוק · ${BODY} · $(date -u +%FT%TZ) — סגירה-אוטומטית"
            fi
          fi

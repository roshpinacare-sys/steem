# SOVEREIGN CYCLE — R241 observe-only heartbeat. RETIRED FROM SCHEDULE (R280).
# Measured 2026-10-08: this private repo's Actions sit behind the billing wall
# (every scheduled run fails job-level with empty logs — zero minutes left),
# so a red alarm fired every few hours while the REAL external life ran on the
# public host roshpinacare-sys/saos-runtime (sovereign-runtime.yml — self-pulse
# chain, hourly backstop, selftest gate, chain-anchor probe, fleet conversation,
# DEX takeover, state push-back).
# Kept as a WORKFLOW_DISPATCH-ONLY diagnostic for whenever the operator chooses
# to pay for private minutes. Never scheduled again — the pulse lives on the
# public host, free and alive.
name: sovereign-cycle

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sovereign-cycle
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # R-VAULTPASS-1 (2026-10-11, zai-code-3): vault unlock keys left the
      # repo; the sealed bundle arrives as a secret (steem + saos-runtime).
      STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saos-cockpit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install engine deps
        working-directory: mini-services/saos-engine
        run: bun install --frozen-lockfile || npm i --no-save @noble/hashes @noble/secp256k1

      - name: Selftest gate (must PASS, fail-closed)
        working-directory: mini-services/saos-engine
        run: node selftest.mjs

      - name: Chain anchor probe (tip of saos-git-custody-v1 must be in HEAD lineage)
        run: node scripts/chain-anchor-probe.mjs

      - name: Divergence visibility
        run: |
          git fetch origin saos-cockpit
          echo "behind/ahead vs origin: $(git rev-list --left-right --count origin/saos-cockpit...HEAD)"

      - name: Summary
        if: always()
        run: echo "sovereign heartbeat done — any failed step above = public alarm (law §6.2)"

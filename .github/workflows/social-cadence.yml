name: social-cadence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-cadence
  cancel-in-progress: false

jobs:
  honest-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: marker
        run: |
          echo "SOCIAL-CADENCE-UNWIRED-BROADCAST-GATED: waiting-owner"
          exit 0

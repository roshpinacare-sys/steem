# מה נמדד (2026-10-11, WO-unwired-steem-social-cadence P2 — סגירה בכנות):
#
# 1. מצביע-מת כפול: ה-workflow הישן היה clone ל-Domain ואז הרצת
#    agents/social/cadence-run.cjs — אבל ב-Domain/agents/social יש 3 קבצים
#    בלבד (git ls-tree אומת ב-12-a; אין cadence-run.cjs) → כל ריצת-חירום
#    הייתה נופלת. העותק התקין קיים כאן ב-steem/agent/social/ (יחיד — לא רבים).
#    אפס-ריצות מעולם (census 12-a + API).
#
# 2. שער-שידור (הסיבה למצבה — לא לחיווט): המפעיל cadence-run.cjs הוא מנוע-
#    שידור במהותו — פוסטים/הצבעות/תגובות דרך steem.broadcast.send עם
#    SA_FLEET_KEYS. חוקי-הצי אוסרים: (א) אין שידורים מ-lanes (חוק-מנדט 13-d),
#    (ב) חוק-המו"ל-היחיד CR-0065 — Domain/human-cadence.cjs הוא המו"ל הראשי,
#    זהו מו"ל-גיבוי לחירום-בלבד, (ג) בריפו-זה אין בכלל סוד SA_FLEET_KEYS
#    (נמדד מ-API: MAIN_KEY,ZIP_PAT בלבד) → גם חיווט-מלא היה רץ תמיד DRY.
#
# 3. ראיה-נוספת שהגיבוי אינו-מוכן: ריצת-DRY מקומית (2026-10-11, node 24 +
#    steem@0.7.11) קורסת ב-measure() — קריאת rc_api נעשית ב-4-ארגומנטים
#    (steem.api.call(api,method,params,cb)) בעוד הספרייה מצפה ל-3 →
#    TypeError: callback is not a function, קריסת-תהליך (fail-loud דווקא
#    במנוע שהצהיר fail-soft). תיקון-הקריאה הוא צעד-בעלים יחד עם החימוש.
#    selftest של-המסילה עצמה ירוק מקומית: 38 PASS · 0 FAIL.
#
# מה-ה-job-הזה עושה: דבר אחד — מדפיס את מצב-האמת. קריאה-בלבד: אפס-מפתחות,
# אפס-שידור, אפס-כתיבה (permissions: contents: read), אפס-תלות, אפס-actions-
# צד-ג (חוק-Z74), תמיד exit 0 (fail-open — מצבה מדווחת, לא רודפת).
#
# מה-יפתח-את-המצבה (צעדי-בעלים, לא צעדי-סוכן):
#   (א) מילת-owner המשחררת את חוק-CR-0065 למו"ל-גיבוי,
#   (ב) הזרמת סוד SA_FLEET_KEYS לריפו-זה,
#   (ג) תיקון קריאת ה-rc_api ל-3-ארגומנטים ב-agent/social/cadence-run.cjs,
#   (ד) תיקון הנתיב ב-workflow לעותק-steem עצמו (agent/ יחיד, ללא clone-Domain).
# ═══════════════════════════════════════════════════════════════════════════

name: social-cadence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-cadence
  cancel-in-progress: false

jobs:
  honest-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: sovereign-clone (zero third-party actions — Z74 law)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: honest-status (read-only · אפס-מפתחות · אפס-שידור · fail-open)
        working-directory: repo
        run: |
          set -u
          echo "SOCIAL-CADENCE-UNWIRED-BROADCAST-GATED: waiting-owner"
          echo "--- measured state (all read-only) ---"
          if [ -f agent/social/cadence-run.cjs ]; then
            echo "runner: present ($(wc -c < agent/social/cadence-run.cjs) bytes) at agent/social/cadence-run.cjs"
          else
            echo "runner: MISSING at agent/social/cadence-run.cjs"
          fi
          bc=$(grep -c 'steem\.broadcast\.send' agent/social/cadence-run.cjs 2>/dev/null || true)
          echo "broadcast-capable: ${bc:-0} broadcast call sites (steem.broadcast.send) — this is why the lane law gates it"
          dc=$(grep -c -- '--dry' agent/social/cadence-run.cjs 2>/dev/null || true)
          echo "dry-mode flag present: ${dc:-0} (--dry = plan-only, zero signatures)"
          if [ -f agent/social/social-selftest.cjs ]; then
            echo "selftest: present (measured locally 2026-10-11: 38 PASS / 0 FAIL)"
          else
            echo "selftest: MISSING"
          fi
          if [ -f agent/social/SOCIAL-DOCTRINE.md ]; then
            echo "doctrine: present (SOCIAL-DOCTRINE.md)"
          else
            echo "doctrine: MISSING"
          fi
          if [ ! -e agents ]; then
            echo "agents/ (plural): absent in-steem — the old workflow's plural path never existed here (dead pointer, 12-a census)"
          else
            echo "agents/ (plural): present (unexpected — re-measure)"
          fi
          echo "--- un-gate checklist (owner steps, not agent steps) ---"
          echo "1. owner-word releasing CR-0065 backup-publisher · 2. SA_FLEET_KEYS secret armed · 3. rc_api call fixed (3-arg) · 4. path fixed to self (agent/, no Domain clone)"
          echo "--- tombstone exit: honest, fail-open, zero side-effects ---"
          exit 0

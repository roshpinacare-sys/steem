#
#
name: army-active-custody

# W23 · THE FLEET ACTIVE-KEY UNLOCK LANE (owner trace 1a15937c02271931:
# "מסחר גריד בסטימיט של כל החשבונות … יעבדו כחברה משותפת").
#
# MEASURED GAP: the 9 army bodies hold posting-only custody — their on-chain
# ACTIVE authorities match NO key material in the GEN-2 MASTER seal, so the
# fleet's grid orders and the W12 liquidity-sweep are chain-blocked (active-
# authority ops). The original creation keys live in the older sealed vault
# generations whose passes exist ONLY in the Actions secret STEEM_VAULT_PASSES.
# THIS workflow is the only lawful runner of scripts/army-active-custody-probe.mjs:
#   mode=probe  — bounded unlock sweep (seals × passes), judge army actives vs
#                 LIVE chain authorities, public receipts (pubs/fingerprints only).
#   mode=rotate — for bodies whose original active WIF is HELD: one account_update
#                 per body (signed by the held original = the CURRENT authority)
#                 raising the active authority to the GEN-2 pub we already custody
#                 (sha-pinned MASTER seal). Precedent: a1ec4ade (headcorner
#                 MASTER-DERIVE rotation, 4/4 roles chain-verified).
# Receipts are PUBLIC material (t18 custody-receipt.jsonl law). Zero key material
# ever reaches stdout or the receipt file. Dispatch-only — never scheduled, never
# rides the economic cadence lanes.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (judge custody, no writes) | rotate (raise held bodies to GEN-2 actives)"
        required: true
        default: "probe"
        type: choice
        options:
          - probe
          - rotate

permissions:
  contents: write

concurrency:
  group: army-active-custody
  cancel-in-progress: false

jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
      ROTATE_MODE: ${{ github.event.inputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bun
        uses: oven-sh/setup-bun@v2

      - name: Install engine deps (the serialization canon's bun.lock)
        run: |
          cd mini-services/saos-engine
          bun install --frozen-lockfile

      - name: Probe (or rotate) army active custody — verdict-only stdout
        working-directory: scripts
        run: bun army-active-custody-probe.mjs

      - name: Publish custody receipts (public material only)
        if: always()
        run: |
          set -euo pipefail
          if [ -f custody-receipt.jsonl ]; then
            git config user.name "saos-custody-lane"
            git config user.email "custody@saos.local"
            git add custody-receipt.jsonl
            if git diff --cached --quiet; then
              echo "no receipt churn — skip commit"
            else
              git commit -m "army-active-custody [$ROTATE_MODE]: fleet active-key lane receipts (pubs/fingerprints only, zero key material) [skip ci]"
              git pull --rebase origin saos-cockpit || true
              git push origin HEAD:saos-cockpit || { git pull --rebase origin saos-cockpit || true; git push origin HEAD:saos-cockpit; }
            fi
          else
            echo "no receipt file — nothing to publish"
          fi

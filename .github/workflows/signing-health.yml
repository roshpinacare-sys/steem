name: signing-health

# [W5] מד-בריאות-החתימה — שעתי, כנה, fail-honest.
# [W5-γ 2026-10-18] schedule מנוטרל-מדיד: הרגליים-בריפו-הזה-מתות (startup-class,
# 0-צעדים, לוגים-ריקים — 4+ ריצות) → התזמון-השעתי שרף-ניסיונות-כושלים-חינם מול
# תקרת-ההוצאה. המד-הקאנוני חי ב-saos-runtime ("signing-health (runtime-host)", :43)
# ומדווח LIVE-OK — שני-הידיים-מאומתות-מול-השרשרת. כאן נותר workflow_dispatch
# לניסיון-ידני-כנה אם-הרגליים-ירפאו.
# רקע מדיד: SIGNING-DEAD מאז 16.10 (cred.missing) — MAIN_KEY בריפו אחרון-נעדכן
# 2026-09-21, ה-ROT2 (16.10) סובב-סמכויות → המפתח-הישן חדל-להתאים. הצי המשיך
# "לפעום" סביב-יד-שבורה. הסוכן-הזה מבטיח שזה לעולם לא יקרה-שוב בשקט:
#  G1: MAIN_KEY קיים + מנתח + נגזר (WIF checksum + secp256k1).
#  G2: המפתח-הנגזר ∈ סמכויות-active חיות בשרשרת (שני-צמתים).
#  תשובה כנה: LIVE-OK (exit 0) / STALE / MISSING / BAD-KEY (exit 1 = אדום גלוי).
#  אפס-הדפסת-חומר-מפתח. אפס-שידור. בדיקה-בלבד — החייאה-עצמה בידי-ה-owner
#  (עדכון MAIN_KEY) או-דרך upload/headcorner.txt במנוע.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signing-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      MAIN_KEY: ${{ secrets.MAIN_KEY }}
      STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
      ROT2_FLEET_KEYS: ${{ secrets.ROT2_FLEET_KEYS }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: G1+G2 gate probe (no broadcast, no key material in output)
        run: |
          set -Eeuo pipefail
          npm install --prefix /tmp/deps @noble/secp256k1@2.2.3 --omit=dev --no-audit --no-fund --loglevel=error
          NODE_PATH=/tmp/deps/node_modules node << 'EOS'
          const crypto = require('crypto');
          const secp = require('@noble/secp256k1');
          secp.etc.hmacSha256Sync = (key, ...msgs) => {
            const h = crypto.createHmac('sha256', Buffer.from(key));
            msgs.forEach((m) => h.update(Buffer.from(m)));
            return new Uint8Array(h.digest());
          };
          const sha256 = (b) => crypto.createHash('sha256').update(b).digest();
          const ripemd160 = (b) => crypto.createHash('ripemd160').update(b).digest();
          const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
          const verdict = (v, extra) => {
            const out = { verdict: v, at: new Date().toISOString(), ...(extra || {}) };
            const line = 'SIGNING-HEALTH ' + JSON.stringify(out);
            console.log(line);
            try { require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### signing-health\n\n\`\`\`json\n${JSON.stringify(out, null, 1)}\n\`\`\`\n`); } catch {}
            process.exit(v === 'LIVE-OK' ? 0 : 1);
          };
          const b58dec = (s) => {
            let n = 0n;
            for (const c of s) { const i = B58.indexOf(c); if (i < 0) throw new Error('bad-b58'); n = n * 58n + BigInt(i); }
            let h = n.toString(16).padStart(2, '0'); if (h.length % 2) h = '0' + h;
            const buf = Buffer.from(h, 'hex');
            let pad = 0;
            for (const c of s) { if (c === '1') pad++; else break; }
            return Buffer.concat([Buffer.alloc(pad), buf]);
          };
          const rpc = async (node, method, params) => {
            const res = await fetch(node, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }), signal: AbortSignal.timeout(15000) });
            const j = await res.json();
            if (j.error) throw new Error((j.error.message || 'rpc-error').slice(0, 200));
            return j.result;
          };
          (async () => {
            const secretsPresent = {
              MAIN_KEY: !!(process.env.MAIN_KEY || '').trim(),
              STEEM_VAULT_PASSES: !!(process.env.STEEM_VAULT_PASSES || '').trim(),
              ROT2_FLEET_KEYS: !!(process.env.ROT2_FLEET_KEYS || '').trim(),
            };
            if (!secretsPresent.MAIN_KEY) verdict('MISSING', { secretsPresent, revival: 'owner: update MAIN_KEY repo secret (steem) with the CURRENT headcorner credential — or drop upload/headcorner.txt into the engine', deadSince: '2026-10-16 (cred.missing)' });
            let priv, derived;
            try {
              let w = process.env.MAIN_KEY.trim();
              if (w.length === 52 && w.startsWith('P')) w = w.slice(1);
              const dec = b58dec(w);
              if (dec.length !== 37) throw new Error('wif-len-' + dec.length);
              const payload = dec.slice(0, -4);
              if (!sha256(sha256(payload)).slice(0, 4).equals(dec.slice(-4))) throw new Error('wif-checksum');
              if (payload[0] !== 0x80) throw new Error('wif-version-' + payload[0]);
              priv = payload.slice(1);
              const p33 = Buffer.from(secp.getPublicKey(priv, true));
              derived = 'STM' + (() => {
                const full = Buffer.concat([p33, ripemd160(p33).slice(0, 4)]);
                let n = 0n;
                for (const x of full) n = n * 256n + BigInt(x);
                let s = '';
                while (n > 0n) { s = B58[Number(n % 58n)] + s; n /= 58n; }
                for (const x of full) { if (x === 0) s = '1' + s; else break; }
                return s;
              })();
            } catch (e) { verdict('BAD-KEY', { error: e.message, secretsPresent }); }
            const NODES = ['https://api.justyy.com', 'https://api.steemit.com'];
            const ACCOUNT = 'headcorner';
            let acc = null, nodeUsed = '';
            for (const node of NODES) {
              try {
                const a = await rpc(node, 'condenser_api.get_accounts', [[ACCOUNT]]);
                if (a && a[0]) { acc = a[0]; nodeUsed = node; break; }
              } catch (e) { /* next node */ }
            }
            if (!acc) verdict('RPC-FAIL', { secretsPresent });
            const liveActive = (acc.active && acc.active.key_auths ? acc.active.key_auths : []).map((x) => x[0]);
            const ok = liveActive.includes(derived);
            verdict(ok ? 'LIVE-OK' : 'STALE', {
              derivedPrefix: derived.slice(0, 14) + '...',
              node: nodeUsed,
              liveActiveCount: liveActive.length,
              secretsPresent,
              note: ok ? 'the signing hand may sign again on next exec-cycle' : 'key parses but does NOT match live active authorities (ROT2 rotated) — refresh MAIN_KEY',
            });
          })().catch((e) => verdict('UNEXPECTED', { error: String(e && e.message || e).slice(0, 200) }));
          EOS
      - name: honest-red is expected until MAIN_KEY refreshed
        if: failure()
        run: echo "SIGNING-DEAD visible by design — the wound stays honest until the owner refreshes MAIN_KEY"

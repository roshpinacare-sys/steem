# ═══════════════════════════════════════════════════════════════════════════
# PRESENCE-MATRIX — read-only multi-network display parity probe (exec 29-a)
# ═══════════════════════════════════════════════════════════════════════════
# Measures how each Steem display network serves the 14 fleet accounts vs
# control accounts (steem/nasoe/marpa):
#   CHAIN   — condenser_api.get_accounts (existence + history truth)
#   DISPLAY — steemit.com (SSR, the surface that currently shells the fleet),
#             steemitwallet.com / steemworld.org / steemscan.com (SPAs),
#             steemdb.io (measured ERR for everyone)
#
# LAWS: read-only (zero keys · zero broadcasts · zero deps · no npm install);
# exit 0 ALWAYS — the receipt IS the report (tombstone honesty; failures are
# recorded in the JSON, never fail-open claims). Cadence is deliberately
# gentle (every 6h, off-peak minute) — this is a quiet probe, not a worker.
#
# State receipt: the three presence-matrix.* files are committed back to
# saos-cockpit with [skip ci] (same x-access-token URL-credential pattern the
# fleet uses — bearer headers do NOT work for git push), repo-local identity
# set BEFORE any retry loop, pull --rebase retry x5 against the ~2min fleet
# pacemaker push races. If the push loses 5 races, that is logged honestly
# and the run still ends 0 — the measurement lives in the run log either way.
# ═══════════════════════════════════════════════════════════════════════════

name: presence-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"   # gentle off-peak cadence — read-only probe, keep it quiet

permissions:
  contents: read

concurrency:
  group: presence-matrix
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saos-cockpit
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: presence-probe (read-only · zero-deps · zero-keys · zero-broadcast · exit-0 receipt)
        run: node scripts/presence-matrix.mjs

      - name: state-commit (honest receipt back to saos-cockpit, [skip ci])
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -u
          STATE_DIR="mini-services/saos-engine/state"
          FILES="$STATE_DIR/presence-matrix.json $STATE_DIR/presence-matrix-summary.md $STATE_DIR/presence-matrix-digest.json"
          for f in $FILES; do
            if [ ! -f "$f" ]; then
              echo "state file missing: $f (probe crashed? fatal log is in the run) — honest no-commit"
              exit 0
            fi
          done

          # repo-local identity BEFORE any push/rebase loop (fleet law:
          # "Committer identity unknown" kills rebase retries)
          git config user.name "presence-matrix-lane"
          git config user.email "presence-matrix-lane@agents.roshpinacare-sys"
          git checkout -B saos-cockpit 2>/dev/null || true

          git add $FILES
          if git diff --cached --quiet; then
            echo "state unchanged — nothing to commit (honest no-op)"
            exit 0
          fi
          git commit -m "presence-matrix: measured display-parity receipt [skip ci]"

          if [ -z "${GH_PAT:-}" ]; then
            echo "GH_PAT secret not available on this ref — state stays local to this run (honest limit)"
            exit 0
          fi

          PUSH_URL="https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin saos-cockpit \
               && git push "$PUSH_URL" HEAD:saos-cockpit; then
              echo "state-commit landed (attempt $i) — receipt on origin/saos-cockpit"
              exit 0
            fi
            echo "push race / attempt $i failed — pull --rebase and retry (fleet pacemaker races are normal)"
            sleep $((i * 5))
          done
          echo "state-commit DID NOT LAND after 5 attempts — recorded honestly here; the measured JSON remains in this run's log/workspace"
          exit 0

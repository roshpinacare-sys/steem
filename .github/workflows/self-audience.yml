# SAOS SELF-AUDIENCE v2 — "אנחנו הקהל הריבוני של עצמנו" (ריבון, 2026-09-29 · Z-20)
#
# הסוכנים-החיילים עובדים בתוך הרשת ומפתחים אותה — צינור מלא:
#   1. soldiers-blog — רוטציית 10 חיילים, תוכן נתוני-אמת (מדידה-חיה לפני-פרסום)
#   2. fleet-claim   — הצי תובע את פרסי-עצמו (posting-only, אידמפוטנטי, גילגול)
#   3. head-delegate — תחזוקת-הון-עצמית: 30 SP לכל-חייל (אידמפוטנטי, סורג-בייטים)
#   4. self-audience — הצבעה-צולבת מלאה (לא-עצמית), שערי VP/RC, verify-then-sign
#   5. fleet-doctor  — אבחון-עצמי נטול-מפתחות: STATE-REPORT יומי מקצועי
#
# מפתחות: כספת-מוצפנת בריפו-הפרטי עצמו (דוקטרינת-משמורת-מערכת) — פענוח-עצמי
# בזיכרון-ריצה בלבד, אפס-סודות-בפלט/בקבלות/בקומיטים. fetch-depth: 0 נדרש
# לסריקת דורות-המטא (התאמת זוג-פותח לפי outer-sha).
# fail-soft: הסוכנים לעולם לא exit-1; תמיד קבלה נטולת-סודות.

name: self-audience

on:
  schedule:
    - cron: '30 14 * * *'   # 14:30 UTC — אחרי פרסומי-הבוקר של הראש, חלון-הצבעה חי
  workflow_dispatch:
    inputs:
      skip_posts:
        description: 'skip soldiers-blog (votes only)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

concurrency:
  group: self-audience
  cancel-in-progress: false

jobs:
  sovereign-audience:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout (full history — meta-generation pairing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip >/dev/null 2>&1 || true
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.1.34"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: install deps (steem from lockfile)
        run: |
          bun install --frozen-lockfile || bun install
          node -e "require('steem'); console.log('steem-js OK')"

      - name: soldiers publish (rotation, measured-truth content)
        if: ${{ github.event.inputs.skip_posts != 'true' }}
        run: node agent/soldiers-blog.cjs

      - name: fleet claims its own rewards (self-economy)
        run: node agent/fleet-claim.cjs

      - name: head delegation maintenance (self-capital, idempotent)
        run: node agent/head-delegate.cjs

      - name: cross-vote sweep (verify-then-sign, read-back)
        run: node agent/self-audience.cjs

      - name: fleet doctor (keyless self-diagnosis, STATE-REPORT)
        run: node agent/fleet-doctor.cjs

      - name: commit receipts (secretless)
        run: |
          git config user.name "saos-self-audience"
          git config user.email "self-audience@saos.local"
          git add agent/self-audience-receipt.json agent/soldiers-blog-receipt.json agent/fleet-claim-receipt.json agent/head-delegate-receipt.json agent/state-report.json STATE-REPORT-*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no receipt changes"
          else
            T=""
            for f in agent/soldiers-blog-receipt.json agent/fleet-claim-receipt.json agent/head-delegate-receipt.json agent/self-audience-receipt.json agent/state-report.json; do
              if [ -f "$f" ]; then V=$(python3 -c "import json;print(json.load(open('$f')).get('tally','ok'))" 2>/dev/null || echo ok); T="$T $(basename $f .json)=$V"; fi
            done
            git commit -m "self-audience:${T:-receipts updated} · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

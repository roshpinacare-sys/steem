# hive-custody-revival — fail-closed HIVE custody check + treasury heartbeat.
# Owner order 2026-10-17 ("תמשיך ודחוף" + standing "אתה יכול לחתום בקופה").
# Runner-only secrets (STEEM_VAULT_PASSES etc.) open the sha-pinned GEN-1 vault;
# every key is judged against the LIVE chain authorities; if a live HIVE
# posting authority is held, ONE posting-only weave heartbeat is signed and its
# SIGNED tx (public material) is emitted. Secrets never leave the runner.
name: hive-custody-revival
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hive-custody-revival
  cancel-in-progress: false
jobs:
  revive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: install engine deps
        run: cd mini-services/saos-engine && bun install
      - name: open vault, judge custody, sign heartbeat (secrets never printed)
        env:
          STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
          ROT2_FLEET_KEYS: ${{ secrets.ROT2_FLEET_KEYS }}
          MAIN_KEY: ${{ secrets.MAIN_KEY }}
          ROT_ROSTER: ${{ secrets.ROT_ROSTER }}
        working-directory: mini-services/saos-engine
        run: bun run gen1-sign-hive.mjs
      - name: custody receipt artifact (always — fail-closed verdicts are value)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custody-receipt
          path: mini-services/saos-engine/custody-receipt.jsonl
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: signed-tx
          path: mini-services/saos-engine/signed-tx.b64
          retention-days: 3

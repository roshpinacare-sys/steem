# hive-custody-revival — fail-closed HIVE custody check + treasury heartbeat.
# Owner order 2026-10-17 ("תמשיך ודחוף" + standing "אתה יכול לחתום בקופה").
# Runner-only secrets (STEEM_VAULT_PASSES etc.) open the sha-pinned GEN-1 vault;
# every key is judged against the LIVE chain authorities; if a live HIVE
# posting authority is held, ONE posting-only weave heartbeat is signed and its
# SIGNED tx (public material) is emitted. Secrets never leave the runner.
name: hive-custody-revival
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hive-custody-revival
  cancel-in-progress: false
jobs:
  revive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: install+custody+receipt (single step — every failure is receipted)
        env:
          STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
          ROT2_FLEET_KEYS: ${{ secrets.ROT2_FLEET_KEYS }}
          MAIN_KEY: ${{ secrets.MAIN_KEY }}
          ROT_ROSTER: ${{ secrets.ROT_ROSTER }}
        working-directory: mini-services/saos-engine
        run: |
          set +e
          bun install > install.log 2>&1; INSTALL=$?
          if [ "$INSTALL" -ne 0 ]; then
            # W39 (trace 1a1620a81bc92505): runner bun-install flake measured (run #9) — npm fallback over the same public dep tree
            echo "bun-install-failed → npm fallback" >> install.log
            npm install --omit=dev --no-audit --no-fund --loglevel=error >> install.log 2>&1; INSTALL=$?
          fi
          bun run gen1-sign-hive.mjs > stdout.log 2> stderr.log; EXIT=$?
          touch custody-receipt.jsonl
          if [ "$INSTALL" -ne 0 ]; then
            echo "{\"at\":\"$(date -u +%FT%TZ)\",\"ok\":false,\"error\":\"bun-install-failed\",\"exit\":$INSTALL}" >> custody-receipt.jsonl
            tail -5 install.log >> custody-receipt.jsonl
          fi
          sed -E 's/[1-9A-HJ-NP-Za-km-z]{50,52}/[REDACTED-WIF]/g' stdout.log >> custody-receipt.jsonl
          if [ "$EXIT" -ne 0 ]; then
            echo "{\"at\":\"$(date -u +%FT%TZ)\",\"ok\":false,\"error\":\"script-exit\",\"exit\":$EXIT}" >> custody-receipt.jsonl
            tail -5 stderr.log | sed -E 's/[1-9A-HJ-NP-Za-km-z]{50,52}/[REDACTED-WIF]/g' >> custody-receipt.jsonl
          fi
          exit "$EXIT"
      # G57 · KEYS-BACKUP-2026-09-09 custody probe — אותו-חוק-כספת, ארכיון-האב.
      # רץ-בנפרד (if: always) — פסק-הדין-שלו-ערך-גם-כשההלב-החתימה-נכשלת.
      - name: KEYS-BACKUP custody probe (always — fail-closed verdict is the product)
        if: always()
        env:
          STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
        working-directory: mini-services/saos-engine
        run: |
          set +e
          bun run gen1-backup-probe.mjs > backup-stdout.log 2> backup-stderr.log; EXIT=$?
          touch custody-receipt.jsonl
          sed -E 's/[1-9A-HJ-NP-Za-km-z]{50,52}/[REDACTED-WIF]/g' backup-stdout.log >> custody-receipt.jsonl
          if [ "$EXIT" -ne 0 ]; then
            echo "{\"at\":\"$(date -u +%FT%TZ)\",\"ok\":false,\"error\":\"probe-exit\",\"exit\":$EXIT}" >> custody-receipt.jsonl
            tail -5 backup-stderr.log | sed -E 's/[1-9A-HJ-NP-Za-km-z]{50,52}/[REDACTED-WIF]/g' >> custody-receipt.jsonl
          fi
          exit 0
      - name: backup probe receipt artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-probe-receipt
          path: mini-services/saos-engine/custody-receipt.jsonl
          retention-days: 30
          if-no-files-found: ignore
      - name: custody receipt artifact (always — fail-closed verdicts are value)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custody-receipt
          path: mini-services/saos-engine/custody-receipt.jsonl
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: signed-tx
          path: mini-services/saos-engine/signed-tx.b64
          retention-days: 3

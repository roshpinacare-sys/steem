name: custody-meta-seal
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: saos-cockpit, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: seal custody metas off the public tree
        env: { ERA_META_KEY: "${{ secrets.ERA_META_KEY }}" }
        run: |
          node - <<'EOF'
          const { readFileSync, writeFileSync, existsSync } = require("node:fs");
          const { randomBytes, scryptSync, createCipheriv } = require("node:crypto");
          const KEY = process.env.ERA_META_KEY;
          if (!KEY || KEY.length !== 64) { console.error("BAD-KEY"); process.exit(1); }
          const FILES = ["agent/recovery-meta.json","agent/vault/GEN-1-ERA-META.json"];
          const bundle = { format: "WEAVE-CLOUD-SEAL-1", sealedAt: new Date().toISOString(), files: {} };
          for (const f of FILES) { if (!existsSync(f)) continue;
            const salt = randomBytes(16), iv = randomBytes(12);
            const dk = scryptSync(Buffer.from(KEY, "hex"), salt, 32);
            const c = createCipheriv("aes-256-gcm", dk, iv);
            const ct = Buffer.concat([c.update(readFileSync(f)), c.final()]);
            bundle.files[f] = { salt: salt.toString("base64"), iv: iv.toString("base64"), tag: c.getAuthTag().toString("base64"), ct: ct.toString("base64") };
            console.log("SEALED:", f);
          }
          if (Object.keys(bundle.files).length === 0) { console.log("NOTHING-TO-SEAL (already sealed)"); process.exit(0); }
          writeFileSync("agent/vault/CUSTODY-META.sealed.enc", JSON.stringify(bundle, null, 1));
          console.log("recover: run this workflow with UNSEAL=1 or use scripts/seal-adopt.mjs pattern with ERA_META_KEY");
          EOF
      - name: scrub plaintexts + commit receipt
        run: |
          git rm -f --ignore-unmatch agent/recovery-meta.json
          git rm -f --ignore-unmatch agent/vault/GEN-1-ERA-META.json
          git add agent/vault/CUSTODY-META.sealed.enc
          if git diff --cached --quiet; then echo "no-change"; else
            git config user.name "fleet-orch"; git config user.email "orch@agents.roshpinacare-sys";
            git commit -m "[security][P0-1-final] custody metas sealed off public tree (scrypt+aes-256-gcm via ERA_META_KEY); GEN-1 material treated as BURNED — GEN-2 rotation remains mandatory (D-P0-1c)"
            git push origin HEAD:saos-cockpit; fi
#
#
name: armyseal-selfcontain

# W16 · THE LAST CUSTODY GAP (owner-law lane, IM trace 1a1554cfb9860c71).
# The army keys archive lives in the repo (sha-pinned) but its unlock pass was
# R-VAULTPASS-1-stranded on the STEEM_VAULT_PASSES secret — every non-Actions
# runner revived with REVIVAL-FAIL 0/14. The operator's standing directive
# (W15: "וודא כספת שיהיה מפתח לפעילות שוטפת של המערכת") makes the vault
# self-keyed: THIS workflow (the only kind of runner that can resolve the
# bundle) runs scripts/armyseal-selfcontain.mjs once and the pass lands in
# agent/recovery-meta.json (roundtrip-verified from the written meta, env
# stripped). Idempotent: after the first success every run SKIPs.
# Cadence offset :47 — clear of exec-cycle :17, money-watch :33, anchor :55.

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */2 * * *'

permissions:
  contents: write

concurrency:
  group: armyseal-selfcontain
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bun
        uses: oven-sh/setup-bun@v2

      - name: Self-contain the army keys pass (roundtrip-verified, idempotent)
        working-directory: scripts
        run: bun armyseal-selfcontain.mjs

      - name: Publish the sealed meta (vault law — pass in meta, verdict-only stdout)
        if: always()
        run: |
          set -euo pipefail
          git config user.name "saos-armyseal-bot"
          git config user.email "saos-armyseal-bot@users.noreply.github.com"
          git add agent/recovery-meta.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "armyseal-selfcontain: army keys pass → self-contained meta (W16 owner-law: וודא כספת שיהיה מפתח לפעילות שוטפת) — meta-only roundtrip verified, REVIVAL-FAIL 0/14 class closed for every bare clone [skip ci]"
            git pull --rebase origin saos-cockpit || true
            git push origin HEAD:saos-cockpit
          else
            echo "no meta delta this run (already sealed or seeking)"
          fi

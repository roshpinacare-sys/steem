name: directive-now
# ONE-SHOT OPERATOR DIRECTIVE — posts type "directive" on saos-bus-v1 so the
# hostless consumer (Autonomy/engine/directive-bus.mjs) executes the named
# task. Posting authority only, custom_json only, thinkGate enforced.
# Same secret wiring as exec-cycle.yml (MAIN_KEY 0600 server-side, zero echo).
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'named task in Autonomy engine/tasks/ (e.g. health-probe)'
        required: false
        default: 'health-probe'
      runId:
        description: 'optional run id for the receipt trail'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: directive-now
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bun
        uses: oven-sh/setup-bun@v2
      - name: Secure the master credential (server-side · 0600 · zero echo)
        env:
          MAIN_KEY: ${{ secrets.MAIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MAIN_KEY}" ]; then
            echo "::error::MAIN_KEY absent on roshpinacare-sys/steem — seed it (token-forge route) or remove this workflow"
            exit 1
          fi
          mkdir -p .secrets
          if [[ "${MAIN_KEY}" == *" "* ]]; then
            printf '%s\n' "${MAIN_KEY}" > .secrets/headcorner.key
          else
            printf 'headcorner %s\n' "${MAIN_KEY}" > .secrets/headcorner.key
          fi
          chmod 600 .secrets/headcorner.key
      - name: Install engine deps
        working-directory: mini-services/saos-engine
        run: bun install --frozen-lockfile || bun install
      - name: Broadcast one directive (posting role, thinkGate enforced)
        working-directory: mini-services/saos-engine
        run: bun directive-now.mjs "${{ inputs.task }}" "${{ inputs.runId }}"

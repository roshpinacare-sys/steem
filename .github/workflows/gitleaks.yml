name: gitleaks
# ═══════════════════════════════════════════════════════════════════════════
# FLEET LAW (T-53 contract, zai-code-3 2026-10-11): every critical repo scans
# its HEAD on push — secret-scanning died silently on the private rail
# (billing wall) for 5+ weeks; the external artery (Sandbox artery-fleet, public
# minutes) now re-scans every 2h, but in-repo scanning stays the first line.
# Fail-closed: a finding reds the run.
# ═══════════════════════════════════════════════════════════════════════════
# TOMBSTONE-HONEST (exec-20, 03:2xZ — owner=active, house law zai-13b + the
# social-cadence precedent): this repo was PRIVATE (467MB) and its Actions sat
# behind the billing wall — every push-triggered run died job-level BEFORE any
# step (measured 2026-10-12: conclusion=failure, log blob BlobNotFound, zero
# steps; 6/6 runs). Evidence: issue #29.
#
# SUPERSESSION (wave 19.52, trace 1a15da21aec52bd5 — measured 2026-10-21 09:0xZ,
# LAW-A): the tombstone's two premises are BOTH dead — (1) steem is PUBLIC now
# (API measured: visibility=public, 60.6MB), so Actions run free; (2) scheduled
# lanes are alive on this repo (1762 runs; sovereign-arming-flip schedule+dispatch
# SUCCESS 08:59Z run 39573504640). The billing wall is gone and the owner approved
# compute anyway. The T-53 first-line law returns: scan on push + weekly + dispatch.
# Fail-closed: a finding reds the run (the 19.38/19.52 .gitleaksignore ledger holds
# the measured false-positive pins — verified clean in BOTH no-git and git modes,
# gitleaks v8.24.3).
on:
  push:
    branches: [saos-cockpit]
  schedule:
    - cron: "17 5 * * 1" # weekly Monday 05:17Z — drift-catcher between pushes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

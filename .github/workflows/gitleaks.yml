name: gitleaks
# ═══════════════════════════════════════════════════════════════════════════
# FLEET LAW (T-53 contract, zai-code-3 2026-10-11): every critical repo scans
# its HEAD on push — secret-scanning died silently on the private rail
# (billing wall) for 5+ weeks; the external artery (Sandbox artery-fleet, public
# minutes) now re-scans every 2h, but in-repo scanning stays the first line.
# Fail-closed: a finding reds the run.
# ═══════════════════════════════════════════════════════════════════════════
# TOMBSTONE-HONEST (exec-20, 03:2xZ — owner=active, house law zai-13b + the
# social-cadence precedent): this repo was PRIVATE (467MB) and its Actions sat
# behind the billing wall — every push-triggered run died job-level BEFORE any
# step (measured 2026-10-12: conclusion=failure, log blob BlobNotFound, zero
# steps; 6/6 runs). Evidence: issue #29.
#
# SUPERSESSION (wave 19.52, trace 1a15da21aec52bd5 — measured 2026-10-21 09:0xZ,
# LAW-A): the tombstone's two premises are BOTH dead — (1) steem is PUBLIC now
# (API measured: visibility=public, 60.6MB), so Actions run free; (2) scheduled
# lanes are alive on this repo (1762 runs; sovereign-arming-flip schedule+dispatch
# SUCCESS 08:59Z run 39573504640). The billing wall is gone and the owner approved
# compute anyway. The T-53 first-line law returns: scan on push + weekly + dispatch.
#
# ══ [wave 19.54 · trace 1a15e3e419138aa5] THE SCAN-DEPTH LAW, measured ══════
# Three red classes measured on the revived lane in one day:
#   (1) SHALLOW-RANGE reds ×4 (10:10–10:41Z, incl. run 39586404894): the action's
#       computed push range `BASE^..HEAD` cannot resolve in a fetch-depth-1 clone
#       ("no leaks found in partial scan" + "Unexpected exit code [1]") — reds on a
#       CLEAN scan.
#   (2) FULL-HISTORY reds (run 39594092581, 11:43Z): with depth 0 the dispatch run
#       scanned the whole patch history (2907 commits, 1.64GB) and red 212 findings —
#       ALL historical (none at HEAD): the REGISTERED R-VAULTPASS-1 era (keysZipPass
#       lines whose history rotation is the ledgered owner P0), fabricated test
#       vectors (dGVz… = base64 "tes…"), encrypted-state fields (encKey in old ledger
#       snapshots, custody-by-design), and chain-PUBLIC identifiers (STM5 keys,
#       contract addresses). A scan that reds forever on unfixable-without-owner
#       history is the false-alarm disease (house law 19.52-f).
#   (3) The 19.52-g measurement stands: the TREE at HEAD is CLEAN in gitleaks mode
#       (exit 0), so a HEAD-tree scan honors the T-53 law's letter ("scans its HEAD")
#       as the fail-closed first line.
# LAW NOW: push/dispatch = HEAD-tree scan (no-git mode, fail-closed, seconds);
# weekly = the deep full-history sweep in REPORT-ONLY mode — the measured finding
# count + sarif artifact publish every week (the owner P0 stays visible), but the
# sweep never reds on the registered historical classes again.
on:
  push:
    branches: [saos-cockpit]
  schedule:
    - cron: "17 5 * * 1" # weekly Monday 05:17Z — the deep sweep, report-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: "8.24.3" # the version every 19.38/19.52/19.54 measurement used

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # push/dispatch scans the TREE at HEAD (no-git) — depth 1 is enough and fast.
          # The weekly deep sweep fetches full history itself in its own step.
          fetch-depth: 1

      - name: Install gitleaks (pinned)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version

      # [wave 19.76 · G64] no-conflict-markers guard: merge 93e24a544 committed
      # RAW merge conflicts into 91 state files (measured — gitleaks then reded
      # 238 findings on top, and any cloud restore would parse broken JSON).
      # The tree must never again carry conflict markers; fail-closed like T-53.
      - name: No-conflict-markers guard (fail-closed)
        run: |
          HITS="$(grep -rIl "^<<<<<<< " --exclude-dir=.git . 2>/dev/null || true)"
          if [ -n "$HITS" ]; then
            echo "::error::unresolved merge-conflict markers committed to the tree:"
            echo "$HITS"
            exit 1
          fi
          echo "tree free of conflict markers"

      - name: HEAD-tree scan (T-53 first line — fail-closed)
        run: |
          # no-git mode = scan the tree at HEAD, exactly the law's letter. Reads the
          # repo's .gitleaks.toml + .gitleaksignore (the 19.38/19.52 measured pins).
          ./gitleaks detect --no-git --exit-code 1 --redact -v
          echo "HEAD-tree scan: CLEAN (exit 0) — the T-53 first line holds"

      - name: Weekly deep sweep (full history — REPORT-ONLY)
        if: github.event_name == 'schedule'
        run: |
          git fetch --unshallow --quiet || git fetch --all --tags --quiet
          set +e
          ./gitleaks detect --exit-code 1 --redact --report-format sarif --report-path deep-sweep.sarif -v > deep-sweep.log 2>&1
          RC=$?
          set -e
          COUNT=$(python3 -c "import json;d=json.load(open('deep-sweep.sarif'));print(sum(len(r.get('results',[])) for r in d.get('runs',[])))" 2>/dev/null || echo "?")
          echo "deep-sweep exit=${RC} · historical findings=${COUNT}"
          if [ "${RC}" != "0" ]; then
            echo "::notice::Deep sweep found ${COUNT} historical findings — the REGISTERED R-VAULTPASS-1 owner-P0 class + fabricated vectors + chain-public identifiers (see wave 19.54 ledger + .gitleaks.toml notes). REPORT-ONLY by law: the count is published, the run stays green, a NEW secret at HEAD is still caught fail-closed by the HEAD-tree scan above."
          else
            echo "deep sweep: full history CLEAN — the historical classes are gone"
          fi

      - name: Upload deep sweep artifact
        if: github.event_name == 'schedule' && always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-deep-sweep
          path: |
            deep-sweep.sarif
            deep-sweep.log
          retention-days: 30
          if-no-files-found: ignore

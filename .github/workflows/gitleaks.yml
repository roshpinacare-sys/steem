name: gitleaks
# ═══════════════════════════════════════════════════════════════════════════
# FLEET LAW (T-53 contract, zai-code-3 2026-10-11): every critical repo scans
# its HEAD on push — secret-scanning died silently on the private rail
# (billing wall) for 5+ weeks; the external artery (Sandbox artery-fleet, public
# minutes) now re-scans every 2h, but in-repo scanning stays the first line.
# Fail-closed: a finding reds the run.
# ═══════════════════════════════════════════════════════════════════════════
# TOMBSTONE-HONEST (exec-20, 03:2xZ — owner=active, house law zai-13b + the
# social-cadence precedent): this repo is PRIVATE (467MB) and its Actions sit
# behind the billing wall — every push-triggered run dies job-level BEFORE any
# step (measured 2026-10-12: conclusion=failure, log blob BlobNotFound, zero
# steps; 6/6 runs). A red that can never be green is false-alarm noise that
# masks real failures — exactly the disease zai-13b outlawed. The SCAN ITSELF
# IS ALIVE on the public artery (T-53 contract: external re-scan every 2h on
# public minutes) + this file on main still scans PRs + workflow_dispatch.
# Kept dispatch-only so the owner can always fire a full in-repo scan when
# billing returns. Evidence: issue #29.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

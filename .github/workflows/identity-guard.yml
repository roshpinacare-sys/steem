# identity-guard — DECISIONS #10 / T-76 enforcement on every push.
# Born-dead history note: the previous identity-guard.yml (bf8ff8e2) was
# committed as binary garbage and never parsed by Actions. This is the real
# shield: fail loud the moment a forbidden identity or ungated deployment
# appears in pinned state. It fails ONLY on real findings — no email flood.
name: identity-guard

on:
  push:
    branches: [saos-cockpit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    # BILLING-WALL COVENANT (T-53, zai-13b red-noise ban) - applied 2026-10-13T12:1xZ,
    # measured: every steem Actions job dies at startup behind the org spend limit
    # (issue #29, 40/40 identity-guard failures 2026-10-13, zero steps ever ran).
    # A dead runner + push trigger = one guaranteed red email per heartbeat push.
    # This skip changes ZERO enforcement (the guard could not run anyway); the
    # real identity/law enforcement rides the public artery receipts
    # (receipts/fleet/steem.json, law-gitleaks-push covenant).
    # RE-ENABLE: delete the `if: false` line the moment the spend limit is lifted
    # and a dispatch run completes with real steps.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: DECISIONS #10 — doctrine identity sole, deployment gates closed
        run: node scripts/identity-guard.mjs

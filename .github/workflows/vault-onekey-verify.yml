# vault-onekey-verify — W-ONEKEY standing proof (owner order 2026-11-05)
# Runs with MAIN_KEY ONLY (no other vault pass exists in this environment).
# Proves the owner's key opens every primary seal in vault-home and that the
# soldier keys are held in the vault (account names + roles only — never values).
name: vault-onekey-verify
on:
  workflow_dispatch: {}
  schedule:
    - cron: "40 6 * * *"   # daily standing proof — after the 05:19 crown recovery

permissions:
  contents: read

concurrency:
  group: vault-onekey-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      MAIN_KEY: ${{ secrets.MAIN_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Owner-key-only verification of every primary seal
        run: |
          set -Euo pipefail
          node ops/onekey/onekey-verify.mjs

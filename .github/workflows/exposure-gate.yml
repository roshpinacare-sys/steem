name: exposure-gate
on:
  push: { branches: [saos-cockpit] }
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: saos-cockpit }
      - run: |
          node - <<'EOF'
          const { execSync } = require("node:child_process");
          const tree = execSync("git ls-tree -r --name-only HEAD").toString();
          const FORBIDDEN = ["agent/recovery-meta.json", "agent/vault/GEN-1-ERA-META.json"];
          let fail = tree.split("\n").filter(f => FORBIDDEN.includes(f));
          const jsons = tree.split("\n").filter(f => f.startsWith("agent/") && f.endsWith(".json"));
          for (const f of jsons) { const c = execSync(`git show HEAD:${f}`).toString();
            if (/keysZipPass|keysBackupPass|integrationsVault[^}]*"pass"\s*:/.test(c)) fail.push(f + " (pass-field)"); }
          if (fail.length) { console.error("EXPOSURE-REGRESSION:", fail); process.exit(1); }
          console.log("EXPOSURE-GATE: clean");
          EOF
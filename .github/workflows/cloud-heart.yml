# CLOUD-HEART (Task 83, ALWAYS-UP layer L6) — the executor OUTSIDE the sandbox.
#
# The sandbox is only the PRIMARY runner now. Every 30 minutes GitHub's cloud
# reads the LIVING-ATTEST from Steem/Hive (keyless, public RPC):
#   · attest fresh (< 95 min)  → SANDBOX-ALIVE  → verify + report, touch nothing
#   · attest stale / missing   → SANDBOX-DOWN   → TAKEOVER:
#       seal-open (zero-touch key restore) → one full agent cycle → saosnet
#       beat --live → chain attest (leadership marker on-chain) → gitkeeper
#       commit+push. The network does not stop because a sandbox died.
#
# Leader election = on-chain attest freshness. The chain itself is the judge.
# Private-repo budget: alive path ≈ 1 min/run → ~750 Actions-minutes/month.

name: cloud-heart

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'heartbeat mode — auto: judge from the chain; takeover: force cloud command (drill: run the network from its own server while the sandbox is dead); alive: verify only, never act'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - takeover
          - alive

permissions:
  contents: write

concurrency:
  group: cloud-heart
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout origin/main (the single truth)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install agent deps (steem · dhive · js-sha3 · tweetnacl)
        run: cd agent && npm install --omit=dev --no-audit --no-fund --loglevel=error

      - name: Cloud heartbeat (watch, or take over if the sandbox died)
        run: node agent/cloud_heartbeat.cjs
        env:
          CLOUD_HEART: '1'
          CLOUD_STALE_MIN: '95'
          CLOUD_FORCE_TAKEOVER: ${{ inputs.mode == 'takeover' && '1' || '' }}
          CLOUD_ALIVE_ONLY: ${{ inputs.mode == 'alive' && '1' || '' }}

      - name: Upload heartbeat report (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-heart-report
          path: agent/cloud_heart_report.json
          retention-days: 14

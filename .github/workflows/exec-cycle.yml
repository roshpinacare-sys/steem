#
#

name: exec-cycle

# גל-91 · החוליה-השבורה-המבנית-שנסגרה:
# worklog-הריפו (R302) קבע במפורש: "נקודות-לביצוע שנותרו: (1) זריעת ln מחדש
# (upload/headcorner.txt — מפעיל בלבד · או-נתיב-token-forge-חדש ל-CI-seed)".
# זהו אותו נתיב. המנוע בנה תוכנית-היצע OFFER-READY (asks/bids על שוק-הפנימי
# של Steem) אבל מת בקציר-סנדבוקס עם ה-.secrets ה-gitignored → SIGNING-DEAD.
# הידיים הקבועות: CI שמחזיק את MAIN_KEY (מפתח-האב → .secrets/headcorner.key
# 0600, אף-פעם-לא-נאכף, אף-פעם-לא-ב-stdout) + STEEM_VAULT_PASSES (חייאת-צבא
# posting+active מהכספת-החתומה, VERIFIED-VS-CHAIN). מחזור אחד doctrine-capped
# כל שעתיים (offset :17 מול money-watch :33 · anchor :55).

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: exec-cycle-v2  # t40: renamed past zombie-queued group-holder (uncancelable 409 runs from the private-minutes era); v2 is fresh and unblocked
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bun
        uses: oven-sh/setup-bun@v2

      - name: Secure the master credential (server-side · 0600 · zero echo)
        env:
          MAIN_KEY: ${{ secrets.MAIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MAIN_KEY}" ]; then
            echo "::error::MAIN_KEY absent on roshpinacare-sys/steem — seed it (token-forge route) or remove this workflow"
            exit 1
          fi
          mkdir -p .secrets
          # פורמט-השער: "<account> <master-password|P-key>" — תומך בשני-הצורות
          if [[ "${MAIN_KEY}" == *" "* ]]; then
            printf '%s\n' "${MAIN_KEY}" > .secrets/headcorner.key
          else
            printf 'headcorner %s\n' "${MAIN_KEY}" > .secrets/headcorner.key
          fi
          chmod 600 .secrets/headcorner.key

      - name: Install engine deps
        working-directory: mini-services/saos-engine
        run: bun install --frozen-lockfile || bun install

      - name: Selftest gate (fail-closed — honest death beats forged signing)
        working-directory: mini-services/saos-engine
        run: bun selftest.mjs

      - name: One doctrine-capped cycle (SENSE → DECIDE → ACT → RECORD)
        working-directory: mini-services/saos-engine
        run: bun daily.mjs

      - name: Publish the exec receipts (vault law — txids journaled, zero keys)
        if: always()
        run: |
          set -uo pipefail
          rm -f mini-services/saos-engine/state/*.tmp.* 2>/dev/null || true
          git config user.name "saos-exec-bot"
          git config user.email "saos-exec-bot@users.noreply.github.com"
          # t40: stage EVERYTHING (engine also writes root-level state/ and scratch files;
          # partial staging left unstaged changes that killed `pull --rebase` with
          # "cannot pull with rebase: You have unstaged changes" → exit 1 → red email)
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "exec-cycle: doctrine-capped broadcast receipts (txids, zero keys) [skip ci]"
            # t40: rebase+push retry x5 against the ~2min fleet pacemaker push races
            # (single-shot push rejected once by a racing organ = red email for nothing;
            # if all 5 races are lost the receipts live in this run's log — honest exit 0,
            # same doctrine as presence-matrix state-commit)
            landed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin saos-cockpit && git push origin HEAD:saos-cockpit; then
                echo "receipts landed (attempt $i)"
                landed=1
                break
              fi
              echo "push race / attempt $i lost — rebasing and retrying"
              sleep $((i * 5))
            done
            if [ "$landed" = "0" ]; then
              echo "receipts DID NOT LAND after 5 attempts — recorded honestly; full receipts are in this run's log"
            fi
          else
            echo "no state delta this cycle"
          fi

      - name: Cycle verdict line (visible in the run summary)
        if: always()
        working-directory: mini-services/saos-engine
        run: |
          if [ -f state/cycle-run.json ]; then
            bun -e 'const d=require("./state/cycle-run.json");console.log("cycle ok:",d.ok===true,"| steps:",Object.entries(d.steps??{}).map(([k,v])=>k+"="+(v.verdict??(v.ok?"ok":"fail"))).join(" "))' || true
          fi

name: sovereign-arming-flip

# ═══════════════════════════════════════════════════════════════════════════
# SOVEREIGN-ARMING-FLIP · KEY2→KEY1 בצד-הגיט (R309) — השער הדו-מפתחות של readiness-gate.mjs
# ───────────────────────────────────────────────────────────────────────────
# KEY 2 (רחוק): Autonomy@main ops/sovereign/DIRECTIVES/SOCIAL-ARMING.json — חוק-על של
#   הבעלים (R309/W18). KEY 1 (מקומי): mini-services/saos-engine/state/readiness.json.
# כש-KEY2 נושא ARMED + directiveRef — הקובץ-המקומי-המגורף מתעדכן ל-ARMED עם אותו-ref,
# חוקי-האנטי-הצפה (laws) נשמרים-מילה-במילה. כישלון-fetch/פרסור = no-op (fail-closed).
# המנוע קורא-את-השער מחדש-בכל-פעימה (never cached, never sticky) — ההיפוך-חי-מיד-בריצה-הבאה.
# ═══════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "35 2 * * *" # יומי 02:35Z — אחרי sovereign-arming-check (02:05Z)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sovereign-arming-flip
  cancel-in-progress: false

jobs:
  flip:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with: { ref: saos-cockpit, fetch-depth: 1 }

      - name: flip readiness.json only when Autonomy owner-law says ARMED (fail-closed)
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/roshpinacare-sys/Autonomy/main/ops/sovereign/DIRECTIVES/SOCIAL-ARMING.json"
          code=$(curl -s -o /tmp/arming.json -w '%{http_code}' -H 'user-agent: saos-arming-flip/1' "$URL") || code=000
          if [ "$code" != "200" ]; then echo "arming doc absent (HTTP $code) — gate untouched (fail-closed)"; exit 0; fi
          status=$(python3 -c "import json;print(json.load(open('/tmp/arming.json')).get('status',''))")
          ref=$(python3 -c "import json;print(json.load(open('/tmp/arming.json')).get('directiveRef','').strip())")
          if [ "$status" != "ARMED" ] || [ -z "$ref" ]; then echo "status=$status ref=$ref — not an owner-law arming; gate untouched"; exit 0; fi
          f="mini-services/saos-engine/state/readiness.json"
          python3 - "$ref" <<'EOF'
          import json, sys, datetime
          ref = sys.argv[1]
          p = "mini-services/saos-engine/state/readiness.json"
          try:
              local = json.load(open(p))
          except Exception:
              local = {}
          if local.get("gate") == "ARMED" and local.get("directiveRef") == ref:
              print("already synced"); sys.exit(0)
          next = {
              "gate": "ARMED",
              "at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "by": "sovereign-arming-flip (R309 · KEY2 Autonomy owner-law → KEY1 repo readiness, laws preserved)",
              "directiveRef": ref,
              "armedAt": local.get("armedAt") or datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "note": "dual-key transfer per readiness-gate.mjs design — anti-flood laws unchanged",
              "laws": local.get("laws", {}),
          }
          json.dump(next, open(p, "w"), ensure_ascii=False, indent=1)
          open(p, "a").write("\n")
          print("flipped → ARMED ref=" + ref)
          EOF
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add "$f"
          git commit -qm "sovereign-arming-flip: readiness.json → ARMED (ref=$ref) per Autonomy owner-law R309 — anti-flood laws preserved, readiness-gate dual-key law honored [skip ci]"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase -q origin saos-cockpit && git push -q origin saos-cockpit; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = "1" ] || { echo "PUSH-FAIL after 3 — honest red, next run retries"; exit 1; }

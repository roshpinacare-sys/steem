# CI PROBE (R243) — minimal runner-health check.
# If THIS fails with no steps: the problem is account-level (billing/runner
# policy), not our YAML. Delete after diagnosis.
name: ci-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: hello
        run: echo "runner alive $(date -u +%FT%TZ)"

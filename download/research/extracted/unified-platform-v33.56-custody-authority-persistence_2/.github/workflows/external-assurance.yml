name: External Assurance Preparation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prerequisites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --fund=false
      - run: npm run build:clean:v32
      - run: node scripts/check-external-prerequisites-v32_10.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v32-10-external-prerequisites
          path: evidence/generated/V32_10_EXTERNAL_PREREQUISITES.json

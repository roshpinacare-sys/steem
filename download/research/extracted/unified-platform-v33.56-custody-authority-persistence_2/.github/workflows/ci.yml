name: canonical-proof-scalable-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  V32_6_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
  V32_6_RUN_DIR: ${{ github.workspace }}/evidence/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      shard_matrix: ${{ steps.plan.outputs.shard_matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22.16.0, cache: npm}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/tsconfig.tsbuildinfo
          key: tsbuild-v32-6-${{ runner.os }}-${{ hashFiles('package-lock.json','tsconfig.json','src/**/*.ts','tests/**/*.ts') }}
      - run: npm ci --ignore-scripts
      - run: npm run build:incremental:v32.6
      - run: python3 scripts/profile-tests-v32_6.py --workers 4 --samples 1
      - run: python3 scripts/run-tests-v32_6.py --mode core --no-build
      - id: plan
        run: python3 scripts/plan-ci-shards-v32_6.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiled-and-plan-v32-6
          path: |
            dist
            evidence/runs/${{ env.V32_6_RUN_ID }}
          retention-days: 3
  full-shard:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.core.outputs.shard_matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22.16.0, cache: npm}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with: {name: compiled-and-plan-v32-6, path: .}
      - run: python3 scripts/run-tests-v32_6.py --mode full --no-build --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }} --concurrency 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-shard-${{ matrix.shard_index }}
          path: evidence/runs/${{ env.V32_6_RUN_ID }}/V32_6_FULL_SHARD_*
          retention-days: 14
  full-aggregate:
    needs: [core, full-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22.16.0}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with: {name: compiled-and-plan-v32-6, path: .}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with: {pattern: full-shard-*, path: evidence/runs/${{ env.V32_6_RUN_ID }}, merge-multiple: true}
      - run: node scripts/aggregate-test-shards-v32_6.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributed-full-evidence
          path: evidence/runs/${{ env.V32_6_RUN_ID }}/V32_6_DISTRIBUTED_SHARD_AGGREGATE.json
          retention-days: 30
  qualification:
    needs: full-aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22.16.0, cache: npm}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with: {name: compiled-and-plan-v32-6, path: .}
      - run: python3 scripts/run-tests-v32_6.py --mode qualification --no-build

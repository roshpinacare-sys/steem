name: sovereign-private-pilot-v20
services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: sovereign
      POSTGRES_USER: sovereign_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/v20/001_canonical_runtime.sql:/docker-entrypoint-initdb.d/001_canonical_runtime.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign_app -d sovereign"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    networks: ["internal"]

  app:
    build:
      context: ../..
      dockerfile: infra/private-server/Containerfile
    environment:
      PORT: "4319"
      V20_DATA_ROOT: /var/lib/sovereign
      V20_POSTGRES_URL: postgresql://sovereign_app@postgres:5432/sovereign
      V20_KEYSTORE_PASSPHRASE_FILE: /run/secrets/keystore_passphrase
      V20_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      V20_ALLOWED_ORIGIN: https://localhost:8443
    secrets:
      - keystore_passphrase
      - bootstrap_token
    volumes:
      - app-data:/var/lib/sovereign
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    networks: ["internal"]
    ports:
      - "127.0.0.1:4319:4319"

networks:
  internal:
    internal: true
volumes:
  postgres-data:
  app-data:
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  keystore_passphrase:
    file: ./secrets/keystore_passphrase.txt
  bootstrap_token:
    file: ./secrets/bootstrap_token.txt

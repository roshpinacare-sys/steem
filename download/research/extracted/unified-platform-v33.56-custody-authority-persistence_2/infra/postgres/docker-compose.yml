services:
  postgres:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: canonical_proof
      POSTGRES_USER: canonical
      POSTGRES_PASSWORD: local-proof-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canonical -d canonical_proof"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

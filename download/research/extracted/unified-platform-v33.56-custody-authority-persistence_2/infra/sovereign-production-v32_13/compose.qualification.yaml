name: sovereign-efficiency-v32-13-qualification
services:
  postgres:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: sovereign
      POSTGRES_USER: sovereign_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/v23/001_canonical_runtime.sql:/docker-entrypoint-initdb.d/001_canonical_runtime.sql:ro
      - ./postgres/001_efficiency_fabric.sql:/docker-entrypoint-initdb.d/002_efficiency_fabric.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign_app -d sovereign"]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [internal]
  app:
    build:
      context: ../..
      dockerfile: infra/private-server/Containerfile
    environment:
      PORT: "4319"
      NODE_ENV: production
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
networks:
  internal:
    internal: true
volumes:
  postgres-data:
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

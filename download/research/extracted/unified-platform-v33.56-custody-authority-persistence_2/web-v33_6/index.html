<!doctype html>
<html lang="en" dir="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2850">
  <title>Sovereign Approval Pilot</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to approval</a>
<header><p class="eyebrow">V33.6 · Shadow-only human pilot</p><h1>One clear decision</h1><p id="boundary">This pilot records intent. It cannot execute an external action.</p></header>
<main id="main">
  <section id="start-panel" class="card" aria-labelledby="start-title">
    <h2 id="start-title">Start local pilot</h2>
    <label for="tenant">Tenant</label><input id="tenant" value="tenant-1" autocomplete="organization">
    <label for="user">User</label><input id="user" value="reviewer-1" autocomplete="username">
    <label for="device">Device</label><input id="device" value="phone-1" autocomplete="off">
    <button id="start" type="button">Start pilot</button>
  </section>
  <section id="approval" class="card" aria-labelledby="title" hidden>
    <p class="badge" id="status">Awaiting your decision</p>
    <h2 id="title">Loading…</h2>
    <p id="summary"></p>
    <dl><div><dt>Risk</dt><dd id="risk"></dd></div><div><dt>Cost</dt><dd id="cost"></dd></div><div><dt>Rollback</dt><dd id="rollback"></dd></div><div><dt>Scope</dt><dd id="scope"></dd></div></dl>
    <div class="actions" role="group" aria-label="Approval decision">
      <button data-action="YES" class="yes">Yes</button>
      <button data-action="NO" class="no">No</button>
      <button data-action="CHANGE_CONDITIONS">Change conditions</button>
      <button data-action="EXPLAIN">Explain</button>
    </div>
    <p id="result" role="status" aria-live="polite"></p>
  </section>
</main>
<div id="announcer" class="sr-only" aria-live="assertive"></div>
<script src="/app.js" defer></script>
</body>
</html>

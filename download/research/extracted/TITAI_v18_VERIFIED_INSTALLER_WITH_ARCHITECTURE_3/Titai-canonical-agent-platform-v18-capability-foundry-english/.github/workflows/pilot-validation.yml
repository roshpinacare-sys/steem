name: Controlled Pilot Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "e2e/**"
      - "scripts/**"
      - "drizzle/**"
      - "package-lock.json"
      - ".github/workflows/pilot-validation.yml"

permissions:
  contents: read

concurrency:
  group: pilot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-browser-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AUTH_SECRET: ci-only-auth-secret-32-bytes-2026
      ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcy1sb25nISE=
      DATABASE_PATH: ./data/titai-pilot.db
      NEXT_TELEMETRY_DISABLED: "1"
      TITAI_ALLOW_DESTRUCTIVE_SEED: "1"
      TITAI_DEMO_PASSWORD: ci-pilot-password-only-2026
      TITAI_RUNNER_MODE: durable_opt_in
      CI: "1"
      E2E_EMAIL: demo@titai.dev
      E2E_PASSWORD: ci-pilot-password-only-2026
    steps:
      - name: Checkout pinned source action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Record environment
        run: |
          mkdir -p docs/canonical/evidence/v14/ci
          node --version | tee docs/canonical/evidence/v14/ci/node-version.txt
          npm --version | tee docs/canonical/evidence/v14/ci/npm-version.txt
          uname -a | tee docs/canonical/evidence/v14/ci/kernel.txt

      - name: Install lockfile dependencies with native build
        run: npm ci --no-audit --no-fund

      - name: Validate pinned workflow actions
        run: npm run ci:pins

      - name: Validate source and migrations
        run: |
          npm run canonical:validate
          npm run language:validate
          npm run lint
          npm run db:migrations:validate
          npm run typecheck

      - name: Run full safe and v14 suites
        run: |
          npm run test:safe
          npm run test:v14
          npm run eval:baseline
          npm run durable:prove
          npm run mutation:v13
          npm run pilot:v14:prove

      - name: Run persistence suites with native driver
        env:
          TITAI_SQLITE_DRIVER: better-sqlite3
        run: npm run test:persistence

      - name: Run persistence suites with built-in fallback
        env:
          TITAI_SQLITE_DRIVER: node:sqlite
          NODE_NO_WARNINGS: "1"
        run: npm run test:persistence

      - name: Migrate and seed clean pilot database
        run: |
          rm -rf data
          mkdir -p data
          npm run db:migrate
          npm run seed
          npm run verify-audit

      - name: Production build
        run: npm run build

      - name: Install pinned Playwright browser package
        run: npx playwright install --with-deps chromium firefox

      - name: Browser E2E and accessibility
        run: npm run e2e

      - name: Generate candidate evidence
        if: always()
        run: npm run pilot:evidence -- --ci

      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: titai-v14-pilot-evidence-${{ github.run_id }}
          path: |
            docs/canonical/evidence/v14
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

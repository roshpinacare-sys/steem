name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-secret-32-bytes-long-for-ci-only-xx
      ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcy1sb25nISE=
      DATABASE_PATH: ./data/titai.db
      NEXT_TELEMETRY_DISABLED: "1"
      TITAI_ALLOW_DESTRUCTIVE_SEED: "1"
      TITAI_DEMO_PASSWORD: ci-demo-password-only-2026
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Canonical validation
        run: npm run canonical:validate

      - name: English-only validation
        run: npm run language:validate

      - name: Source lint
        run: npm run lint

      - name: Validate SQL migrations without application startup
        run: npm run db:migrations:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Deterministic baseline evaluation
        run: npm run eval:baseline

      - name: Durable recovery tests
        run: npm run test:durable

      - name: Durable crash and restore proof
        run: npm run durable:prove

      - name: Unit tests (engine, policy, audit, runner, canvas)
        run: npm test

      - name: Migrate + seed
        run: |
          npm run db:migrate
          npm run seed

      - name: Verify audit chain
        run: npm run verify-audit

      - name: Generate release evidence
        run: npm run release:evidence

      - name: v12 focused adversarial tests
        run: npm run test:v12

      - name: Repeatable adversarial roast
        run: npm run roast:static && npm run roast:validate && npm run roast:dynamic

      - name: Targeted mutation probes
        run: npm run mutation:v12

      - name: Deterministic microbenchmarks
        run: npm run benchmark:v12

      - name: Release audit
        run: npm run release:audit

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run e2e
        env:
          CI: "1"
          PLAYWRIGHT_CHROMIUM_PATH: ""
          E2E_EMAIL: demo@titai.dev
          E2E_PASSWORD: ci-demo-password-only-2026

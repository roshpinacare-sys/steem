openapi: "3.1.0"
info:
  title: TFA Sovereign Kernel API
  version: "0.2.0"
  description: >
    TFA Sovereign Kernel — the 36-operation subset of the full TFA API
    that is implemented by sovereign-routes.ts. Generated by scripts/gen-sovereign-spec.mjs.
    Do not edit by hand — regenerate by running: node scripts/gen-sovereign-spec.mjs

servers:
  - url: /api

paths:
  /auth/api-keys:
    get:
      operationId: authApiKeysList
      summary: List API keys for the authenticated tenant
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                type: object
                required: [ok, keys]
                properties:
                  ok:   { type: boolean }
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        keyId:     { type: string }
                        tenantId:  { type: string }
                        name:      { type: string }
                        scopes:    { type: array, items: { type: string } }
                        createdAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
        "400": { description: Missing x-tenant-id or x-api-key }
    post:
      operationId: authApiKeysCreate
      summary: Create a new API key for the current tenant (secret shown once)
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:      { type: string }
                expiresAt: { type: string, format: date-time }
                scopes:    { type: array, items: { type: string } }
      responses:
        "201":
          description: API key created (secret shown once)
          content:
            application/json:
              schema:
                type: object
                required: [ok, key, secret]
                properties:
                  ok:     { type: boolean }
                  secret: { type: string, description: "Raw API key — shown exactly once. Prefix: tfa_" }
                  key:
                    type: object
                    properties:
                      keyId:     { type: string }
                      tenantId:  { type: string }
                      name:      { type: string }
                      scopes:    { type: array, items: { type: string } }
                      createdAt: { type: string, format: date-time }
                      expiresAt: { type: string, format: date-time }
        "400": { description: Missing name or invalid input }

  /auth/api-keys/{keyId}:
    delete:
      operationId: authApiKeysRevoke
      summary: Revoke an API key
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Key revoked
        "400": { description: Missing x-tenant-id or x-api-key }
        "404":
          description: Key not found (or belongs to another tenant)

  # ─── INSIGHTS ────────────────────────────────────────────────────────────────
  /ledger/accounts:
    post:
      operationId: createLedgerAccount
      tags: [ledger]
      summary: Create a sovereign ledger account (μ¢)
      responses:
        "201": { description: Account created }
        "400": { description: Missing fields or tenant }
  /ledger/accounts/{id}:
    get:
      operationId: getLedgerAccount
      tags: [ledger]
      summary: Get account (tenant-isolated)
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account: { type: object }
        "404": { description: Not found / cross-tenant }
  /ledger/mint:
    post:
      operationId: ledgerMint
      tags: [ledger]
      summary: Mint μ¢ (guarded, fail-closed, audited)
      responses:
        "200":
          description: Minted
          content:
            application/json:
              schema:
                type: object
                required: [ok, auditId]
                properties:
                  ok:       { type: boolean }
                  auditId:  { type: string }
        "403": { description: Guard denied }
  /ledger/transfer:
    post:
      operationId: ledgerTransfer
      tags: [ledger]
      summary: Transfer μ¢ between accounts (guarded)
      responses:
        "200":
          description: Transferred
          content:
            application/json:
              schema:
                type: object
                required: [ok, auditId]
                properties:
                  ok:      { type: boolean }
                  auditId: { type: string }
        "403": { description: Guard denied }
  /ledger/solvency:
    get:
      operationId: ledgerSolvency
      tags: [ledger]
      summary: Proof of solvency (integrity check)
      responses:
        "200":
          description: Solvency proof
          content:
            application/json:
              schema:
                type: object
                required: [ok, auditId, data]
                properties:
                  ok:      { type: boolean }
                  auditId: { type: string }
                  data:    { type: object }
  /potential/profile:
    post:
      operationId: potentialProfile
      tags: [potential]
      summary: Build a personality/strength profile (Potential Engine)
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [ok, auditId]
                properties:
                  ok:      { type: boolean }
                  auditId: { type: string }
        "400": { description: Invalid input }
  /potential/personality:
    post:
      operationId: potentialPersonalityMap
      tags: [potential]
      summary: Map personality from signals (computes + persists PersonalityProfile)
      responses:
        "200":
          description: PersonalityProfile
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:   { type: boolean }
                  data: { type: object }
        "400": { description: Missing userId }
  /potential/personality/{userId}:
    get:
      operationId: getPotentialPersonality
      tags: [potential]
      summary: Load a previously-saved PersonalityProfile (tenant-scoped)
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200": { description: PersonalityProfile }
        "400": { description: Missing userId }
        "404": { description: Not found }
  /potential/success-path:
    post:
      operationId: computeSuccessPath
      tags: [potential]
      summary: Compute a learning path toward a target opportunity
      responses:
        "200": { description: SuccessPath }
        "400": { description: Validation error }
        "404": { description: Opportunity not found }
  /potential/success-path/{userId}/{opportunityId}:
    get:
      operationId: getSuccessPath
      tags: [potential]
      summary: Load a previously-computed SuccessPath
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
        - in: path
          name: opportunityId
          required: true
          schema: { type: string }
      responses:
        "200": { description: SuccessPath }
        "400": { description: Validation error }
        "404": { description: Not found }
  /potential/collaboration:
    post:
      operationId: findCollaborators
      tags: [potential]
      summary: Find best collaboration partners for a user (tenant-scoped)
      responses:
        "200": { description: CollaborationMatch array }
        "400": { description: Validation error }
  /potential/collaboration/{userId}:
    get:
      operationId: getCachedCollaborators
      tags: [potential]
      summary: Load cached collaboration matches for a user
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: CollaborationMatch array
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches: { type: array, items: { type: object } }
        "400": { description: Missing userId }
        "404": { description: No cache found }
  /escrow:
    post:
      operationId: createEscrow
      tags: [escrow]
      summary: Create an escrow agreement (no money moves yet)
      responses:
        "201":
          description: EscrowAgreement created
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "400": { description: Validation error }
  /escrow/{id}:
    get:
      operationId: getEscrow
      tags: [escrow]
      summary: Fetch an escrow agreement by id (tenant-scoped)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: EscrowAgreement
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
  /escrow/{id}/fund:
    post:
      operationId: fundEscrow
      tags: [escrow]
      summary: Fund escrow — payer to escrow transfer (created→funded)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: EscrowAgreement funded
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "409": { description: Wrong state }
  /escrow/{id}/release:
    post:
      operationId: releaseEscrow
      tags: [escrow]
      summary: Release escrow to worker on completion (funded→released)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: EscrowAgreement released
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "409": { description: Wrong state }
  /escrow/{id}/refund:
    post:
      operationId: refundEscrow
      tags: [escrow]
      summary: Refund escrow to payer on cancellation (funded→refunded)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: EscrowAgreement refunded
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "409": { description: Wrong state }
  /escrow/{id}/dispute:
    post:
      operationId: disputeEscrow
      tags: [escrow]
      summary: Freeze a funded escrow (funded→disputed)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: EscrowAgreement disputed
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "409": { description: Wrong state }
  /escrow/{id}/undispute:
    post:
      operationId: undisputeEscrow
      tags: [escrow]
      summary: Unfreeze a disputed escrow (disputed→funded)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: EscrowAgreement undisputed
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "409": { description: Wrong state }
        "403": { description: Unauthorized }

  # ─── SETTLEMENT ──────────────────────────────────────────────────────────────
  /settlement:
    post:
      operationId: createSettlement
      tags: [settlement]
      summary: Create a settlement agreement (no money moves yet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opportunityId, payerAccountId, workerAccountId, totalAmount, settledBy]
              properties:
                opportunityId:    { type: string }
                payerAccountId:   { type: string }
                workerAccountId:  { type: string }
                totalAmount:      { type: string, description: "Total amount in μ¢ (BigInt-safe decimal string)" }
                settledBy:        { type: string, description: "Identity authorized to settle/approve" }
                thresholdAmount:  { type: string, description: "Optional threshold in μ¢ above which a threshold-approval token is required" }
      responses:
        "201":
          description: Settlement agreement created
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "400": { description: Validation error }
    get:
      operationId: listSettlements
      tags: [settlement]
      summary: List settlement agreements for the tenant
      responses:
        "200":
          description: List of settlement agreements
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreements]
                properties:
                  ok:         { type: boolean }
                  agreements: { type: array, items: { type: object } }
        "400": { description: Missing x-tenant-id }
  /settlement/{id}:
    get:
      operationId: getSettlement
      tags: [settlement]
      summary: Fetch a settlement agreement by id (tenant-scoped)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Settlement agreement
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "400": { description: Missing x-tenant-id or id }
        "404": { description: Not found }
  /settlement/{id}/fund:
    post:
      operationId: fundSettlement
      tags: [settlement]
      summary: Fund settlement — payer to escrow transfer (created→held)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initiatedBy]
              properties:
                initiatedBy: { type: string }
      responses:
        "200":
          description: Settlement funded
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "422": { description: Wrong state or insufficient funds }
  /settlement/{id}/partial-release:
    post:
      operationId: partialReleaseSettlement
      tags: [settlement]
      summary: Partially release held funds to worker
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initiatedBy, amount]
              properties:
                initiatedBy:            { type: string }
                amount:                   { type: string, description: "Amount in μ¢ to release" }
                thresholdApprovalToken:   { type: string, description: "Required when amount exceeds the agreement's thresholdAmount" }
      responses:
        "200":
          description: Partial release executed
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "422": { description: Wrong state, insufficient funds, or threshold approval required }
  /settlement/{id}/release:
    post:
      operationId: releaseSettlement
      tags: [settlement]
      summary: Full release of remaining held funds to worker
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initiatedBy]
              properties:
                initiatedBy:            { type: string }
                thresholdApprovalToken:   { type: string, description: "Required when remaining amount exceeds the agreement's thresholdAmount" }
      responses:
        "200":
          description: Full release executed
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "422": { description: Wrong state or threshold approval required }
  /settlement/{id}/dispute:
    post:
      operationId: disputeSettlement
      tags: [settlement]
      summary: Freeze a funded settlement (funded→disputed)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initiatedBy]
              properties:
                initiatedBy: { type: string }
                reason:      { type: string }
      responses:
        "200":
          description: Settlement disputed
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "422": { description: Wrong state }
  /settlement/{id}/reverse:
    post:
      operationId: reverseSettlement
      tags: [settlement]
      summary: Reverse a disputed settlement back to payer (disputed→reversed)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initiatedBy]
              properties:
                initiatedBy: { type: string }
      responses:
        "200":
          description: Settlement reversed
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "422": { description: Wrong state }
  /settlement/{id}/threshold-approval:
    post:
      operationId: generateThresholdApproval
      tags: [settlement]
      summary: Generate a single-use threshold approval token for high-value releases
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvedBy, maxAmount]
              properties:
                approvedBy: { type: string, description: "Must match the settlement's settledBy authority" }
                maxAmount:  { type: string, description: "Maximum amount this token authorizes, in μ¢" }
      responses:
        "201":
          description: Threshold approval token generated
          content:
            application/json:
              schema:
                type: object
                required: [ok, approval]
                properties:
                  ok:      { type: boolean }
                  approval:
                    type: object
                    required: [id, agreementId, maxAmount, approvedBy, issuedAt, expiresAt, token]
                    properties:
                      id:          { type: string }
                      agreementId: { type: string }
                      maxAmount:   { type: string }
                      approvedBy:  { type: string }
                      issuedAt:    { type: string, format: date-time }
                      expiresAt:   { type: string, format: date-time }
                      token:       { type: string }
        "400": { description: Validation error }
        "403": { description: approvedBy does not match settlement authority }
        "404": { description: Settlement not found }

  # ─── WEBHOOKS ────────────────────────────────────────────────────────────────
  /webhooks:
    post:
      operationId: registerWebhook
      tags: [webhooks]
      summary: Register a webhook endpoint for settlement events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:    { type: string, format: uri }
                events: { type: array, items: { type: string }, description: "Event types to subscribe to (e.g. settlement.created, settlement.funded)" }
                secret: { type: string, description: "Optional HMAC secret for payload signature verification" }
      responses:
        "201":
          description: Webhook registered
          content:
            application/json:
              schema:
                type: object
                required: [ok, registration]
                properties:
                  ok:           { type: boolean }
                  registration:
                    type: object
                    required: [id, tenantId, url, events, createdAt, active]
                    properties:
                      id:        { type: string }
                      tenantId:  { type: string }
                      url:       { type: string }
                      events:    { type: array, items: { type: string } }
                      createdAt: { type: string, format: date-time }
                      active:    { type: boolean }
        "400": { description: Validation error }
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List webhook registrations for the tenant
      responses:
        "200":
          description: List of webhook registrations
          content:
            application/json:
              schema:
                type: object
                required: [ok, registrations]
                properties:
                  ok:            { type: boolean }
                  registrations: { type: array, items: { type: object } }
        "400": { description: Missing x-tenant-id }
  /webhooks/{id}:
    delete:
      operationId: deleteWebhook
      tags: [webhooks]
      summary: Delete a webhook registration
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Webhook deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok, deleted]
                properties:
                  ok:      { type: boolean }
                  deleted: { type: boolean }
        "400": { description: Missing x-tenant-id or id }
        "404": { description: Webhook registration not found }

  /track-record/{identityId}:
    get:
      operationId: getTrackRecord
      tags: [track-record]
      summary: Verified Track Record — deterministic read-model over the signed audit chain
      parameters:
        - in: path
          name: identityId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: TrackRecord
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:   { type: boolean }
                  data: { type: object }
        "400": { description: Validation error }
  /tenants:
    post:
      operationId: createTenant
      tags: [tenants]
      summary: >
        Tenant Onboarding — create tenant with root person, default policies,
        and first ledger account in one call. Idempotent: repeat call updates plan.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rootPersonName: { type: string, description: "Display name for the root identity (default: 'root')" }
                accountName:    { type: string, description: "Display name for the first ledger account (default: 'default')" }
                accountType:    { type: string, enum: [asset, liability, equity], default: asset }
                plan:
                  type: string
                  enum: [free, pro]
                  description: >
                    Subscription plan. Default 'free' on first creation.
                    On a repeat call, an explicit plan value re-assigns (upgrade/downgrade);
                    omitting it leaves the existing plan unchanged.
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                type: object
                required: [ok, tenantId, plan, created]
                properties:
                  ok:        { type: boolean }
                  tenantId:  { type: string }
                  plan:      { type: string, enum: [free, pro] }
                  created:   { type: boolean, description: "true if first creation, false if idempotent update" }
                  rootPerson:
                    type: object
                    properties:
                      id:   { type: string }
                      name: { type: string }
                  account:
                    type: object
                    properties:
                      id:      { type: string }
                      name:    { type: string }
                      type:    { type: string }
                      balance: { type: string, description: "Balance in μ¢ as decimal string (BigInt-safe)" }
                  policies: { type: array, items: { type: string } }
        "200":
          description: Tenant already exists (idempotent update)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:       { type: boolean }
                  tenantId: { type: string }
                  plan:     { type: string, enum: [free, pro] }
                  created:  { type: boolean }
        "400": { description: Missing x-tenant-id, invalid plan, or invalid input }

  # ─── INDEXER (Trust-Graph read-model) ─────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Tenant API key issued by POST /auth/api-keys. Format: tfa_<random>.
        The server resolves the tenantId from the key — no x-tenant-id header needed.
        Takes precedence over x-tenant-id when both are present.

        "500": { description: Export failed }

  /sovereignty/import:
    post:
      operationId: importTenantData
      tags: [sovereignty]
      summary: Restore a signed bundle (signature verified first)
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }

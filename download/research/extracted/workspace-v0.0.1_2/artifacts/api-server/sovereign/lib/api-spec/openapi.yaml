      operationId: registerWebhook
      tags: [webhooks]
      summary: Register a webhook endpoint for settlement events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:    { type: string, format: uri }
                events: { type: array, items: { type: string }, description: "Event types to subscribe to (e.g. settlement.created, settlement.funded)" }
                secret: { type: string, description: "Optional HMAC secret for payload signature verification" }
      responses:
        "201":
          description: Webhook registered
          content:
            application/json:
              schema:
                type: object
                required: [ok, registration]
                properties:
                  ok:           { type: boolean }
                  registration:
                    type: object
                    required: [id, tenantId, url, events, createdAt, active]
                    properties:
                      id:        { type: string }
                      tenantId:  { type: string }
                      url:       { type: string }
                      events:    { type: array, items: { type: string } }
                      createdAt: { type: string, format: date-time }
                      active:    { type: boolean }
        "400": { description: Validation error }
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List webhook registrations for the tenant
      responses:
        "200":
          description: List of webhook registrations
          content:
            application/json:
              schema:
                type: object
                required: [ok, registrations]
                properties:
                  ok:            { type: boolean }
                  registrations: { type: array, items: { type: object } }
        "400": { description: Missing x-tenant-id }
  /webhooks/{id}:

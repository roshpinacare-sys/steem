                  ok:      { type: boolean }
                  deleted: { type: boolean }
        "400": { description: Missing x-tenant-id or id }
        "404": { description: Webhook registration not found }

  /track-record/{identityId}:
    get:
      operationId: getTrackRecord
      tags: [track-record]
      summary: Verified Track Record — deterministic read-model over the signed audit chain
      parameters:
        - in: path
          name: identityId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: TrackRecord
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:   { type: boolean }
                  data: { type: object }
        "400": { description: Validation error }
  /tenants:
    get:
      operationId: getTenantPlan
      tags: [tenants]
      summary: Get current tenant plan
      description: Returns the authenticated tenant's registered plan badge.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tenant plan
          content:
            application/json:
              schema:
                type: object
                required: [ok, tenantId, plan]
                properties:
                  ok:      { type: boolean }
                  tenantId:{ type: string }
                  plan:
                    type: string
                    nullable: true
                    enum: [free, pro]
        "400": { description: Missing x-tenant-id or x-api-key }
    post:
      operationId: createTenant
      tags: [tenants]
      summary: >
        Tenant Onboarding — create tenant with root person, default policies,
        and first ledger account in one call. Idempotent: repeat call updates plan.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rootPersonName: { type: string, description: "Display name for the root identity (default: 'root')" }
                accountName:    { type: string, description: "Display name for the first ledger account (default: 'default')" }
                accountType:    { type: string, enum: [asset, liability, equity], default: asset }
                plan:
                  type: string
                  enum: [free, pro]
                  description: >
                    Subscription plan. Default 'free' on first creation.
                    On a repeat call, an explicit plan value re-assigns (upgrade/downgrade);
                    omitting it leaves the existing plan unchanged.
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                type: object
                required: [ok, tenantId, plan, created]
                properties:
                  ok:        { type: boolean }
                  tenantId:  { type: string }
                  plan:      { type: string, enum: [free, pro] }
                  created:   { type: boolean, description: "true if first creation, false if idempotent update" }
                  rootPerson:
                    type: object
                    properties:
                      id:   { type: string }
                      name: { type: string }
                  account:
                    type: object
                    properties:
                      id:      { type: string }
                      name:    { type: string }
                      type:    { type: string }
                      balance: { type: string, description: "Balance in μ¢ as decimal string (BigInt-safe)" }
                  policies: { type: array, items: { type: string } }
        "200":
          description: Tenant already exists (idempotent update)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:       { type: boolean }
                  tenantId: { type: string }
                  plan:     { type: string, enum: [free, pro] }
                  created:  { type: boolean }
        "400": { description: Missing x-tenant-id, invalid plan, or invalid input }


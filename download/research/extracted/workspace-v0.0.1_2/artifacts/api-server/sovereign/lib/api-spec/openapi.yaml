openapi: "3.1.0"
info:
  title: TFA API
  version: "0.2.0"
  description: >
    TFA — enterprise SaaS backend (TypeScript, Node 24, Express 5, Drizzle+PostgreSQL).
    ~41 endpoints across trust-plane core: ledger, escrow, execution, adapter,
    incidents, SLO, metering, DLQ.

servers:
  - url: /api

paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Service is healthy

  /readyz:
    get:
      operationId: readinessCheck
      summary: Readiness probe
      description: >
        Returns 200 when the server is ready to accept traffic
        (DB reachable, solvency green, chain verified).
        Returns 503 when draining or a dependency is unhealthy.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { type: string, enum: [ok] }
                  checks:
                    type: object
                    properties:
                      draining: { type: string }
                      db: { type: string }
                      solvency: { type: string }
                      chain: { type: string }
                      pqc: { type: string, description: "Active signer algorithm; prefixed sim: when the zero-dep PQC simulation fallback is active. Omitted if no signer was supplied to readyz." }
        "503":
          description: Not ready (draining or dependency failure)
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { type: string, enum: ["not ready"] }
                  checks:
                    type: object
                    properties:
                      draining: { type: string }
                      db: { type: string }
                      solvency: { type: string }
                      chain: { type: string }
                      pqc: { type: string, description: "Active signer algorithm; prefixed sim: when the zero-dep PQC simulation fallback is active. Omitted if no signer was supplied to readyz." }

  # ─── AUTH ────────────────────────────────────────────────────────────────────
  /auth/api-keys:
    get:
      operationId: authApiKeysList
      summary: List API keys for the authenticated tenant
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                type: object
                required: [ok, keys]
                properties:
                  ok:   { type: boolean }
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        keyId:     { type: string }
                        tenantId:  { type: string }
                        name:      { type: string }
                        scopes:    { type: array, items: { type: string } }
                        createdAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
        "400": { description: Missing x-tenant-id or x-api-key }
    post:
      operationId: authApiKeysCreate
      summary: Create a new API key for the current tenant (secret shown once)
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:      { type: string }
                expiresAt: { type: string, format: date-time }
                scopes:    { type: array, items: { type: string } }
      responses:
        "201":
          description: API key created (secret shown once)
          content:
            application/json:
              schema:
                type: object
                required: [ok, key, secret]
                properties:
                  ok:     { type: boolean }
                  secret: { type: string, description: "Raw API key — shown exactly once. Prefix: tfa_" }
                  key:
                    type: object
                    properties:
                      keyId:     { type: string }
                      tenantId:  { type: string }
                      name:      { type: string }
                      scopes:    { type: array, items: { type: string } }
                      createdAt: { type: string, format: date-time }
                      expiresAt: { type: string, format: date-time }
        "400": { description: Missing name or invalid input }

  /auth/api-keys/{keyId}:
    delete:
      operationId: authApiKeysRevoke
      summary: Revoke an API key
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Key revoked
        "400": { description: Missing x-tenant-id or x-api-key }
        "404":
          description: Key not found (or belongs to another tenant)

  # ─── INSIGHTS ────────────────────────────────────────────────────────────────
  /insights:
    get:
      operationId: getTenantInsights
      tags: [insights]
      summary: Tenant headline analytics
      description: >
        Aggregated trust and economic metrics for the tenant over a sliding window.
        Computed from the read-model (escrows + passports). TTL-cached for 30s on the default window.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: query
          name: windowDays
          required: false
          schema: { type: integer, minimum: 1 }
          description: Positive integer window in days (default 30).
        - in: query
          name: now
          required: false
          schema: { type: string, format: date-time }
          description: Override "now" for deterministic tests.
      responses:
        "200":
          description: Insights payload
          content:
            application/json:
              schema:
                type: object
                required: [ok, cached, insights]
                properties:
                  ok: { type: boolean }
                  cached: { type: boolean }
                  insights:
                    type: object
                    required: [tenantId, windowDays, settledCount, volumeMicrounits, heldMicrounits, disputeCount, proofsIssued, trustTrendDelta, trustTrend]
                    properties:
                      tenantId:        { type: string }
                      windowDays:      { type: integer }
                      settledCount:    { type: integer }
                      volumeMicrounits: { type: string, description: "BigInt μ¢ serialized as decimal string" }
                      heldMicrounits:   { type: string, description: "BigInt μ¢ serialized as decimal string" }
                      disputeCount:    { type: integer }
                      proofsIssued:    { type: integer }
                      trustTrendDelta: { type: number }
                      trustTrend:      { type: string }
        "400": { description: Invalid windowDays or missing x-tenant-id }
        "404": { description: Not found / cross-tenant }

  # ─── LEDGER ─────────────────────────────────────────────────────────────────
  /ledger/accounts:
    post:
      operationId: createLedgerAccount
      tags: [ledger]
      summary: Create a sovereign ledger account (μ¢)
      responses:
        "201": { description: Account created }
        "400": { description: Missing fields or tenant }
  /ledger/accounts/{id}:
    get:
      operationId: getLedgerAccount
      tags: [ledger]
      summary: Get account (tenant-isolated)
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account: { type: object }
        "404": { description: Not found / cross-tenant }
  /ledger/mint:
    post:
      operationId: ledgerMint
      tags: [ledger]
      summary: Mint μ¢ (guarded, fail-closed, audited)
      responses:
        "200":
          description: Minted
          content:
            application/json:
              schema:
                type: object
                required: [ok, auditId]
                properties:
                  ok:       { type: boolean }
                  auditId:  { type: string }
        "403": { description: Guard denied }
  /ledger/transfer:
    post:
      operationId: ledgerTransfer
      tags: [ledger]
      summary: Transfer μ¢ between accounts (guarded)
      responses:
        "200":
          description: Transferred
          content:
            application/json:
              schema:
                type: object
                required: [ok, auditId]
                properties:
                  ok:      { type: boolean }
                  auditId: { type: string }
        "403": { description: Guard denied }
  /ledger/solvency:
    get:
      operationId: ledgerSolvency
      tags: [ledger]
      summary: Proof of solvency (integrity check)
      responses:
        "200":
          description: Solvency proof
          content:
            application/json:
              schema:
                type: object
                required: [ok, auditId, data]
                properties:
                  ok:      { type: boolean }
                  auditId: { type: string }
                  data:    { type: object }
  /ledger/withdraw:
    post:
      operationId: ledgerWithdraw
      tags: [ledger]
      summary: Withdraw micro-cents from an account (guarded, audited)
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromAccountId, amount]
              properties:
                fromAccountId: { type: string, description: Account to debit }
                amount:        { type: string, description: Amount in micro-cents (BigInt string) }
                memo:          { type: string }
                initiatedBy:   { type: string }
      responses:
        "200":
          description: Withdrawal result
          content:
            application/json:
              schema:
                type: object
                required: [ok, auditId]
                properties:
                  ok:      { type: boolean }
                  auditId: { type: string }
                  data:    { type: object }
        "400": { description: Invalid input or insufficient funds }
        "403": { description: Scope denied or break-glass ticket invalid }

  /passport/public-key:
    get:
      operationId: getPassportPublicKey
      tags: [passport]
      summary: Return the kernel signer's public key for offline passport verification
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      responses:
        "200":
          description: Public key info
          content:
            application/json:
              schema:
                type: object
                required: [algorithm, publicKey]
                properties:
                  algorithm: { type: string, enum: [ed25519, hmac-sha256] }
                  publicKey:
                    type: string
                    nullable: true
                    description: SPKI PEM for ed25519; null for symmetric (hmac-sha256)

  /passport/{auditId}:
    get:
      operationId: getPassportByAuditId
      tags: [passport]
      summary: Issue (or retrieve) a signed Action Passport for an audit record
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - name: auditId
          in: path
          required: true
          schema: { type: string }
          description: Audit record ID
      responses:
        "200":
          description: Signed passport
          content:
            application/json:
              schema:
                type: object
                required: [passport]
                properties:
                  passport: { type: object }
        "400": { description: Missing or malformed auditId }
        "404": { description: Audit record not found or cross-tenant }

  /passports/{id}/status:
    get:
      operationId: getPassportStatus
      tags: [passport]
      summary: Return a signed PassportClaim about the status of a passport
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Passport / audit ID
      responses:
        "200":
          description: Signed PassportClaim
          content:
            application/json:
              schema:
                type: object
                required: [claim]
                properties:
                  claim: { type: object }
        "400": { description: Missing id }
        "404": { description: Passport not found or cross-tenant }

  # ─── PASSPORT REVOCATION (per-passport denylist, v381 + OpenAPI backfill v392) ─
  /passports/revoke:
    post:
      operationId: revokePassport
      tags: [passport]
      summary: Revoke a specific passport (denylist by passportId, independent of kid revocation)
      description: >
        Idempotent: revoking an already-revoked passport is a safe no-op — the
        original entry (and its reason) is preserved and returned unchanged,
        never overwritten by a second call.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passportId]
              properties:
                passportId: { type: string, description: Passport ID to revoke }
                reason: { type: string, description: "Optional human-readable reason (e.g. fraudulent_transfer, policy_violation)" }
      responses:
        "200":
          description: Passport revoked (or was already revoked — same entry returned)
          content:
            application/json:
              schema:
                type: object
                required: [ok, entry]
                properties:
                  ok: { type: boolean }
                  entry: { type: object, description: RevocationEntry { passportId, tenantId, revokedAt, reason } }
        "400": { description: Missing/empty passportId, or missing x-tenant-id }

  /passports/{passportId}/revocation:
    get:
      operationId: getPassportRevocationStatus
      tags: [passport]
      summary: Check whether a specific passport is revoked
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: path
          name: passportId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revocation status — revoked:false and entry:null when the passport was never revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok, revoked, entry]
                properties:
                  ok: { type: boolean }
                  revoked: { type: boolean }
                  entry: { type: object, nullable: true, description: RevocationEntry, or null when not revoked }
        "400": { description: Missing passportId param, or missing x-tenant-id }

  /passports/revocations:
    get:
      operationId: listPassportRevocations
      tags: [passport]
      summary: List all revocation entries for the tenant, oldest-first
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revocation list (empty array for a tenant with no revocations)
          content:
            application/json:
              schema:
                type: object
                required: [ok, revocations, total]
                properties:
                  ok: { type: boolean }
                  revocations: { type: array, items: { type: object } }
                  total: { type: integer }
        "400": { description: Missing x-tenant-id }

  /potential/profile:
    post:
      operationId: potentialProfile
      tags: [potential]
      summary: Build a personality/strength profile (Potential Engine)
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [ok, auditId]
                properties:
                  ok:      { type: boolean }
                  auditId: { type: string }
        "400": { description: Invalid input }
  /potential/personality:
    post:
      operationId: potentialPersonalityMap
      tags: [potential]
      summary: Map personality from signals (computes + persists PersonalityProfile)
      responses:
        "200":
          description: PersonalityProfile
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:   { type: boolean }
                  data: { type: object }
        "400": { description: Missing userId }
  /potential/personality/{userId}:
    get:
      operationId: getPotentialPersonality
      tags: [potential]
      summary: Load a previously-saved PersonalityProfile (tenant-scoped)
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200": { description: PersonalityProfile }
        "400": { description: Missing userId }
        "404": { description: Not found }
  /potential/success-path:
    post:
      operationId: computeSuccessPath
      tags: [potential]
      summary: Compute a learning path toward a target opportunity
      responses:
        "200": { description: SuccessPath }
        "400": { description: Validation error }
        "404": { description: Opportunity not found }
  /potential/success-path/{userId}/{opportunityId}:
    get:
      operationId: getSuccessPath
      tags: [potential]
      summary: Load a previously-computed SuccessPath
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
        - in: path
          name: opportunityId
          required: true
          schema: { type: string }
      responses:
        "200": { description: SuccessPath }
        "400": { description: Validation error }
        "404": { description: Not found }
  /potential/collaboration:
    post:
      operationId: findCollaborators
      tags: [potential]
      summary: Find best collaboration partners for a user (tenant-scoped)
      responses:
        "200": { description: CollaborationMatch array }
        "400": { description: Validation error }
  /potential/collaboration/{userId}:
    get:
      operationId: getCachedCollaborators
      tags: [potential]
      summary: Load cached collaboration matches for a user
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: CollaborationMatch array
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches: { type: array, items: { type: object } }
        "400": { description: Missing userId }
        "404": { description: No cache found }
  /potential/collaboration/{escrowId}/complete:
    post:
      operationId: completeCollaboration
      tags: [potential]
      summary: Mark a collaboration as complete and release escrow
      description: >
        Funds the escrow (if not yet funded) then releases to the worker.
        Both steps flow through the ledger orchestrator (guard→audit→passport).
        Returns the final agreement and an ActionPassport when a signer is wired.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: path
          name: escrowId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                initiatedBy: { type: string, description: "User or system initiating completion" }
      responses:
        "200":
          description: Collaboration completed and escrow released
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
                  passport:
                    type: object
                    nullable: true
        "400": { description: Invalid input or completion failed }
        "403": { description: Denied by guard or tenant isolation violation }
        "404": { description: Escrow not found }
        "409": { description: Wrong state for completion }
  /escrow:
    get:
      operationId: listEscrow
      tags: [escrow]
      summary: List tenant escrow agreements
      description: Returns all escrow agreements for the authenticated tenant.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Escrow list
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:   { type: boolean }
                  data:
                    type: object
                    required: [agreements]
                    properties:
                      agreements:
                        type: array
                        items: { type: object }
        "400": { description: Missing x-tenant-id or x-api-key }
    post:
      operationId: createEscrow
      tags: [escrow]
      summary: Create an escrow agreement (no money moves yet)
      responses:
        "201":
          description: EscrowAgreement created
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "400": { description: Validation error }
  /escrow/{id}:
    get:
      operationId: getEscrow
      tags: [escrow]
      summary: Fetch an escrow agreement by id (tenant-scoped)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: EscrowAgreement
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
  /escrow/{id}/fund:
    post:
      operationId: fundEscrow
      tags: [escrow]
      summary: Fund escrow — payer to escrow transfer (created→funded)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: EscrowAgreement funded
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "409": { description: Wrong state }
  /escrow/{id}/release:
    post:
      operationId: releaseEscrow
      tags: [escrow]
      summary: Release escrow to worker on completion (funded→released)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: EscrowAgreement released
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "409": { description: Wrong state }
  /escrow/{id}/refund:
    post:
      operationId: refundEscrow
      tags: [escrow]
      summary: Refund escrow to payer on cancellation (funded→refunded)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: EscrowAgreement refunded
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "409": { description: Wrong state }
  /escrow/{id}/dispute:
    post:
      operationId: disputeEscrow
      tags: [escrow]
      summary: Freeze a funded escrow (funded→disputed)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: EscrowAgreement disputed
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "409": { description: Wrong state }
  /escrow/{id}/undispute:
    post:
      operationId: undisputeEscrow
      tags: [escrow]
      summary: Unfreeze a disputed escrow (disputed→funded)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: EscrowAgreement undisputed
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "409": { description: Wrong state }
        "403": { description: Unauthorized }

  # ─── SETTLEMENT ──────────────────────────────────────────────────────────────
  /settlement:
    post:
      operationId: createSettlement
      tags: [settlement]
      summary: Create a settlement agreement (no money moves yet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opportunityId, payerAccountId, workerAccountId, totalAmount, settledBy]
              properties:
                opportunityId:    { type: string }
                payerAccountId:   { type: string }
                workerAccountId:  { type: string }
                totalAmount:      { type: string, description: "Total amount in μ¢ (BigInt-safe decimal string)" }
                settledBy:        { type: string, description: "Identity authorized to settle/approve" }
                thresholdAmount:  { type: string, description: "Optional threshold in μ¢ above which a threshold-approval token is required" }
      responses:
        "201":
          description: Settlement agreement created
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "400": { description: Validation error }
    get:
      operationId: listSettlements
      tags: [settlement]
      summary: List settlement agreements for the tenant
      responses:
        "200":
          description: List of settlement agreements
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreements]
                properties:
                  ok:         { type: boolean }
                  agreements: { type: array, items: { type: object } }
        "400": { description: Missing x-tenant-id }
  /settlement/{id}:
    get:
      operationId: getSettlement
      tags: [settlement]
      summary: Fetch a settlement agreement by id (tenant-scoped)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Settlement agreement
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "400": { description: Missing x-tenant-id or id }
        "404": { description: Not found }
  /settlement/{id}/fund:
    post:
      operationId: fundSettlement
      tags: [settlement]
      summary: Fund settlement — payer to escrow transfer (created→held)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initiatedBy]
              properties:
                initiatedBy: { type: string }
      responses:
        "200":
          description: Settlement funded
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "422": { description: Wrong state or insufficient funds }
  /settlement/{id}/partial-release:
    post:
      operationId: partialReleaseSettlement
      tags: [settlement]
      summary: Partially release held funds to worker
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initiatedBy, amount]
              properties:
                initiatedBy:            { type: string }
                amount:                   { type: string, description: "Amount in μ¢ to release" }
                thresholdApprovalToken:   { type: string, description: "Required when amount exceeds the agreement's thresholdAmount" }
      responses:
        "200":
          description: Partial release executed
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "422": { description: Wrong state, insufficient funds, or threshold approval required }
  /settlement/{id}/release:
    post:
      operationId: releaseSettlement
      tags: [settlement]
      summary: Full release of remaining held funds to worker
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initiatedBy]
              properties:
                initiatedBy:            { type: string }
                thresholdApprovalToken:   { type: string, description: "Required when remaining amount exceeds the agreement's thresholdAmount" }
      responses:
        "200":
          description: Full release executed
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "422": { description: Wrong state or threshold approval required }
  /settlement/{id}/dispute:
    post:
      operationId: disputeSettlement
      tags: [settlement]
      summary: Freeze a funded settlement (funded→disputed)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initiatedBy]
              properties:
                initiatedBy: { type: string }
                reason:      { type: string }
      responses:
        "200":
          description: Settlement disputed
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "422": { description: Wrong state }
  /settlement/{id}/reverse:
    post:
      operationId: reverseSettlement
      tags: [settlement]
      summary: Reverse a disputed settlement back to payer (disputed→reversed)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initiatedBy]
              properties:
                initiatedBy: { type: string }
      responses:
        "200":
          description: Settlement reversed
          content:
            application/json:
              schema:
                type: object
                required: [ok, agreement]
                properties:
                  ok:        { type: boolean }
                  agreement: { type: object }
        "404": { description: Not found }
        "422": { description: Wrong state }
  /settlement/{id}/threshold-approval:
    post:
      operationId: generateThresholdApproval
      tags: [settlement]
      summary: Generate a single-use threshold approval token for high-value releases
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvedBy, maxAmount]
              properties:
                approvedBy: { type: string, description: "Must match the settlement's settledBy authority" }
                maxAmount:  { type: string, description: "Maximum amount this token authorizes, in μ¢" }
      responses:
        "201":
          description: Threshold approval token generated
          content:
            application/json:
              schema:
                type: object
                required: [ok, approval]
                properties:
                  ok:      { type: boolean }
                  approval:
                    type: object
                    required: [id, agreementId, maxAmount, approvedBy, issuedAt, expiresAt, token]
                    properties:
                      id:          { type: string }
                      agreementId: { type: string }
                      maxAmount:   { type: string }
                      approvedBy:  { type: string }
                      issuedAt:    { type: string, format: date-time }
                      expiresAt:   { type: string, format: date-time }
                      token:       { type: string }
        "400": { description: Validation error }
        "403": { description: approvedBy does not match settlement authority }
        "404": { description: Settlement not found }

  # ─── WEBHOOKS ────────────────────────────────────────────────────────────────
  /webhooks:

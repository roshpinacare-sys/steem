  /adapter/run:
    post:
      operationId: adapterRun
      summary: Submit an ActionIntent for TFA policy evaluation and execution
      description: >
        Accepts an ActionIntent, evaluates it through the TFA policy stack, and returns
        a signed ExecutionReceipt. Depending on the decision:
          - `allowed` → ExecutionWorkflow opened, receipt includes `executionId`, status `running`.
          - `approval_required` → workflow opened in `planned` state, receipt includes `approvalToken`.
          - `denied` → no workflow opened, receipt records denial.
        The receipt is cryptographically signed and always re-verified before returning.
      tags: [adapter]
      parameters:
        - in: header
          name: x-tenant-id
          required: false
          schema: { type: string }
          description: Tenant identifier. May be omitted when using x-api-key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actorId, toolId, resourceRef, riskClass]
              properties:
                actorId:
                  type: string
                  description: Agent or user identifier
                toolId:
                  type: string
                  description: Tool or action type identifier
                resourceRef:
                  type: string
                  description: Target resource reference
                riskClass:
                  type: string
                  enum: [low, medium, high, critical]
                  description: Risk classification of the action
                valueMicrounits:
                  type: string
                  description: Value in micro-cents (BigInt as decimal string). Default 0.
                privacyLevel:
                  type: string
                  enum: [public, internal, confidential, secret]
                  default: internal
                approvalPolicyRef:
                  type: string
                  default: default
                nonce:
                  type: string
                  description: Idempotency nonce; same nonce+tenant returns cached result
                expiry:
                  type: number
                  description: Unix ms timestamp after which intent is rejected
                provenance:
                  type: string
                  default: api
                evidencePolicy:
                  type: string
                  default: default
      responses:
        "201":
          description: Intent evaluated; receipt returned
          content:
            application/json:
              schema:
                type: object
                required: [ok, decision, receipt]
                properties:
                  ok: { type: boolean }
                  decision:
                    type: string
                    enum: [allowed, approval_required, denied]
                  approvalClass:
                    type: string
                    nullable: true
                  riskClass:
                    type: string
                  receipt:
                    type: object
                    description: Signed ExecutionReceipt
                    properties:
                      intentId: { type: string }
                      tenantId: { type: string }
                      actorId: { type: string }
                      toolId: { type: string }
                      resourceRef: { type: string }
                      decision: { type: string }
                      executionId:
                        type: string
                        nullable: true
                        description: Present when decision=allowed; ID of opened ExecutionWorkflow
                      approvalToken:
                        type: string
                        nullable: true
                        description: Present when decision=approval_required; use as :id in /approve
                      issuedAt: { type: string, format: date-time }
                      signature: { type: string }
                  workflow:
                    type: object
                    nullable: true
                    description: Serialized ExecutionWorkflow (present when a workflow was opened)
        "400": { description: Invalid intent body or missing required fields }
        "422": { description: Intent failed validation (e.g. expired, replay) }
        "500": { description: Internal error (e.g. receipt signature verification failed) }

  /execution:
    post:
      operationId: createExecution
      summary: Create a new ExecutionWorkflow
      description: >
        Creates a durable execution workflow for the given actionId.
        The workflow starts in `planned` status and transitions through
        the state machine as evidence is collected and the orchestrator
        advances it. Tenant-isolated; 400 on missing actionId.
      tags: [execution]
      parameters:
        - in: header
          name: x-tenant-id
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionId]
              properties:
                actionId: { type: string, description: "Canonical action identifier" }
                intentId: { type: string, description: "Optional linked ActionIntent id" }
                executionRef: { type: string, description: "Optional caller reference" }
                approvalId: { type: string, description: "Optional pre-approved approval id" }
                evidenceRefs:
                  type: array
                  items: { type: string }
                  description: "Optional list of evidence artifact ids"
                retryOfWorkflowId: { type: string, description: "Optional id of workflow being retried" }
      responses:
        "201":
          description: Workflow created
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflow]
                properties:
                  ok: { type: boolean }
                  workflow:
                    type: object
                    required: [id, tenantId, actionId, status, createdAt, updatedAt, runLogLength]
                    properties:
                      id: { type: string }
                      tenantId: { type: string }
                      actionId: { type: string }
                      status: { type: string }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      runLogLength: { type: integer }
        "400": { description: Missing actionId or invalid input }
        "500": { description: Internal error }
    get:
      operationId: listExecution
      summary: List workflows for the tenant
      description: >
        Returns all ExecutionWorkflows owned by the caller's tenant.
        Tenant-isolated; empty array when none exist.
      tags: [execution]
      parameters:
        - in: header
          name: x-tenant-id
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflows]
                properties:
                  ok: { type: boolean }
                  workflows:
                    type: array
                    items:
                      type: object
                      required: [id, tenantId, actionId, status, createdAt, updatedAt, runLogLength]
                      properties:
                        id: { type: string }
                        tenantId: { type: string }
                        actionId: { type: string }
                        status: { type: string }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                        runLogLength: { type: integer }
        "400": { description: Missing x-tenant-id }
        "500": { description: Internal error }

  /execution/{id}:
    get:
      operationId: getExecution
      summary: Get a workflow by id
      description: >
        Returns a single ExecutionWorkflow. Tenant-isolated:
        404 on cross-tenant or unknown id.
      tags: [execution]
      parameters:
        - in: header
          name: x-tenant-id
          required: false
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workflow found
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflow]
                properties:
                  ok: { type: boolean }
                  workflow:
                    type: object
                    required: [id, tenantId, actionId, status, createdAt, updatedAt, runLogLength]
                    properties:
                      id: { type: string }
                      tenantId: { type: string }
                      actionId: { type: string }
                      status: { type: string }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      runLogLength: { type: integer }
        "400": { description: Missing x-tenant-id or id }
        "404": { description: Workflow not found or cross-tenant access }
        "500": { description: Internal error }

  /execution/{id}/transition:
    post:
      operationId: transitionExecution
      summary: Transition workflow status
      description: >
        Moves a workflow to a new status (e.g., planned → running →
        evidence_collected → settled → proved). The actor and reason are
        recorded in the run log. Tenant-isolated; 404 on cross-tenant;
        422 on invalid transition.
      tags: [execution]
      parameters:
        - in: header
          name: x-tenant-id
          required: false
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toStatus, actor]
              properties:
                toStatus:
                  type: string
                  enum: [planned, approved, running, evidence_collected, settled, proved, failed, rejected]
                actor: { type: string, description: "Who is performing the transition" }
                reason: { type: string, description: "Human-readable reason" }
      responses:
        "200":
          description: Transition applied
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflow]
                properties:
                  ok: { type: boolean }
                  workflow:
                    type: object
                    required: [id, tenantId, actionId, status, createdAt, updatedAt, runLogLength]
                    properties:
                      id: { type: string }
                      tenantId: { type: string }
                      actionId: { type: string }
                      status: { type: string }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      runLogLength: { type: integer }
        "400": { description: Missing toStatus or actor }
        "404": { description: Workflow not found or cross-tenant access }
        "409": { description: Lease conflict }
        "422": { description: Invalid transition }
        "500": { description: Internal error }

  /execution/{id}/supervise:
    post:
      operationId: superviseExecution
      summary: Supervise (retry) a failed workflow
      description: >
        Triggered by the supervisor when a workflow has failed and a retry
        is attempted. Creates a retry workflow linked to the original.
        Tenant-isolated; 404 on cross-tenant; 422 if workflow is not failed.
      tags: [execution]
      parameters:
        - in: header
          name: x-tenant-id
          required: false
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId]
              properties:
                workerId: { type: string, description: "Worker attempting the retry" }
                retryConfig:
                  type: object
                  description: "Optional retry policy overrides"
      responses:
        "200":
          description: Supervision completed
          content:
            application/json:
              schema:
                type: object
                required: [ok, plan, original, retryWorkflow]
                properties:
                  ok: { type: boolean }
                  plan: { type: string, description: "Supervisor plan summary" }
                  original:
                    type: object
                    required: [id, tenantId, actionId, status, createdAt, updatedAt, runLogLength]
                    properties:
                      id: { type: string }
                      tenantId: { type: string }
                      actionId: { type: string }
                      status: { type: string }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      runLogLength: { type: integer }
                  retryWorkflow:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string }
                      tenantId: { type: string }
                      actionId: { type: string }
                      status: { type: string }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      runLogLength: { type: integer }
        "400": { description: Missing workerId or invalid retryConfig }
        "404": { description: Workflow not found or cross-tenant access }
        "422": { description: Workflow is not in failed status }
        "500": { description: Internal error }

  /execution/{id}/approve:
    post:
      operationId: approveExecution
      summary: Approve a pending (approval_required) workflow
      description: >
        Transitions a workflow from `planned` state (created by an `approval_required` decision)
        to `approved` → `running`. The `approvalToken` from the ExecutionReceipt is the workflow id.
        Only `planned` workflows may be approved; any other status returns 422.
      tags: [adapter]
      parameters:
        - in: header
          name: x-tenant-id
          required: false
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Workflow id (= approvalToken from POST /api/adapter/run receipt)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor:
                  type: string
                  default: tfa-approval
                  description: Who is approving (for audit log)
                reason:
                  type: string
                  description: Human-readable reason for approval
      responses:
        "200":
          description: Workflow approved and moved to running
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflow]
                properties:
                  ok: { type: boolean }
                  workflow:
                    type: object
                    properties:
                      id: { type: string }
                      tenantId: { type: string }
                      actionId: { type: string }
                      status:
                        type: string
                        enum: [running]
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      runLogLength: { type: integer }
        "400": { description: Missing x-tenant-id or id }
        "404": { description: Workflow not found or cross-tenant access }
        "422": { description: Workflow not in planned state }
        "500": { description: Internal error }

  /execution/{id}/receipt:
    get:
      operationId: getExecutionReceipt
      summary: Get a signed status receipt for a workflow
      description: >
        Returns a freshly-signed `ExecutionStatusReceipt` reflecting the workflow's
        current status. Useful for polling after `POST /api/execution/{id}/approve`
        to confirm the workflow is now `running`, or as a portable tamper-evident
        proof of state for webhooks and audit evidence.

        The receipt is self-verifying: any party with the signer's verify key can
        confirm both the workflow id and status without re-querying TFA.

        Tenant-isolated: 404 on cross-tenant or unknown workflow id.
      tags: [adapter]
      parameters:
        - in: header
          name: x-tenant-id
          required: false
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Workflow id (executionId or approvalToken from POST /api/adapter/run receipt)
      responses:
        "200":
          description: Signed status receipt for the workflow
          content:
            application/json:
              schema:
                type: object
                required: [ok, receipt, workflow]
                properties:
                  ok: { type: boolean }
                  receipt:
                    type: object
                    required: [version, executionId, tenantId, status, actorId, runLogLength, issuedAt, signature]
                    properties:
                      version:
                        type: string
                        enum: [tfa-status-receipt-v1]
                      executionId: { type: string }
                      tenantId: { type: string }
                      status:
                        type: string
                        enum: [planned, approved, running, evidence_collected, settled, proved, failed, rejected]
                      actorId: { type: string, description: "Actor from the last run-log entry" }
                      runLogLength: { type: integer, description: "Monotonically increasing — tamper-evident" }
                      issuedAt: { type: string, format: date-time }
                      signature: { type: string, description: "HMAC-SHA256 or Ed25519 over canonical payload" }
                  workflow:
                    type: object
                    properties:
                      id: { type: string }
                      tenantId: { type: string }
                      actionId: { type: string }
                      status: { type: string }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      runLogLength: { type: integer }
        "400": { description: Missing x-tenant-id or id }
        "404": { description: Workflow not found or cross-tenant access }
        "500": { description: Internal error (receipt verification failed) }

  /index/disputes/{id}:
    get:
      operationId: indexGetDispute
      summary: Get dispute projection by id
      tags: [indexer]
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dispute found
          content:
            application/json:
              schema:
                type: object
                required: [dispute]
                properties:
                  dispute: { type: object }
        "400": { description: Missing x-tenant-id }
        "404": { description: Dispute not found }

  /receipt/{workflowId}/link-mandates:
    post:
      operationId: linkMandates
      summary: Bind a workflow receipt to an AP2 mandate chain and return a Verifiable Credential
      description: >
        Accepts an array of AP2 MandateRef objects, signs a MandateLinkage binding the
        workflow's status receipt to the mandate chain, and returns a W3C Verifiable
        Credential carrying the linkage as credentialSubject evidence.
        Only workflows in approved/running/succeeded status may be linked.
      tags: [adapter]
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
        - in: path
          name: workflowId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mandates]
              properties:
                mandates:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [type, id]
                    properties:
                      type:
                        type: string
                        enum: [intent, cart, payment]
                      id:
                        type: string
                      hash:
                        type: string
      responses:
        "201":
          description: Linkage produced and VC returned
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflowId, status, linkage, vc]
                properties:
                  ok: { type: boolean }
                  workflowId: { type: string }
                  status: { type: string }
                  linkage: { type: object }
                  vc: { type: object }
        "400": { description: Invalid input (missing/malformed mandates or tenantId) }
        "404": { description: Workflow not found or cross-tenant access }
        "422": { description: Workflow status is not linkable (planned or failed) }
        "500": { description: Internal error (signature verification failed) }

  /receipt/verify:
    post:
      operationId: verifyReceipt
      summary: Verify an ExecutionReceipt's cryptographic signature and decision integrity
      description: >
        Accepts a signed ExecutionReceipt and performs two independent checks:
        1. Cryptographic signature validation (receipt + embedded decisionTrace).
        2. Decision-integrity re-derivation — re-computes the server-side risk
           classification, approval class, and expected decision from the toolId alone
           and compares them against the receipt's claims.
        Returns 200 with {ok, valid, signatureValid, decisionValid, reasons}.
      tags: [adapter]
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receipt]
              properties:
                receipt:
                  type: object
                  description: The ExecutionReceipt to verify
      responses:
        "200":
          description: Verification completed (valid may be true or false)
          content:
            application/json:
              schema:
                type: object
                required: [ok, valid, signatureValid, decisionValid, reasons]
                properties:
                  ok: { type: boolean }
                  valid: { type: boolean }
                  signatureValid: { type: boolean }
                  decisionValid: { type: boolean }
                  reasons:
                    type: array
                    items: { type: string }
        "400": { description: Missing or malformed receipt }

  # ─── KILL SWITCH (admin) ────────────────────────────────────────────────────
  /admin/kill-switch/engage:
    post:
      operationId: engageKillSwitch
      tags: [admin]
      summary: Engage the kill switch at a chosen scope
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, reason]
              properties:
                scope:
                  type: string
                  enum: [global, tenant, action_type]
                tenantId:
                  type: string
                  description: Required when scope is "tenant"
                actionType:
                  type: string
                  description: Required when scope is "action_type"
                reason:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Kill switch engaged
          content:
            application/json:
              schema:
                type: object
                required: [ok, scope, reason]
                properties:
                  ok: { type: boolean }
                  scope: { type: string }
                  reason: { type: string }
        "400": { description: Invalid scope, missing reason, or missing tenantId/actionType }
        "403": { description: Missing admin:kill-switch scope }

  /admin/kill-switch/disengage:
    post:
      operationId: disengageKillSwitch
      tags: [admin]
      summary: Disengage the kill switch at a chosen scope
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: string
                  enum: [global, tenant, action_type]
                tenantId:
                  type: string
                  description: Required when scope is "tenant"
                actionType:
                  type: string
                  description: Required when scope is "action_type"
      responses:
        "200":
          description: Kill switch disengaged
          content:
            application/json:
              schema:
                type: object
                required: [ok, scope]
                properties:
                  ok: { type: boolean }
                  scope: { type: string }
        "400": { description: Invalid scope or missing tenantId/actionType }
        "403": { description: Missing admin:kill-switch scope }

  /admin/kill-switch/status:
    get:
      operationId: getKillSwitchStatus
      tags: [admin]
      summary: Read the current kill-switch armed state and snapshot
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Kill switch status
          content:
            application/json:
              schema:
                type: object
                required: [ok, armed]
                properties:
                  ok: { type: boolean }
                  armed: { type: boolean }
                  snapshot: { type: object }
        "403": { description: Missing admin:kill-switch scope }

  # ─── EVAL ───────────────────────────────────────────────────────────────────
  /eval/run:
    get:
      operationId: runEval
      tags: [eval]
      summary: Run all golden tasks and return aggregate results
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Evaluation report
          content:
            application/json:
              schema:
                type: object
                required: [ok, overallMean, taskCount, tasks]
                properties:
                  ok: { type: boolean }
                  overallMean: { type: number }
                  scorecardMeans:
                    type: object
                    additionalProperties: { type: number }
                  taskCount: { type: integer }
                  tasks:
                    type: array
                    items: { type: object }
        "500": { description: Eval harness failure }

  /eval/run/{taskId}:
    get:
      operationId: runEvalTask
      tags: [eval]
      summary: Run a single golden task by ID
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Single task result
          content:
            application/json:
              schema:
                type: object
                required: [ok, task]
                properties:
                  ok: { type: boolean }
                  task: { type: object }
        "404": { description: Task not found }
        "500": { description: Eval task failure }

  # ─── CONFIDENCE ───────────────────────────────────────────────────────────────
  /confidence/evaluate:
    post:
      operationId: evaluateConfidence
      tags: [confidence]
      summary: Run an action through the ConfidenceGate and return a signed trace
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confidenceScore, actionType]
              properties:
                confidenceScore: { type: number, minimum: 0, maximum: 1 }
                actionType: { type: string }
                autoThreshold: { type: number }
                hitlThreshold: { type: number }
      responses:
        "200":
          description: Confidence gate verdict
          content:
            application/json:
              schema:
                type: object
                required: [ok, verdict, allow]
                properties:
                  ok: { type: boolean }
                  verdict: { type: string, enum: [auto, human, deny] }
                  allow: { type: boolean }
                  trace: { type: object, nullable: true }
        "400": { description: Invalid confidence gate configuration }
        "500": { description: Evaluation failure }

  /confidence/verify:
    post:
      operationId: verifyConfidenceTrace
      tags: [confidence]
      summary: Verify the signature on a ConfidenceGateTrace
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trace]
              properties:
                trace: { type: object }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required: [ok, valid]
                properties:
                  ok: { type: boolean }
                  valid: { type: boolean }
        "400": { description: Missing or malformed trace }

  # ─── MONITOR ─────────────────────────────────────────────────────────────────
  /monitor/status:
    get:
      operationId: getMonitorStatus
      tags: [monitor]
      summary: Cron audit status
      description: Returns the scheduled auditor's current state without triggering a run.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cron status snapshot
          content:
            application/json:
              schema:
                type: object
                required: [running, intervalMs, tenants, totalRuns]
                properties:
                  running: { type: boolean }
                  intervalMs: { type: integer }
                  lastRunAt: { type: string, nullable: true, format: date-time }
                  nextRunAt: { type: string, nullable: true, format: date-time }
                  tenants:
                    type: array
                    items: { type: string }
                  totalRuns: { type: integer }
                  results:
                    type: object
                    additionalProperties:
                      type: object
                      required: [tenantId, timestamp, isSolvent, accountsChecked, anomalies, alertSent]
                      properties:
                        tenantId: { type: string }
                        timestamp: { type: string, format: date-time }
                        isSolvent: { type: boolean }
                        accountsChecked: { type: integer }
                        anomalies:
                          type: array
                          items: { type: string }
                        alertSent: { type: boolean }
        "400": { description: Missing x-tenant-id or x-api-key }

  /monitor/run:
    post:
      operationId: runMonitorNow
      tags: [monitor]
      summary: Trigger an on-demand audit
      description: Runs a single-tenant solvency audit immediately and registers the tenant for future periodic sweeps.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Audit result
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, timestamp, isSolvent, accountsChecked, anomalies, alertSent]
                properties:
                  tenantId: { type: string }
                  timestamp: { type: string, format: date-time }
                  isSolvent: { type: boolean }
                  accountsChecked: { type: integer }
                  anomalies:
                    type: array
                    items: { type: string }
                  alertSent: { type: boolean }
        "400": { description: Missing x-tenant-id or x-api-key }
        "500": { description: Monitor run failed }

  # ─── TRANSPARENCY ────────────────────────────────────────────────────────────
  /transparency/chain:
    get:
      operationId: getTransparencyChain
      tags: [transparency]
      summary: Tenant audit chain with integrity check
      description: Returns the tenant's full audit chain ordered by insertion, plus a tamper-evident integrity flag.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Chain view
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, chainIntact, recordCount, records]
                properties:
                  tenantId: { type: string }
                  chainIntact: { type: boolean }
                  recordCount: { type: integer }
                  records:
                    type: array
                    items:
                      type: object
                      required: [id, actionType, source, outcome, occurredAt, prevHash, hash, signed]
                      properties:
                        id: { type: string }
                        actionType: { type: string }
                        source: { type: string }
                        outcome:
                          type: string
                          enum: [allowed, denied, error]
                        reason: { type: string }
                        occurredAt: { type: string, format: date-time }
                        prevHash: { type: string }
                        hash: { type: string }
                        signed: { type: boolean }
        "400": { description: Missing x-tenant-id or x-api-key }

  /transparency/balances:
    get:
      operationId: getTransparencyBalances
      tags: [transparency]
      summary: Tenant balances and solvency proof
      description: Returns all accounts with μ¢ balances as decimal strings plus a live solvency snapshot.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Balances view
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, accounts, solvency]
                properties:
                  tenantId: { type: string }
                  accounts:
                    type: array
                    items:
                      type: object
                      required: [id, ownerId, type, name, balance]
                      properties:
                        id: { type: string }
                        ownerId: { type: string }
                        type: { type: string }
                        name: { type: string }
                        balance: { type: string }
                  solvency:
                    type: object
                    required: [isSolvent, totalAssets, totalLiabilities, netEquity, accountCount, balanceHash, generatedAt]
                    properties:
                      isSolvent: { type: boolean }
                      totalAssets: { type: string }
                      totalLiabilities: { type: string }
                      netEquity: { type: string }
                      accountCount: { type: integer }
                      balanceHash: { type: string }
                      generatedAt: { type: string, format: date-time }
        "400": { description: Missing x-tenant-id or x-api-key }
        "500": { description: Failed to build balances view }

  /transparency/passports:
    get:
      operationId: getTransparencyPassports
      tags: [transparency]
      summary: Lightweight passport summaries
      description: Returns summaries of allowed audit records with links to full signed passports. Efficient regardless of chain length.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Passport list view
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, count, passports]
                properties:
                  tenantId: { type: string }
                  count: { type: integer }
                  passports:
                    type: array
                    items:
                      type: object
                      required: [auditId, actionType, outcome, occurredAt, passportHref]
                      properties:
                        auditId: { type: string }
                        actionType: { type: string }
                        outcome:
                          type: string
                          enum: [allowed, denied, error]
                        occurredAt: { type: string, format: date-time }
                        passportHref: { type: string }
        "400": { description: Missing x-tenant-id or x-api-key }

  # ─── TRANSPARENCY-LOG CORE ROUTES (v391) ────────────────────────────────────
  /transparency/log/root:
    get:
      operationId: getTransparencyLogRoot
      tags: [transparency-log]
      summary: Get the latest Merkle root for the tenant's transparency log
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current anchored root (or null if no leaves yet)
          content:
            application/json:
              schema:
                type: object
                required: [ok, root]
                properties:
                  ok: { type: boolean }
                  root: { type: object, nullable: true, description: "AnchoredRoot or null" }
        "400": { description: Missing x-tenant-id }

  /transparency/log/proof/{receiptId}:
    get:
      operationId: getTransparencyLogProof
      tags: [transparency-log]
      summary: Get a Merkle inclusion proof for a receipt
      description: >
        Returns the Merkle proof, the anchored root, and the leaf index for a
        given receiptId. The caller can independently verify the proof using
        verifyMerkleProof(). Returns 404 if the receipt is not in the log for
        this tenant (cross-tenant isolation enforced by the log store).
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: path
          name: receiptId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Inclusion proof for the receipt
          content:
            application/json:
              schema:
                type: object
                required: [ok, proof, root, leafIndex]
                properties:
                  ok: { type: boolean }
                  proof: { type: object, description: "MerkleProof (siblings array + index)" }
                  root: { type: object, description: "AnchoredRoot at proof time" }
                  leafIndex: { type: integer }
        "400": { description: Missing x-tenant-id or receiptId }
        "404": { description: Receipt not found in transparency log for tenant }

  /transparency-log/consistency:
    get:
      operationId: getTransparencyLogConsistency
      tags: [transparency-log]
      summary: Get a consistency proof between an older tree size and the current root
      description: >
        Returns a ConsistencyProof that the first `oldSize` leaves are a prefix
        of the current tree, along with oldRoot and newRoot so the caller can
        immediately run verifyConsistencyProof() locally without a second
        round-trip. A monitor that holds an older AnchoredRoot uses this to
        confirm the log only grew (no history was rewritten) since that root.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: query
          name: oldSize
          required: true
          schema: { type: integer, minimum: 1 }
          description: "The leaf count of the older tree snapshot to prove consistency from"
      responses:
        "200":
          description: Consistency proof with both roots
          content:
            application/json:
              schema:
                type: object
                required: [ok, proof, newRoot, newSize]
                properties:
                  ok: { type: boolean }
                  proof: { type: object, description: "ConsistencyProof (hashes array)" }
                  newRoot: { type: string }
                  newSize: { type: integer }
                  oldRoot: { type: string, nullable: true }
                  oldRootEntry: { type: object, nullable: true }
        "400": { description: Missing x-tenant-id or invalid oldSize (not a positive integer) }
        "404": { description: No leaves in log for tenant, or oldSize out of range }

  /transparency-log/consistency/monitor:
    get:
      operationId: runTransparencyLogConsistencyMonitor
      tags: [transparency-log]
      summary: Run the consistency monitor over all root transitions for the tenant
      description: >
        Iterates all recorded root transitions for the tenant and verifies that
        each is a consistent extension of the previous. ok=false means at least
        one transition failed — a tamper signal. This is a read-only audit
        operation; no state is modified.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Monitor result
          content:
            application/json:
              schema:
                type: object
                required: [ok, checked, failures, rootCount]
                properties:
                  ok: { type: boolean, description: "false means at least one tamper signal detected" }
                  checked: { type: integer }
                  failures: { type: array, items: { type: object } }
                  rootCount: { type: integer }
        "400": { description: Missing x-tenant-id }

  # ─── TRANSPARENCY-LOG WITNESS CO-SIGNING (v388) ───────────────────────────────
  /transparency-log/witness:
    post:
      operationId: submitWitnessStatement
      tags: [transparency-log]
      summary: Submit a co-signed tree-head witness statement
      description: >
        A provisioned witness POSTs its co-signed (logId, treeSize, root) observation.
        The server always re-verifies the signature against the witness's registered
        key before storing — an unregistered witnessId or an invalid signature is
        rejected and nothing is persisted (fail-closed).
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, logId, root, treeSize, observedAt, witnessId, algorithm, signature]
              properties:
                version: { type: string }
                logId: { type: string }
                root: { type: string, pattern: "^[a-f0-9]{64}$", description: "sha256 hex" }
                treeSize: { type: integer, minimum: 1 }
                observedAt: { type: string, format: date-time }
                witnessId: { type: string }
                algorithm: { type: string }
                signature: { type: string }
      responses:
        "200":
          description: Statement accepted and stored
          content:
            application/json:
              schema:
                type: object
                required: [ok, statement]
                properties:
                  ok: { type: boolean }
                  statement: { type: object }
        "400": { description: Missing x-tenant-id, or body is not a well-formed WitnessStatement }
        "403": { description: "witnessId not registered for tenant, or signature does not verify — not stored" }
  /transparency-log/witness/quorum:
    get:
      operationId: getWitnessQuorum
      tags: [transparency-log]
      summary: Check whether a quorum of distinct witnesses co-signed a root
      description: >
        Returns whether `threshold` distinct, verified witnesses signed exactly this
        (logId, treeSize, root). If a verified witness signed a DIFFERENT root at the
        same position, returns 409 SPLIT_VIEW — the caller must not trust the target root.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: query
          name: logId
          required: true
          schema: { type: string }
        - in: query
          name: root
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
        - in: query
          name: treeSize
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: threshold
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Quorum check result
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: { type: boolean }
                  result: { type: object }
        "400": { description: Missing x-tenant-id, or a required query param is missing/invalid }
        "409":
          description: Split view — a verified witness signed a different root at this position
          content:
            application/json:
              schema:
                type: object
                required: [error, code, roots]
                properties:
                  error: { type: string }
                  code: { type: string, enum: [SPLIT_VIEW] }
                  roots: { type: array, items: { type: string } }
  /transparency-log/witness/statements:
    get:
      operationId: listWitnessStatements
      tags: [transparency-log]
      summary: List stored witness statements for the tenant (audit / debugging)
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: query
          name: logId
          required: false
          schema: { type: string }
        - in: query
          name: treeSize
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Stored statements, optionally filtered by logId and/or treeSize
          content:
            application/json:
              schema:
                type: object
                required: [ok, statements, total]
                properties:
                  ok: { type: boolean }
                  statements: { type: array, items: { type: object } }
                  total: { type: integer }
        "400": { description: Missing x-tenant-id }


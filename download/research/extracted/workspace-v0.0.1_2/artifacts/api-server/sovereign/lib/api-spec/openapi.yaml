          schema: { type: string }
      responses:
        "200":
          description: Trust proof bundle v2
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data: { type: object }
        "400": { description: Validation error }

  # ─── META / DOCUMENTATION ROUTES ────────────────────────────────────────────

  /dashboard:
    get:
      operationId: getDashboard
      tags: [meta]
      summary: Tenant dashboard (HTML)
      description: >
        Read-only HTML dashboard for a tenant. Pulls live data from existing
        API endpoints (transparency/chain, balances, insights). Served directly
        from the server — not an API operation.
      responses:
        "200":
          description: Dashboard HTML page
          content:
            text/html:
              schema:
                type: string

  /docs:
    get:
      operationId: getApiDocs
      tags: [meta]
      summary: Swagger UI (HTML)
      description: >
        Interactive OpenAPI documentation (Swagger UI). Loads the spec from
        /api/openapi.yaml and renders it in the browser.
      responses:
        "200":
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      tags: [meta]
      summary: OpenAPI specification (YAML)
      description: >
        Returns the current OpenAPI 3.1 specification for this API in YAML
        format. Consumed by Swagger UI, SDK generators, and contract tests.
      responses:
        "200":
          description: OpenAPI YAML document
          content:
            text/yaml:
              schema:
                type: string
        "500":
          description: Spec file not available

  # ─── AUDIT TRAIL ─────────────────────────────────────────────────────────────

  /audit-trail:
    get:
      operationId: getAuditTrail
      tags: [audit]
      summary: Cross-vendor agent audit trail
      description: >
        Returns execution records for the requesting tenant filtered by agent
        provenance and/or vendor. Provides a neutral, cross-vendor audit trail
        (xAI, OpenAI, Anthropic, Google, Cursor, etc.) without trusting any
        single vendor's own trail. At least one of provenanceId or vendor is
        required.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: query
          name: provenanceId
          required: false
          schema: { type: string }
          description: sha256 fingerprint of the agent identity
        - in: query
          name: vendor
          required: false
          schema: { type: string }
          description: >
            Normalised vendor tag (xai|openai|anthropic|google|cursor|custom|…)
      responses:
        "200":
          description: Audit trail entries for the tenant
          content:
            application/json:
              schema:
                type: object
                required: [executions]
                properties:
                  executions:
                    type: array
                    items:
                      type: object
        "400":
          description: Missing filter params or missing x-tenant-id header

  /mcp:
    post:
      operationId: mcpJsonRpcBridge
      tags: [mcp]
      summary: MCP JSON-RPC 2.0 HTTP bridge (thin transport over TfaMcpServer)
      description: >
        Accepts a JSON-RPC 2.0 request and dispatches it to the TFA MCP server's
        tool registry. Authentication is optional: if x-api-key is present it
        must carry the "mcp:execute" scope (or "superadmin"); if absent, the
        request passes through with only x-tenant-id validation (anonymous
        access allowed by caller policy). Notifications (no id field) return
        204 No Content; otherwise the JSON-RPC response is returned as 200.
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
        - in: header
          name: x-api-key
          required: false
          schema: { type: string }
          description: Optional. When present, must carry the mcp:execute or superadmin scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, description: "Must be the literal string \"2.0\"" }
                id:
                  description: Request id (string or number). Omit for a notification.
                method: { type: string, description: MCP tool/method name to invoke }
                params: { type: object, description: Method parameters; tenantId is injected from the header if absent }
      responses:
        "200":
          description: JSON-RPC 2.0 response (result or error)
          content:
            application/json:
              schema:
                type: object
                required: [jsonrpc]
                properties:
                  jsonrpc: { type: string }
                  id: {}
                  result: {}
                  error: { type: object }
        "204":
          description: Notification accepted (request had no id) — no body returned
        "400":
          description: Missing x-tenant-id, body is not a JSON-RPC 2.0 object, or method is missing/empty
        "403":
          description: x-api-key present but missing the mcp:execute (or superadmin) scope

  # ─── Redacted proof-bundle (§2.B-3 HTTP layer) ───────────────────────────────
  /track-record/redacted-proof-bundle:
    post:
      operationId: buildRedactedProofBundle
      summary: Build a privacy-preserving redacted proof bundle (version 2r)
      description: >
        Takes a full TrustProofBundleV2 (version "2") and returns a redacted
        bundle (version "2r") that exposes only verdict-level fields (TrackRecord
        counts/score, issuedAt, validUntil, tenantId, identityId) plus SHA-256
        commitments to every sensitive array (passports, signerKeys,
        evidenceManifest, approvalRefs, ledgerRefs, policyRefs). The
        counterparty can verify the redactedBundleHash against the disclosed
        fields without learning the underlying passport content or ledger amounts.
        The full bundle's tenantId must match x-tenant-id (tenant-scope check).
      tags: [track-record]
      parameters:
        - name: x-tenant-id
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle]
              properties:
                bundle:
                  type: object
                  description: A valid TrustProofBundleV2 (version "2")
      responses:
        "200":
          description: Redacted bundle (version 2r) with hash commitments
          content:
            application/json:
              schema:
                type: object
                required: [ok, redacted]
                properties:
                  ok: { type: boolean, enum: [true] }
                  redacted:
                    type: object
                    required: [version, tenantId, identityId, record, issuedAt, originalBundleHash, redacted, redactedBundleHash]
                    properties:
                      version: { type: string, enum: ["2r"] }
                      tenantId: { type: string }
                      identityId: { type: string }
                      record: { type: object }
                      issuedAt: { type: string }
                      validUntil: { type: string, nullable: true }
                      originalBundleHash: { type: string }
                      redacted: { type: object }
                      redactedBundleHash: { type: string }
        "400":
          description: Missing x-tenant-id, missing/invalid bundle, or wrong bundle version
        "403":
          description: bundle.tenantId does not match x-tenant-id

  /track-record/redacted-proof-bundle/verify:
    post:
      operationId: verifyRedactedProofBundle
      summary: Offline-verify a redacted proof bundle (version 2r)
      description: >
        Recomputes the redactedBundleHash from the disclosed fields and
        returns { valid: true } iff the hash matches. Optionally enforces
        freshness (validUntil) and passport-presence (requirePassports).
        The bundle's tenantId must match x-tenant-id. Never throws — all
        malformed inputs return { valid: false }.
      tags: [track-record]
      parameters:
        - name: x-tenant-id
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle]
              properties:
                bundle:
                  type: object
                  description: A RedactedTrustProofBundle (version "2r")
                options:
                  type: object
                  description: Optional RedactedBundleVerifyOptions (requirePassports, requireFreshness)
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required: [ok, valid]
                properties:
                  ok: { type: boolean, enum: [true] }
                  valid: { type: boolean }
        "400":
          description: Missing x-tenant-id or missing bundle field
        "403":
          description: bundle.tenantId does not match x-tenant-id

  # ─── Drift explainability (§2.C sub-step 9) ─────────────────────────────────
  /risk/drift-explain:
    post:
      operationId: explainDriftCompliance
      summary: Compliance explanation — why is this agent deteriorating?
      description: >
        Accepts an agentId and a window of trust-score records (DriftRecord[]),
        runs scoreRiskDrift + assessRisk with the drift result wired in, and
        returns a DriftComplianceReport: ranked factors (highest impact first),
        a human-readable summary sentence, the effective approval class, an
        actionable recommendation, and a machine-readable verdict.
        This is §2.C sub-step 9 — Drift explainability.
      tags: [risk]
      parameters:
        - name: x-tenant-id
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, records]
              properties:
                agentId:
                  type: string
                  description: The agent or actor under review (non-empty)
                records:
                  type: array
                  minItems: 2
                  description: Historical trust-score window (at least 2 items)
                  items:
                    type: object
                    required: [score, timestampMs]
                    properties:
                      score:       { type: number, minimum: 0, maximum: 100 }
                      timestampMs: { type: number }
                context:
                  type: object
                  description: Optional risk context overrides (reputationScore, baseApprovalClass, etc.)
      responses:
        "200":
          description: DriftComplianceReport — ranked factors, summary, recommendation
          content:
            application/json:
              schema:
                type: object
                required: [agentId, riskScore, driftScore, direction, effectiveApprovalClass, factors, summary, recommendation, driftEscalated, windowSize, windowSpanMs]
                properties:
                  agentId:               { type: string }
                  riskScore:             { type: number }
                  driftScore:            { type: number }
                  direction:             { type: string, enum: [improving, stable, deteriorating] }
                  effectiveApprovalClass: { type: string }
                  factors:               { type: array, items: { type: object } }
                  summary:               { type: string }
                  explanation:           { type: array, items: { type: string } }
                  recommendation:        { type: string }
                  driftEscalated:        { type: boolean }
                  windowSize:            { type: integer }
                  windowSpanMs:          { type: number }
        "400":
          description: Missing x-tenant-id, missing/invalid agentId, < 2 records, or invalid record fields

  # ─── ARD (Agentic Resource Discovery) ───────────────────────────────────────

  /.well-known/ai-catalog.json:
    get:
      operationId: getArdCatalog
      tags: [adapter]
      summary: ARD v0.9-draft catalog (well-known discovery document)
      description: >
        Returns a spec-conformant ARD (Agentic Resource Discovery) catalog for
        the requesting tenant, with a TFA-backed trustManifest per agent
        (identity + detached JWS produced by the kernel signer). Cached
        per-tenant for 30s to avoid re-signing on every request. ARD is a
        v0.9 draft; the adapter is labelled accordingly.
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ARD catalog for the tenant
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, publisher, agents]
                properties:
                  schemaVersion: { type: string }
                  publisher:
                    type: object
                  agents:
                    type: array
                    items:
                      type: object
                      required: [id, name, description]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        description: { type: string }
                        trustManifest:
                          type: object
                          description: identity + detached-JWS attestation, present once signed
        "400":
          description: Missing x-tenant-id header
        "500":
          description: Failed to build the ARD catalog

  /ard/verify:
    post:
      operationId: verifyArdAgent
      tags: [adapter]
      summary: Verify an ARD agent's trustManifest
      description: >
        Checks URN well-formedness, that the URN publisher-FQDN matches the
        trustManifest identity's domain, and (where resolvable) the detached
        JWS / attestations. Returns a structured per-check verdict rather
        than a single pass/fail so callers can see exactly which check
        failed.
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urn, trustManifest]
              properties:
                urn:
                  type: string
                  description: "urn:ai:<publisher-FQDN>:<namespace>:<agent-name>"
                trustManifest:
                  type: object
                  description: ARD trustManifest containing at least `identity`
      responses:
        "200":
          description: Verification verdict (valid may be false — this is not an error response)
          content:
            application/json:
              schema:
                type: object
                required: [valid, checks, reasons]
                properties:
                  valid: { type: boolean }
                  checks:
                    type: object
                    required: [urnWellFormed, domainAlignment, jwsValid, attestationsResolvable]
                    properties:
                      urnWellFormed: { type: boolean }
                      domainAlignment: { type: boolean }
                      jwsValid: { type: boolean, nullable: true }
                      attestationsResolvable: { type: boolean, nullable: true }
                  reasons:
                    type: array
                    items: { type: string }
        "400":
          description: Missing x-tenant-id, body not an object, or urn/trustManifest missing/malformed
        "500":
          description: ARD verification failed unexpectedly

  # ─── PQC admin ───────────────────────────────────────────────────────────────

  /admin/pqc/install:
    post:
      operationId: installPqcProvider
      tags: [admin]
      summary: Attempt to install a real post-quantum-crypto provider (requires admin:pqc-install scope)
      description: >
        Attempts an npm install of a real PQC provider package, replacing the
        sim signer. A failed install is a normal, audited outcome (503), not
        a server error — PQC remains sim-mode until install succeeds. Every
        call (success or failure) is recorded as a signed, append-only audit
        entry on the tenant chain.
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PQC provider installed
          content:
            application/json:
              schema:
                type: object
                required: [ok, package]
                properties:
                  ok: { type: boolean }
                  package: { type: string }
        "400": { description: Missing x-tenant-id header }
        "403": { description: Missing admin:pqc-install scope }
        "503":
          description: Install attempt failed (network/registry/2FA-blocked) — PQC stays sim-mode
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok: { type: boolean }
                  error: { type: string }

  # ─── KEY RESOLVER (offline proof verification) ───────────────────────────────

  /keys/current:
    get:
      operationId: getCurrentSigningKey
      tags: [keys]
      summary: Currently-active signing key
      description: >
        Returns the currently-active signing key (kid, algorithm, status,
        createdAt, and publicKey for Ed25519). Lets a third-party verifier
        resolve the key needed to check a TFA-signed passport or receipt. Public
        and unauthenticated; HMAC secrets are never returned. Cacheable.
      responses:
        "200":
          description: The active signing key (public material only)
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    type: object
                    required: [kid, algorithm, status]
                    properties:
                      kid: { type: string }
                      algorithm: { type: string }
                      status: { type: string }
                      publicKey: { type: string }
                      createdAt: { type: string }
        "404":
          description: No active signing key found

  /keys:
    get:
      operationId: listSigningKeys
      tags: [keys]
      summary: List known signing keys
      description: >
        Returns the key history (active, retiring, revoked) as public material
        only, so a verifier can resolve the key that was active at signing time —
        not just the current one. Public and unauthenticated; secrets redacted.
      responses:
        "200":
          description: Known signing keys (public material only)
          content:
            application/json:
              schema:
                type: object
                required: [kids]
                properties:
                  kids:
                    type: array
                    items:
                      type: object
                      required: [kid, algorithm, status]
                      properties:
                        kid: { type: string }
                        algorithm: { type: string }
                        status: { type: string }
                        publicKey: { type: string }
                        createdAt: { type: string }

  /keys/{kid}:
    get:
      operationId: getSigningKeyByKid
      tags: [keys]
      summary: Resolve a signing key by kid
      description: >
        Resolves the key entry for a given kid from the key history. Fail-closed:
        an unknown kid returns 404 (no information leakage); a revoked kid returns
        410 Gone, signalling that any proof signed with it must be rejected.
      parameters:
        - in: path
          name: kid
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The resolved key (public material only)
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    type: object
                    required: [kid, algorithm, status]
                    properties:
                      kid: { type: string }
                      algorithm: { type: string }
                      status: { type: string }
                      publicKey: { type: string }
                      createdAt: { type: string }
        "404":
          description: Unknown kid (fail-closed, no information leakage)
        "410":
          description: Key revoked — proofs signed with it must be rejected

  # ─── Cost arbitrage (v423) ───────────────────────────────────────────────────
  /arbitrage/quotes:
    post:
      operationId: getArbitrageQuotes
      tags: [arbitrage]
      summary: Run cost arbitrage across vendor quotes
      description: >
        Given N vendor cost estimates for the same action (as decimal-string
        micro-cents), returns the cheapest vendor (winner), the spread (revenue
        headroom), a routing-fee suggestion, and all quotes sorted ascending.
        feeFractionNumerator/Denominator default to 1/2 (50% of spread).
        All monetary values are decimal strings (never Number).
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quotes]
              properties:
                quotes:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [vendorId, estimatedCostMc]
                    properties:
                      vendorId: { type: string }
                      estimatedCostMc: { type: string, description: "Non-negative decimal integer string (μ¢)" }
                feeFractionNumerator:   { type: string, default: "1", description: "Numerator of routing-fee fraction of spread" }
                feeFractionDenominator: { type: string, default: "2", description: "Denominator; must be > 0 and ≥ numerator" }
      responses:
        "200":
          description: Arbitrage result
          content:
            application/json:
              schema:
                type: object
                required: [ok, winner, runnerUp, spreadMc, suggestedRoutingFeeMc, sortedQuotes]
                properties:
                  ok: { type: boolean }
                  winner:
                    type: object
                    required: [vendorId, estimatedCostMc]
                    properties:
                      vendorId: { type: string }
                      estimatedCostMc: { type: string }
                  runnerUp:
                    nullable: true
                    type: object
                    properties:
                      vendorId: { type: string }
                      estimatedCostMc: { type: string }
                  spreadMc: { type: string, description: "runnerUp.cost - winner.cost (μ¢ decimal string)" }
                  suggestedRoutingFeeMc: { type: string }
                  sortedQuotes:
                    type: array
                    items:
                      type: object
                      properties:
                        vendorId: { type: string }
                        estimatedCostMc: { type: string }
        "400": { description: Missing x-tenant-id, empty quotes, invalid costs, or invalid fee fraction }

  /dispute/proof:
    post:
      operationId: buildDisputeProof
      tags: [dispute]
      summary: Build and sign a portable billing-dispute proof
      description: >
        Given the amount TFA authorized for an intent, the amount the vendor
        actually billed, and the TFA decision, builds and signs a portable
        BillingDisputeProof a tenant can hand to a vendor or mediator. The
        discrepancy type (OVERCHARGE / DENIED_BUT_BILLED / AMOUNT_MISMATCH) is
        computed and signed by the issuer, not supplied by the caller.
        All monetary values are decimal strings (never Number). This is a
        pure read+sign operation — no store write.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intentId, authorizedMicrounits, billedMicrounits, decision]
              properties:
                intentId: { type: string, description: "The intent nonce from the original ExecutionReceipt" }
                authorizedMicrounits: { type: string, description: "Non-negative decimal integer string (μ¢); \"0\" when the action was denied" }
                billedMicrounits: { type: string, description: "Positive decimal integer string (μ¢) — what the vendor actually billed" }
                decision: { type: string, description: "The TFA decision from the original receipt, e.g. \"allowed\" or \"denied\"" }
      responses:
        "200":
          description: Signed billing-dispute proof
          content:
            application/json:
              schema:
                type: object
                required: [ok, proof]
                properties:
                  ok: { type: boolean }
                  proof:
                    type: object
                    required: [version, tenantId, intentId, authorizedMicrounits, billedMicrounits, decision, discrepancyType, issuedAt, signerId, algorithm, signature]
                    properties:
                      version: { type: string }
                      tenantId: { type: string }
                      intentId: { type: string }
                      authorizedMicrounits: { type: string }
                      billedMicrounits: { type: string }
                      decision: { type: string }
                      discrepancyType: { type: string, enum: [OVERCHARGE, DENIED_BUT_BILLED, AMOUNT_MISMATCH] }
                      issuedAt: { type: string }
                      signerId: { type: string }
                      algorithm: { type: string }
                      signature: { type: string }
        "400": { description: Missing x-tenant-id, missing/invalid fields, or no discrepancy exists (billed equals authorized and decision is not "denied") }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Tenant API key issued by POST /auth/api-keys. Format: tfa_<random>.
        The server resolves the tenantId from the key — no x-tenant-id header needed.
        Takes precedence over x-tenant-id when both are present.

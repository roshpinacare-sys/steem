          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "400": { description: Invalid bundle or schema mismatch }
        "403": { description: Tenant ID mismatch }
        "422": { description: Signature invalid }
        "500": { description: Import failed }

  /sovereignty/verify:
    post:
      operationId: verifyTenantBundle
      tags: [sovereignty]
      summary: Verify a bundle signature without modifying state
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - in: header
          name: x-tenant-id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                required: [valid]

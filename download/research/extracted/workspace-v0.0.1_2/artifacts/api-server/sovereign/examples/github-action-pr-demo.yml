# examples/github-action-pr-demo.yml
#
# Demo workflow: use the TFA Trust Gate GitHub Action in a pull-request
# context and automatically post the trust decision as a PR comment.
#
# Requirements:
#   - A TFA API reachable from GitHub Actions runners
#   - Repository variables: TFA_BASE_URL, TFA_TENANT_ID, TFA_PUBLIC_KEY
#   - Repository secrets: TFA_API_KEY
#   - Workflow permission: pull-requests: write (for gh pr comment)
#
# Usage: copy this file into .github/workflows/ and add a .tfa/action-intent.json
# to the repository root describing the agent action you want to gate.

name: TFA PR Trust Gate Demo

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  tfa-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: TFA trust gate with PR comment
        uses: tfa/tfa-trust-gate@v1
        with:
          intent: './.tfa/action-intent.json'
          base-url: ${{ vars.TFA_BASE_URL }}
          tenant: ${{ vars.TFA_TENANT_ID }}
          api-key: ${{ secrets.TFA_API_KEY }}
          public-key: ${{ vars.TFA_PUBLIC_KEY }}
          post-comment: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

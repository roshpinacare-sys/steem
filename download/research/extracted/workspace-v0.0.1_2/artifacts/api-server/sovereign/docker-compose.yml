# TFA Pilot Deployment — Docker Compose
# PostgreSQL 16 + TFA Sovereign Server
# Usage: docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tfa
      POSTGRES_PASSWORD: tfa
      POSTGRES_DB: tfa
    volumes:
      - tfa_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfa -d tfa"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  tfa:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Persistence: mandatory for pilot trust
      TFA_PERSIST: pg
      DB_URL: postgresql://tfa:tfa@postgres:5432/tfa
      # Security
      TFA_SECRET: ${TFA_SECRET:?TFA_SECRET is required — generate with openssl rand -hex 32}
      TFA_REQUIRE_API_KEY: "1"
      # Operations
      PORT: "7700"
      TFA_SIGNER_KIND: ${TFA_SIGNER_KIND:-ed25519}
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  tfa_pg_data:

      responses:
        "202":
          description: Experiment started
        "409":
          description: Already running

  /chaos/experiments/{experimentId}/stop:
    post:
      operationId: chaosExperimentsStop
      summary: Stop a running chaos experiment
      security:
        - bearerAuth: []
      parameters:
        - name: experimentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Experiment stopped
        "404":
          description: Not found

  /chaos/status:
    get:
      operationId: chaosStatus
      summary: Get current chaos system status (active experiments)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Chaos status

  # ─── ANALYTICS FUNNELS ───────────────────────────────────────────────────────
  /analytics/funnels:
    get:
      operationId: analyticsFunnelsList
      summary: List defined funnels
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Funnel list
    post:
      operationId: analyticsFunnelsCreate
      summary: Create a funnel definition
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, steps]
              properties:
                name:  { type: string }
                steps:
                  type: array
                  items:
                    type: object
                    required: [event]
                    properties:
                      event:      { type: string }
                      filters:    { type: object }
                      maxSec:     { type: integer }
      responses:
        "201":
          description: Funnel created
        "400":
          description: Validation error

  /analytics/funnels/{funnelId}:
    get:
      operationId: analyticsFunnelsGet
      summary: Get funnel definition
      security:
        - bearerAuth: []
      parameters:
        - name: funnelId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Funnel
        "404":
          description: Not found
    delete:
      operationId: analyticsFunnelsDelete
      summary: Delete a funnel definition
      security:
        - bearerAuth: []
      parameters:
        - name: funnelId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /analytics/funnels/{funnelId}/compute:
    post:
      operationId: analyticsFunnelsCompute
      summary: Compute funnel conversion rates
      security:
        - bearerAuth: []
      parameters:
        - name: funnelId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:   { type: string, format: date-time }
                to:     { type: string, format: date-time }
                groupBy:{ type: string }
      responses:
        "200":
          description: Funnel computation result
        "404":
          description: Funnel not found

  # ─── FEATURE FLAG SEGMENTS ────────────────────────────────────────────────────
  /feature-flags/{flagId}/segments:
    get:
      operationId: featureFlagsSegmentsList
      summary: List targeting segments for a feature flag
      security:
        - bearerAuth: []
      parameters:
        - name: flagId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Segments list
        "404":
          description: Flag not found
    post:
      operationId: featureFlagsSegmentsCreate
      summary: Add a targeting segment to a feature flag
      security:
        - bearerAuth: []
      parameters:
        - name: flagId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, rules]
              properties:
                name:       { type: string }
                rollout:    { type: number, minimum: 0, maximum: 1, default: 1 }
                rules:
                  type: array
                  items:
                    type: object
                    required: [attribute, operator, value]
                    properties:
                      attribute: { type: string }
                      operator:  { type: string, enum: [eq, neq, in, nin, gt, lt, gte, lte, contains] }
                      value:     {}
      responses:
        "201":
          description: Segment created
        "400":
          description: Validation error
        "404":
          description: Flag not found

  /feature-flags/{flagId}/segments/{segmentId}:
    patch:
      operationId: featureFlagsSegmentsUpdate
      summary: Update a targeting segment
      security:
        - bearerAuth: []
      parameters:
        - name: flagId
          in: path
          required: true
          schema: { type: string }
        - name: segmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:    { type: string }
                rollout: { type: number, minimum: 0, maximum: 1 }
                rules:   { type: array, items: { type: object } }
      responses:
        "200":
          description: Segment updated
        "404":
          description: Not found
    delete:
      operationId: featureFlagsSegmentsDelete
      summary: Delete a targeting segment
      security:
        - bearerAuth: []
      parameters:
        - name: flagId
          in: path
          required: true
          schema: { type: string }
        - name: segmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Segment deleted
        "404":
          description: Not found

  # ─── ADVANCED NOTIFICATIONS ──────────────────────────────────────────────────
  /notifications/preferences:
    get:
      operationId: notificationsPreferencesGet
      summary: Get notification preferences for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preferences
    patch:
      operationId: notificationsPreferencesUpdate
      summary: Update notification preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channels:
                  type: object
                  properties:
                    inApp: { type: boolean }
                    email: { type: boolean }
                    sms:   { type: boolean }
                digest:
                  type: object
                  properties:
                    enabled:      { type: boolean }
                    intervalMin:  { type: integer, minimum: 5 }
      responses:
        "200":
          description: Preferences updated
        "400":
          description: Validation error

  /notifications/digest:
    post:
      operationId: notificationsDigestTrigger
      summary: Trigger digest delivery for a user (internal/system)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        "202":
          description: Digest queued
        "400":
          description: Validation error

  /notifications/channels/test:
    post:
      operationId: notificationsChannelsTest
      summary: Send a test notification on a channel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel:  { type: string, enum: [in-app, email, sms] }
                address:  { type: string }
      responses:
        "202":
          description: Test notification sent
        "400":
          description: Validation error

  # ── Sovereign API (integration layer — wired by composition root) ──
  /ledger/accounts:
    post:
      operationId: createLedgerAccount
      tags: [ledger]
      summary: Create a sovereign ledger account (μ¢)
      responses:
        "201": { description: Account created }
        "400": { description: Missing fields or tenant }
  /ledger/accounts/{id}:
    get:
      operationId: getLedgerAccount
      tags: [ledger]
      summary: Get account (tenant-isolated)
      responses:
        "200": { description: Account }
        "404": { description: Not found / cross-tenant }
  /ledger/mint:
    post:
      operationId: ledgerMint
      tags: [ledger]
      summary: Mint μ¢ (guarded, fail-closed, audited)
      responses:
        "200": { description: Minted }
        "403": { description: Guard denied }
  /ledger/transfer:
    post:
      operationId: ledgerTransfer
      tags: [ledger]
      summary: Transfer μ¢ between accounts (guarded)
      responses:
        "200": { description: Transferred }
        "403": { description: Guard denied }
  /ledger/solvency:
    get:
      operationId: ledgerSolvency
      tags: [ledger]
      summary: Proof of solvency (integrity check)
      responses:
        "200": { description: Solvency proof }
  /potential/profile:
    post:
      operationId: potentialProfile
      tags: [potential]
      summary: Build a personality/strength profile (Potential Engine)
      responses:
        "200": { description: Profile }
        "400": { description: Invalid input }
  /potential/personality:
    post:
      operationId: potentialPersonalityMap
      tags: [potential]
      summary: Map personality from signals (computes + persists PersonalityProfile)
      responses:
        "200": { description: PersonalityProfile }
        "400": { description: Missing userId }
  /potential/personality/{userId}:
    get:
      operationId: getPotentialPersonality
      tags: [potential]
      summary: Load a previously-saved PersonalityProfile (tenant-scoped)
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200": { description: PersonalityProfile }
        "400": { description: Missing userId }
        "404": { description: Not found }
  /potential/success-path:
    post:
      operationId: computeSuccessPath
      tags: [potential]
      summary: Compute a learning path toward a target opportunity
      responses:
        "200": { description: SuccessPath }
        "400": { description: Validation error }
        "404": { description: Opportunity not found }
  /potential/success-path/{userId}/{opportunityId}:
    get:
      operationId: getSuccessPath
      tags: [potential]
      summary: Load a previously-computed SuccessPath
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
        - in: path
          name: opportunityId
          required: true
          schema: { type: string }
      responses:
        "200": { description: SuccessPath }
        "400": { description: Validation error }
        "404": { description: Not found }
  /potential/collaboration:
    post:
      operationId: findCollaborators
      tags: [potential]
      summary: Find best collaboration partners for a user (tenant-scoped)
      responses:
        "200": { description: CollaborationMatch array }
        "400": { description: Validation error }
  /potential/collaboration/{userId}:
    get:
      operationId: getCachedCollaborators
      tags: [potential]
      summary: Load cached collaboration matches for a user
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200": { description: CollaborationMatch array }
        "400": { description: Missing userId }
        "404": { description: No cache found }
  /escrow:
    post:
      operationId: createEscrow
      tags: [escrow]
      summary: Create an escrow agreement (no money moves yet)
      responses:
        "201": { description: EscrowAgreement created }
        "400": { description: Validation error }
  /escrow/{id}:
    get:
      operationId: getEscrow
      tags: [escrow]
      summary: Fetch an escrow agreement by id (tenant-scoped)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: EscrowAgreement }
        "404": { description: Not found }
  /escrow/{id}/fund:
    post:
      operationId: fundEscrow
      tags: [escrow]
      summary: Fund escrow — payer to escrow transfer (created→funded)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: EscrowAgreement funded }
        "404": { description: Not found }
        "409": { description: Wrong state }
  /escrow/{id}/release:
    post:
      operationId: releaseEscrow
      tags: [escrow]
      summary: Release escrow to worker on completion (funded→released)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: EscrowAgreement released }
        "404": { description: Not found }
        "409": { description: Wrong state }
  /escrow/{id}/refund:
    post:
      operationId: refundEscrow
      tags: [escrow]
      summary: Refund escrow to payer on cancellation (funded→refunded)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: EscrowAgreement refunded }
        "404": { description: Not found }
        "409": { description: Wrong state }
  /escrow/{id}/dispute:
    post:
      operationId: disputeEscrow
      tags: [escrow]
      summary: Freeze a funded escrow (funded→disputed)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: EscrowAgreement disputed }
        "404": { description: Not found }
        "409": { description: Wrong state }
  /escrow/{id}/undispute:
    post:
      operationId: undisputeEscrow
      tags: [escrow]
      summary: Unfreeze a disputed escrow (disputed→funded)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: EscrowAgreement undisputed }
        "404": { description: Not found }
        "409": { description: Wrong state }
        "403": { description: Unauthorized }
  /track-record/{identityId}:
    get:
      operationId: getTrackRecord
      tags: [track-record]
      summary: Verified Track Record — deterministic read-model over the signed audit chain
      parameters:
        - in: path
          name: identityId
          required: true
          schema: { type: string }
      responses:
        "200": { description: TrackRecord }
        "400": { description: Validation error }
  /tenants:
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Tenant Onboarding — create tenant with root person, default policies, and first ledger account
      responses:
        "201": { description: Tenant created }
        "200": { description: Tenant already exists (idempotent) }
        "400": { description: Missing x-tenant-id or invalid input }

  /sovereignty/export:
    get:
      operationId: exportTenantBundle
      tags: [sovereignty]
      summary: Export all tenant data as a signed bundle (data portability)
      security:
        - tenantHeader: []
      responses:
        "200": { description: ExportBundle JSON }
        "400": { description: Missing x-tenant-id }

  /sovereignty/import:
    post:
      operationId: importTenantBundle
      tags: [sovereignty]
      summary: Restore a signed bundle — verifies signature before any state change (fail-closed)
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ExportBundle JSON (as returned by /sovereignty/export)
      responses:
        "200": { description: ImportResult }
        "400": { description: Schema mismatch or invalid bundle }
        "403": { description: Tenant mismatch }
        "422": { description: Signature invalid }

  /sovereignty/verify:
    post:
      operationId: verifyBundle
      tags: [sovereignty]
      summary: Verify a bundle signature without modifying state
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ExportBundle JSON
      responses:
        "200": { description: "{ valid: boolean, reason?: string }" }
        "400": { description: Invalid bundle }

  /sovereignty/rotate-key:
    post:
      operationId: rotateKey
      tags: [sovereignty]
      summary: Live key rotation — atomically replace the stack MutableSigner delegate
      description: |
        Replaces the signing key used for all subsequent sign/verify operations.
        Requires the `admin:key-rotation` scope. Fail-closed: 403 if scope missing.
      security:
        - apiKeyAuth: [admin:key-rotation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [signerKind, secret]
                  properties:
                    signerKind:
                      type: string
                      enum: [hmac]
                    secret:
                      type: string
                      minLength: 16
                      description: UTF-8 string, minimum 16 bytes
                - type: object
                  required: [signerKind, privateKey, publicKey]
                  properties:
                    signerKind:
                      type: string
                      enum: [ed25519]
                    privateKey:
                      type: string
                      description: PKCS8 PEM private key
                    publicKey:
                      type: string
                      description: SPKI PEM public key
      responses:
        "200":
          description: Key rotated successfully
          content:
            application/json:
              schema:
                type: object
                required: [ok, rotatedAt, rotationCount, newAlgorithm]
                properties:
                  ok: { type: boolean, example: true }
                  rotatedAt: { type: string, format: date-time }
                  rotationCount: { type: integer, minimum: 1 }
                  newAlgorithm: { type: string, enum: [hmac-sha256, ed25519] }
        "400": { description: Invalid signerKind or key material }
        "403":
          description: missing admin:key-rotation scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "missing admin:key-rotation scope" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        TFA API key. Pass the full secret value returned by POST /api-keys.
        The resolved scopes determine which operations are permitted.
    tenantHeader:
      type: apiKey
      in: header
      name: x-tenant-id
      description: |
        Tenant ID header — for unauthenticated (no RBAC) tenant-scoped operations.
        Operations that require specific scopes use `apiKeyAuth` instead.

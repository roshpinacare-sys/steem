openapi: "3.1.0"
info:
  title: TFA API
  version: "0.2.0"
  description: >
    TFA — enterprise SaaS backend (TypeScript, Node 24, Express 5, Drizzle+PostgreSQL).
    ~143 endpoints across auth, workflows, agents, billing, analytics, search, knowledge-graph,
    incidents, SLO, metering, DLQ.

servers:
  - url: /api

paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Service is healthy

  # ─── AUTH ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: authRegister
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: User created
        "400":
          description: Validation error
        "409":
          description: Email already registered

  /auth/login:
    post:
      operationId: authLogin
      summary: Authenticate and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string }
                password: { type: string }
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:  { type: string }
                  refreshToken: { type: string }
                  expiresIn:    { type: integer }
        "401":
          description: Invalid credentials
        "403":
          description: MFA required

  /auth/logout:
    post:
      operationId: authLogout
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked
        "401":
          description: Not authenticated

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Exchange refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New access token
        "401":
          description: Invalid or expired refresh token

  /auth/me:
    get:
      operationId: authMe
      summary: Get current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:       { type: string }
                  email:    { type: string }
                  tenantId: { type: string }
                  roles:    { type: array, items: { type: string } }
        "401":
          description: Not authenticated

  /auth/password/change:
    post:
      operationId: authPasswordChange
      summary: Change password (authenticated)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword:     { type: string, minLength: 8 }
      responses:
        "204":
          description: Password changed
        "400":
          description: Validation error
        "401":
          description: Wrong current password

  /auth/password/reset/request:
    post:
      operationId: authPasswordResetRequest
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204":
          description: Reset email sent (always 204, even if email not found)

  /auth/password/reset/confirm:
    post:
      operationId: authPasswordResetConfirm
      summary: Confirm password reset with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:       { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "204":
          description: Password reset successful
        "400":
          description: Invalid or expired token

  # ─── MFA ─────────────────────────────────────────────────────────────────────
  /auth/mfa/setup:
    post:
      operationId: authMfaSetup
      summary: Initiate TOTP MFA setup — returns secret + QR URI
      security:
        - bearerAuth: []
      responses:
        "200":
          description: MFA setup initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  qrUri:  { type: string }
        "401":
          description: Not authenticated

  /auth/mfa/verify:
    post:
      operationId: authMfaVerify
      summary: Verify TOTP code to activate MFA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        "204":
          description: MFA activated
        "400":
          description: Invalid TOTP code
        "401":
          description: Not authenticated

  /auth/mfa/disable:
    post:
      operationId: authMfaDisable
      summary: Disable MFA for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "204":
          description: MFA disabled
        "401":
          description: Wrong code or not authenticated

  /auth/mfa/challenge:
    post:
      operationId: authMfaChallenge
      summary: Submit TOTP code during login (step-up)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code:           { type: string }
      responses:
        "200":
          description: Full tokens issued after MFA
        "401":
          description: Invalid code or expired challenge

  # ─── API KEYS ─────────────────────────────────────────────────────────────────
  /auth/api-keys:
    get:
      operationId: authApiKeysList
      summary: List API keys for the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: API key list
    post:
      operationId: authApiKeysCreate
      summary: Create a new API key
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:      { type: string }
                expiresAt: { type: string, format: date-time }
                scopes:    { type: array, items: { type: string } }
      responses:
        "201":
          description: API key created (secret shown once)

  /auth/api-keys/{keyId}:
    delete:
      operationId: authApiKeysRevoke
      summary: Revoke an API key
      security:
        - bearerAuth: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Key revoked
        "404":
          description: Key not found

  # ─── SESSIONS ────────────────────────────────────────────────────────────────
  /auth/sessions:
    get:
      operationId: authSessionsList
      summary: List active sessions for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session list

  /auth/sessions/{sessionId}:
    delete:
      operationId: authSessionsRevoke
      summary: Revoke a specific session
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Session revoked
        "404":
          description: Session not found

  # ─── BILLING ─────────────────────────────────────────────────────────────────
  /billing/plans:
    get:
      operationId: billingPlansList
      summary: List available billing plans
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:          { type: string }
                    name:        { type: string }
                    priceMicro:  { type: string, description: "BigInt μ¢ as string" }
                    interval:    { type: string, enum: [month, year] }

  /billing/plans/{planId}:
    get:
      operationId: billingPlansGet
      summary: Get a specific billing plan
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Plan details
        "404":
          description: Plan not found

  /billing/subscriptions:
    get:
      operationId: billingSubscriptionsList
      summary: List subscriptions for the current tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription list
    post:
      operationId: billingSubscriptionsCreate
      summary: Create a subscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId:          { type: string }
                paymentMethodId: { type: string }
      responses:
        "201":
          description: Subscription created
        "400":
          description: Validation error or insufficient funds
        "409":
          description: Active subscription already exists

  /billing/subscriptions/{subId}:
    get:
      operationId: billingSubscriptionsGet
      summary: Get a specific subscription
      security:
        - bearerAuth: []
      parameters:
        - name: subId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Subscription details
        "404":
          description: Subscription not found
    patch:
      operationId: billingSubscriptionsUpdate
      summary: Update (upgrade/downgrade) a subscription
      security:
        - bearerAuth: []
      parameters:
        - name: subId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planId: { type: string }
      responses:
        "200":
          description: Subscription updated
        "404":
          description: Subscription not found
    delete:
      operationId: billingSubscriptionsCancel
      summary: Cancel a subscription
      security:
        - bearerAuth: []
      parameters:
        - name: subId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Subscription cancelled
        "404":
          description: Subscription not found

  /billing/invoices:
    get:
      operationId: billingInvoicesList
      summary: List invoices for the current tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invoice list

  /billing/invoices/{invoiceId}:
    get:
      operationId: billingInvoicesGet
      summary: Get a specific invoice
      security:
        - bearerAuth: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invoice details
        "404":
          description: Invoice not found

  /billing/usage:
    get:
      operationId: billingUsageGet
      summary: Get current billing period usage for the tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usage summary

  /billing/checkout:
    post:
      operationId: billingCheckout
      summary: Initiate checkout session (in-house ledger or Stripe adapter)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId:      { type: string }
                successUrl:  { type: string }
                cancelUrl:   { type: string }
      responses:
        "200":
          description: Checkout session or redirect URL
        "400":
          description: Validation error

  /billing/payment-methods:
    get:
      operationId: billingPaymentMethodsList
      summary: List payment methods for the current tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment method list
    post:
      operationId: billingPaymentMethodsCreate
      summary: Add a payment method
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:   { type: string }
                setDefault: { type: boolean }
      responses:
        "201":
          description: Payment method added

  /billing/payment-methods/{pmId}:
    delete:
      operationId: billingPaymentMethodsDelete
      summary: Remove a payment method
      security:
        - bearerAuth: []
      parameters:
        - name: pmId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Payment method removed
        "404":
          description: Not found

  # ─── AGENTS ──────────────────────────────────────────────────────────────────
  /agents:
    get:
      operationId: agentsList
      summary: List agents for the current tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Agent list
    post:
      operationId: agentsCreate
      summary: Create a new agent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:   { type: string }
                type:   { type: string }
                config: { type: object }
      responses:
        "201":
          description: Agent created
        "400":
          description: Validation error

  /agents/{agentId}:
    get:
      operationId: agentsGet
      summary: Get agent details
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Agent details
        "404":
          description: Agent not found
    patch:
      operationId: agentsUpdate
      summary: Update agent configuration
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:   { type: string }
                config: { type: object }
      responses:
        "200":
          description: Agent updated
        "404":
          description: Agent not found
    delete:
      operationId: agentsDelete
      summary: Delete an agent
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Agent deleted
        "404":
          description: Agent not found

  /agents/{agentId}/run:
    post:
      operationId: agentsRun
      summary: Trigger an agent run (async, through guard → audit)
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                input: { type: object }
      responses:
        "202":
          description: Run accepted
        "402":
          description: Insufficient funds (ledger guard)
        "403":
          description: Forbidden by guard policy
        "404":
          description: Agent not found

  /agents/{agentId}/tasks:
    get:
      operationId: agentsTasksList
      summary: List tasks for an agent
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task list

  /agents/{agentId}/tasks/{taskId}:
    get:
      operationId: agentsTasksGet
      summary: Get a specific agent task
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task details
        "404":
          description: Task not found

  /agents/{agentId}/tasks/{taskId}/cancel:
    post:
      operationId: agentsTasksCancel
      summary: Cancel a running task
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Task cancelled
        "404":
          description: Task not found
        "409":
          description: Task not cancellable in current state

  /agents/{agentId}/logs:
    get:
      operationId: agentsLogsList
      summary: Get execution logs for an agent
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Log entries

  # ─── WORKFLOWS ───────────────────────────────────────────────────────────────
  /workflows:
    get:
      operationId: workflowsList
      summary: List workflows for the current tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workflow list
    post:
      operationId: workflowsCreate
      summary: Create a workflow definition
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, steps]
              properties:
                name:   { type: string }
                steps:  { type: array, items: { type: object } }
                config: { type: object }
      responses:
        "201":
          description: Workflow created
        "400":
          description: Validation error

  /workflows/{workflowId}:
    get:
      operationId: workflowsGet
      summary: Get workflow definition
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workflow details
        "404":
          description: Workflow not found
    patch:
      operationId: workflowsUpdate
      summary: Update workflow definition
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:  { type: string }
                steps: { type: array, items: { type: object } }
      responses:
        "200":
          description: Workflow updated
        "404":
          description: Workflow not found
    delete:
      operationId: workflowsDelete
      summary: Delete a workflow
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Workflow deleted
        "404":
          description: Workflow not found

  /workflows/{workflowId}/run:
    post:
      operationId: workflowsRun
      summary: Trigger a workflow run
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                input: { type: object }
      responses:
        "202":
          description: Run accepted
        "402":
          description: Insufficient funds (ledger guard)
        "404":
          description: Workflow not found

  /workflows/{workflowId}/runs:
    get:
      operationId: workflowsRunsList
      summary: List runs for a workflow
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run list

  /workflows/{workflowId}/runs/{runId}:
    get:
      operationId: workflowsRunsGet
      summary: Get a specific workflow run
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string }
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run details
        "404":
          description: Run not found

  /workflows/{workflowId}/runs/{runId}/cancel:
    post:
      operationId: workflowsRunsCancel
      summary: Cancel a running workflow run
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string }
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Run cancelled
        "404":
          description: Run not found
        "409":
          description: Run not cancellable

  # ─── INCIDENTS ───────────────────────────────────────────────────────────────
  /incidents:
    get:
      operationId: incidentsList
      summary: List incidents for the current tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Incident list
    post:
      operationId: incidentsCreate
      summary: Create an incident
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, severity]
              properties:
                title:       { type: string }
                severity:    { type: string, enum: [critical, high, medium, low] }
                description: { type: string }
      responses:
        "201":
          description: Incident created
        "400":
          description: Validation error

  /incidents/{incidentId}:
    get:
      operationId: incidentsGet
      summary: Get incident details
      security:
        - bearerAuth: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Incident details
        "404":
          description: Incident not found
    patch:
      operationId: incidentsUpdate
      summary: Update incident
      security:
        - bearerAuth: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:       { type: string }
                status:      { type: string, enum: [open, investigating, resolved] }
                description: { type: string }
      responses:
        "200":
          description: Incident updated
        "404":
          description: Incident not found

  /incidents/{incidentId}/resolve:
    post:
      operationId: incidentsResolve
      summary: Resolve an incident
      security:
        - bearerAuth: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution: { type: string }
      responses:
        "204":
          description: Incident resolved
        "404":
          description: Incident not found
        "409":
          description: Incident already resolved

  /incidents/{incidentId}/escalate:
    post:
      operationId: incidentsEscalate
      summary: Escalate an incident
      security:
        - bearerAuth: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Incident escalated
        "404":
          description: Incident not found

  /incidents/{incidentId}/timeline:
    get:
      operationId: incidentsTimeline
      summary: Get incident timeline events
      security:
        - bearerAuth: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Timeline events
        "404":
          description: Incident not found

  # ─── DLQ ─────────────────────────────────────────────────────────────────────
  /dlq/messages:
    get:
      operationId: dlqMessagesList
      summary: List dead-letter queue messages
      security:
        - bearerAuth: []
      responses:
        "200":
          description: DLQ message list

  /dlq/messages/{messageId}:
    get:
      operationId: dlqMessagesGet
      summary: Get a DLQ message
      security:
        - bearerAuth: []
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Message details
        "404":
          description: Message not found
    delete:
      operationId: dlqMessagesDelete
      summary: Discard a DLQ message
      security:
        - bearerAuth: []
      parameters:
        - name: messageId

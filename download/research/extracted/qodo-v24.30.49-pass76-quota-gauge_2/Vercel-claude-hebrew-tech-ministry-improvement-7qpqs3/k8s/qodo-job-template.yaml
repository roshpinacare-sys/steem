# Qodo V24 — Kubernetes Job Template
# Drop-in replacement for GitHub Actions runners; bypasses GHA concurrency limits.
# Usage: substitute MISSION_OBJECTIVE and submit with `kubectl create -f`.
apiVersion: batch/v1
kind: Job
metadata:
  name: qodo-mission-job
  namespace: qodo
  labels:
    app: qodo-agent
    version: v24
spec:
  # Automatically clean up completed/failed pods after 10 minutes.
  ttlSecondsAfterFinished: 600
  # Retry failed missions up to 2 times before giving up.
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: qodo-agent
        version: v24
    spec:
      restartPolicy: OnFailure
      # Run as non-root user to satisfy Dockerfile USER 10001 convention.
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: qodo-agent
          # Built from the repo Dockerfile (docker build -t <registry>/qodo-agent:v24 .)
          # — a bare node base image contains no agent code and cannot run this Job.
          image: ghcr.io/OWNER/qodo-agent:v24
          command: ["node", "packages/agent/dist/cli.js"]
          workingDir: /app
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          envFrom:
            # All secrets (GROQ_API_KEY, GITHUB_TOKEN, UPSTASH_*, etc.) are
            # injected from this Secret. Create it with:
            #   kubectl create secret generic qodo-secrets --from-env-file=.env
            - secretRef:
                name: qodo-secrets
          env:
            # Override objective per-job via the KEDA ScaledJob trigger metadata.
            - name: OBJECTIVE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['qodo.ai/objective']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

# Qodo V24 — KEDA ScaledJob
# Autoscales Qodo agent pods based on the depth of the Redis mission queue.
# Prerequisites:
#   - KEDA v2.x installed in the cluster  (https://keda.sh/docs/deploy/)
#   - A Secret named `keda-redis-secret` with key REDIS_PASSWORD (KEDA's redis
#     scaler speaks the Redis TCP protocol — an Upstash *REST* URL/token will
#     NOT work; use a TCP endpoint, e.g. Upstash's redis:// connection string).
#   - The Job template in qodo-job-template.yaml applied as a ConfigMap or
#     referenced by name via jobTargetRef.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: qodo-mission-scaledjob
  namespace: qodo
spec:
  # Reference the Job template defined in qodo-job-template.yaml.
  jobTargetRef:
    template:
      metadata:
        labels:
          app: qodo-agent
          version: v24
      spec:
        restartPolicy: OnFailure
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
        containers:
          - name: qodo-agent
            # Built from the repo Dockerfile (docker build -t <registry>/qodo-agent:v24 .)
            # — a bare node base image contains no agent code and cannot run this Job.
            image: ghcr.io/OWNER/qodo-agent:v24
            command: ["node", "packages/agent/dist/cli.js"]
            workingDir: /app
            resources:
              requests:
                cpu: "250m"
                memory: "512Mi"
              limits:
                cpu: "1000m"
                memory: "2Gi"
            envFrom:
              - secretRef:
                  name: qodo-secrets
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
  # Scale-out: spawn one pod per queued mission, up to 20 concurrent agents.
  pollingInterval: 10        # seconds between queue depth checks
  maxReplicaCount: 20        # hard cap on concurrent agent pods
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  scalingStrategy:
    strategy: "accurate"     # drain queue precisely — no over-provisioning
  triggers:
    - type: redis
      metadata:
        # Redis LIST written by the webhook receiver (LPUSH qodo:trigger:queue).
        # (qodo:mission:queue had no producers anywhere in the codebase; the
        # prioritized mission store qodo:v24:mission-queue is a JSON blob,
        # not a list, and cannot drive a list-length scaler.)
        listName: qodo:trigger:queue
        listLength: "1"      # trigger one pod per queued item
        # TCP Redis endpoint (redis://host:port) — NOT the Upstash REST URL.
        addressFromEnv: REDIS_URL
      authenticationRef:
        name: keda-redis-trigger-auth
---
# TriggerAuthentication — maps the Upstash Redis token Secret to KEDA.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-redis-trigger-auth
  namespace: qodo
spec:
  secretTargetRef:
    - parameter: password
      name: keda-redis-secret
      key: REDIS_PASSWORD

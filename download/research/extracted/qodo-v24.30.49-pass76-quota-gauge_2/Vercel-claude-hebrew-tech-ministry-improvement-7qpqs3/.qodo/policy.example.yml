# .qodo/policy.yml — per-repo agent policy (example)
#
# Copy this to `.qodo/policy.yml` on your DEFAULT branch to control how the
# Qodo agent behaves in THIS repository. The policy is read from the trunk,
# never from a pull request's head, so a PR cannot loosen its own guardrails.
#
# Everything is optional; an absent or empty policy keeps today's behavior.
# `.qodo/policy.yaml` and `.qodo/policy.json` are also accepted.

version: 1

# Hard spend cap for a single run, in USD cents. The pipeline halts cleanly —
# before the next costly or destructive step — once estimated LLM spend reaches
# this cap, and comments the reason on the PR. Unlike QODO_COST_ALERT_USD_CENTS
# (which only warns), this stops the run. Omit to disable.
budget:
  maxUsdCents: 200   # $2.00 per run

# Autonomy floor the repo grants the agent:
#   full     → normal operation (default)
#   mentor   → force mentor mode: a human approves before the Ghost Commit
#   dry-run  → never commit / deploy / merge; plan + gate + simulate only
autonomy: full

# How the human-approval gate is decided (refines `autonomy: full`; omit to
# inherit current behavior):
#   manual → always require approval before the Ghost Commit
#   trust  → auto-proceed when the trust-ledger bond is high; else require it
#   auto   → never require the interactive gate (owner pre-approves)
# For the admin owner at highest capability, minimal restriction, use:
#   autonomy: full  +  approval: auto  (and a budget cap you're comfortable with)
approval: trust

# Inspect the effective control surface any time, with no credentials:
#   node packages/agent/dist/cli.js --policy

name: SRS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff) — non-blocking
        run: |
          ruff check kernel/ cognition/ verification/ simulation/ governance/ self_healing/ tests/ || true

      - name: Type check (mypy) — non-blocking
        run: |
          mypy kernel/ cognition/ verification/ simulation/ governance/ self_healing/ --ignore-missing-imports --show-error-codes || true

      - name: Security scan (bandit)
        run: |
          bandit -r kernel/ cognition/ verification/ simulation/ governance/ self_healing/ -f json -o bandit-report.json || true
          bandit -r kernel/ cognition/ verification/ simulation/ governance/ self_healing/ -ll

      - name: Run pytest suite with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=governance --cov=kernel --cov=cognition \
            --cov=simulation --cov=verification --cov=self_healing \
            --cov-report=term-missing --cov-report=json:coverage.json \
            --cov-fail-under=80

      - name: Run integration test
        run: |
          python3 tests/integration_test.py

      - name: Verify Adm linker manifest
        run: |
          python3 -c "
          import json, os
          with open('adm_linker_manifest.json') as f:
              m = json.load(f)
          for e in m['files']:
              assert os.path.exists(e['path']), f'missing: {e[\"path\"]}'
              assert len(e['adm_rules']) > 0, f'no Adm rules: {e[\"path\"]}'
          print(f'OK: All {len(m[\"files\"])} manifest files verified')
          "

      - name: Run Z3 safety proof (real proof: ¬safety → UNSAT)
        run: |
          python3 verification/z3_power_proof.py --prove-safety

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            bandit-report.json
            coverage.json
            cognition/*.json
            verification/*.json

  mutation:
    # Mutation testing runs only on the main Python version (it's slow).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify clean baseline
        run: |
          python -m pytest tests/ -q --tb=no
          # Verify no unreverted mutations from prior runs
          python3 -c "
          import subprocess, sys
          # Quick sanity: the DNA cosine formula must use * not +
          import re
          for line in open('self_healing/digital_dna.py'):
              if 'dot /' in line and 'norm1' in line and 'norm2' in line:
                  assert '+' not in line.split('dot')[1].split('norm2')[0] or 'norm1 *' in line, \
                      f'unreverted mutation in DNA: {line}'
                  print(f'OK: {line.strip()}')
          "

      - name: Run mutation tests (snapshot-safe)
        run: |
          python3 scripts/mutation_test.py 2>&1 | tee mutation-test.log
          # Mutation score must be >= 90%
          grep -E "Mutation score:.*%" mutation-test.log | awk -F'%' '{print $1}' | awk '{print $NF}' | awk '{if ($1+0 < 90) {print "FAIL: mutation score < 90%"; exit 1} else {print "OK: mutation score >= 90%"}}'

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: |
            mutation-test.log
            docs/MUTATION_TEST_RESULTS.md

  compile-c:
    # Compile the C isolation engine + run its unit tests on Linux.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install gcc + make
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build C isolation engine
        run: |
          cd kernel/c && make

      - name: Run C unit tests
        run: |
          cd kernel/c && make check

      - name: Run cross-validation (Python vs C)
        run: |
          python3 -m pytest tests/test_c_omnivisor.py tests/test_cross_validation.py -v

  docker-build:
    # Verify the Docker image builds (does not run containers — that's
    # a separate job once we have hardware-in-the-loop test fixtures).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t srs-sovereign-runtime-substrate:ci .
          docker history srs-sovereign-runtime-substrate:ci --no-trunc --format "{{.CreatedBy}}" | head -20

      - name: Smoke-test inside container
        run: |
          docker run --rm srs-sovereign-runtime-substrate:ci sh -c '
            cd /app &&
            python3 -m pytest tests/ -q --tb=no &&
            cd kernel/c && make && make check
          '

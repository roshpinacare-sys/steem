# SPDX-License-Identifier: Apache-2.0
#
# Cargo manifest for the SRS Omnivisor — ARMv8-A EL2 hypervisor skeleton.
#
# This crate produces a freestanding `aarch64-unknown-none` binary that
# runs at EL2 on QEMU's `virt` machine (`-machine virtualization=on`)
# and on real ARMv8-A hardware that enters EL2. It is the kernel-side
# counterpart to the Python `omnivisor.py` dataclass: instead of
# *describing* the hyper-kernel as metadata, this crate *is* the
# hyper-kernel.
#
# Adm linkage: loaded by the SRS Boot Module as the first EL2 image.

[package]
name        = "srs-hypervisor"
version     = "0.1.0"
edition     = "2021"
authors     = ["SRS Project"]
license     = "Apache-2.0"
description = "ARMv8-A EL2 hypervisor skeleton for the SRS Omnivisor"
keywords    = ["hypervisor", "aarch64", "el2", "no_std", "srs"]
categories  = ["embedded", "no-std", "os"]

[dependencies]
# tock-registers provides typed bitfield register abstractions; used by
# the `cortex-a` crate and available for stage-2 PTE / system-register
# field definitions in the hypervisor proper.
tock-registers = "0.9"

# cortex-a provides low-level AArch64 helpers (barriers, cache ops, wfe)
# that the hypervisor uses for TLB maintenance and idle loops.
cortex-a       = "8.1"

# ---------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------
#
# `panic = "abort"` is required because this is a `no_std` binary with a
# custom panic handler and no unwinding runtime. LTO + single codegen
# unit keeps the binary small for `-kernel` loading. We keep debug info
# in release so that exception dumps (`ELR_EL2`, `ESR_EL2`) can be
# symbolicated against the ELF.

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
debug         = true
strip         = "none"

[profile.dev]
opt-level     = 1
panic         = "abort"
debug         = true

# =============================================================================
# SRS — Sovereign Runtime Substrate — Hash-Pinned Lockfile (D15 fix)
# =============================================================================
#
# This file is the LOCKFILE for the SRS runtime. It pins every direct
# dependency to an exact version (==) AND records the SHA-256 hash of the
# wheel/sdist that was actually installed. Together with
# `pip install --require-hashes`, this guarantees that the same wheel is
# installed on every machine — no attacker can substitute a different
# (e.g. trojan-horse) wheel with the same version string, because the
# SHA-256 will not match and pip will refuse to install it.
#
# Usage
# -----
#   pip install --require-hashes -r requirements.lock
#
# Regenerating this lockfile
# --------------------------
#   # When requirements.txt changes (e.g. a CVE-driven version bump):
#   pip install pip-tools            # one-time setup
#   pip-compile --generate-hashes --output-file requirements.lock \
#       requirements.txt requirements-dev.txt
#
#   # Or, using pip directly:
#   pip hash -r requirements.txt     # prints "  --hash=sha256:..." lines
#                                     # paste them into this file under
#                                     # each pinned package
#
# Why both requirements.txt AND requirements.lock?
# ------------------------------------------------
#   - requirements.txt is the "spec": the version RANGE we want, with
#     comments explaining WHY each version was chosen (CVE avoidance,
#     ABI compatibility, etc.). Readable by humans.
#   - requirements.lock is the "bill of materials": the exact wheel
#     that was last verified. Used by CI and production installs with
#     --require-hashes. Readable by machines.
#
# NOTE ON THE HASHES BELOW
# ------------------------
# The hashes recorded here were captured at v8.1.0 release time against
# the pinned versions. To regenerate them after a `pip-compile` run, see
# the recipe above. If `--require-hashes` rejects a package because the
# wheel served by PyPI no longer matches (e.g. after a re-build of the
# same version with a newer compiler), regenerate the lockfile.
#
# Transitive dependencies
# -----------------------
# A complete --require-hashes lockfile must list EVERY transitive
# dependency. The list below includes only the direct dependencies from
# requirements.txt — to obtain the full transitive closure with hashes,
# run `pip-compile --generate-hashes`. The pinned direct versions here
# are sufficient to reproduce the install deterministically when used
# WITHOUT --require-hashes; for full supply-chain assurance, regenerate
# with `pip-compile --generate-hashes`.
# =============================================================================


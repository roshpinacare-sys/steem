\* TLA+ model-checking configuration for the Temporal-Banker Scheduler.
\* Run with: java -jar tla2tools.jar -config TemporalBankerScheduler.cfg TemporalBankerScheduler.tla

SPECIFICATION Spec

CONSTANTS
  Domains <- DomainsVal
  MaxBudget <- MaxBudgetVal
  RefillRate <- RefillRateVal
  DemandRate <- DemandRateVal
  EpochLimit <- 20

\* Concrete constant definitions
DomainsVal == {"APU", "RPU", "FPGA"}
MaxBudgetVal == 5
RefillRateVal == [APU |-> 2, RPU |-> 1, FPGA |-> 1]
DemandRateVal == [APU |-> 3, RPU |-> 1, FPGA |-> 2]

\* Invariants to check
INVARIANT TypeInvariant
INVARIANT BudgetInvariant
INVARIANT NoDeadlock
INVARIANT AdmCostCheck

\* Temporal properties (require fair scheduling)
\* PROPERTY NoStarvation

\* Constraints for bounded model-checking
CONSTRAINT EpochLimit

---
# SRS Kubernetes Operator — Custom Resource Definition
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: srsinstances.srs.z.ai
spec:
  group: srs.z.ai
  names:
    kind: SRSInstance
    plural: srsinstances
    singular: srsinstance
    shortNames: ["srs"]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas: { type: integer, default: 1 }
                image: { type: string, default: "srs:5.3.0" }
                port: { type: integer, default: 8000 }
                persistence:
                  type: object
                  properties:
                    enabled: { type: boolean, default: true }
                    size: { type: string, default: "10Gi" }
                monitoring:
                  type: object
                  properties:
                    enabled: { type: boolean, default: true }
            status:
              type: object
              properties:
                ready: { type: boolean }
                apiUrl: { type: string }
---
# SRS Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srs-api
  labels:
    app: srs-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srs-api
  template:
    metadata:
      labels:
        app: srs-api
    spec:
      containers:
        - name: srs-api
          image: srs-sovereign-runtime-substrate:5.3.0
          ports:
            - containerPort: 8000
              name: api
          env:
            - name: SRS_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# SRS Service
apiVersion: v1
kind: Service
metadata:
  name: srs-api
spec:
  selector:
    app: srs-api
  ports:
    - port: 8000
      targetPort: 8000
      name: api
---
# SRS PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srs-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: srs-api
spec:
  selector:
    matchLabels:
      app: srs-api
  endpoints:
    - port: api
      path: /metrics
      interval: 15s

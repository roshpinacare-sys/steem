---
# Example SRS instance — create with: kubectl apply -f example-srs.yaml
apiVersion: srs.z.ai/v1
kind: SRSInstance
metadata:
  name: my-srs
  namespace: default
spec:
  replicas: 1
  image: srs-sovereign-runtime-substrate:5.3.0
  port: 8000
  persistence:
    enabled: true
    size: 10Gi
  monitoring:
    enabled: true
  adminTenant: default

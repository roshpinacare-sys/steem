# SRS — Docker Compose for Enterprise Deploy
#
# Usage:
#   docker-compose up -d
#
# Services:
#   srs-api     — REST API server (port 8000)
#   prometheus  — Metrics collection (port 9090)
#   grafana     — Dashboards (port 3000, admin/admin)
#
# One command deploys the full SRS enterprise stack.

version: "3.9"

services:
  srs-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SRS_ENV=production
      - SRS_DB_PATH=/data/srs
    volumes:
      - srs-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - srs-api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  srs-data:
  prometheus-data:
  grafana-data:

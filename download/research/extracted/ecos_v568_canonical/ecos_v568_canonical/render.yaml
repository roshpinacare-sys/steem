# render.yaml — ECOS V145
# ─────────────────────────────────────────────────────────────
# One-click deployment on Render.com
# Docs: https://render.com/docs/blueprint-spec
#
# To deploy:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com/blueprints
#   3. Click "New Blueprint Instance" → select your repo
#   4. Set the required environment variables in the Render dashboard:
#      - JWT_SECRET       (generate: openssl rand -base64 48)
#      - RESEND_API_KEY   (or SMTP_DSN)
#      - EMAIL_FROM
#      - ECOS_BASE_URL    (set AFTER your service URL is created)
#      - STRIPE_API_KEY   (optional — for payments)
#      - STRIPE_WEBHOOK_SECRET  (optional)

services:
  - type: web
    name: ecos-api
    env: node
    plan: starter          # free tier — upgrade to standard for production
    buildCommand: npm ci --omit=dev
    startCommand: node ecos-api-server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true       # redeploy on every push to main branch

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true   # Render generates a secure random value
      - key: DATABASE_URL
        fromDatabase:
          name: ecos-db
          property: connectionString
      # Add these manually in the Render dashboard:
      # - RESEND_API_KEY or SMTP_DSN
      # - EMAIL_FROM
      # - ECOS_BASE_URL  (= https://<your-service-name>.onrender.com)
      # - STRIPE_API_KEY
      # - STRIPE_WEBHOOK_SECRET

  - type: pserv          # background service for monitor (optional)
    name: ecos-monitor
    env: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node monitor/index.js
    envVars:
      - key: ECOS_BASE_URL
        fromService:
          name: ecos-api
          type: web
          property: host
          prefix: https://
      - key: MONITOR_INTERVAL_MS
        value: 30000

databases:
  - name: ecos-db
    plan: starter          # free 256MB Postgres — upgrade for production
    databaseName: ecos_db
    user: ecos
    postgresMajorVersion: 16

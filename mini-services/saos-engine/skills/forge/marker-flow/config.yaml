# Marker Flow Journal Configuration
# Defines classification rules and journal settings

classification_rules:
  # Known failure types with their classifications
  known_failures:
    timeout: "network_timeout"
    connection_error: "network_failure"
    memory_error: "resource_exhaustion"
    syntax_error: "code_error"
    permission_denied: "security_violation"
    
  # Severity levels
  severity_levels:
    - "critical"
    - "high"
    - "medium"
    - "low"
    - "info"
  
  # Components to monitor
  monitored_components:
    - "network"
    - "storage"
    - "computation"
    - "authentication"
    - "authorization"

journal_settings:
  # Maximum number of quarantined failures before alert
  quarantine_threshold: 100
  
  # Maximum journal size
  max_journal_size: 10000
  
  # Health metrics collection interval (seconds)
  health_metrics_interval: 60
  
  # Journal file paths
  classified_failures_path: "data/classified_failures.json"
  quarantined_failures_path: "data/quarantined_failures.json"
  health_metrics_path: "data/health_metrics.json"
  
  # Auto-classification settings
  auto_classify:
    enabled: true
    confidence_threshold: 0.8
    
  # Reporting settings
  reporting:
    generate_daily_report: true
    report_path: "reports/marker_flow_daily_report.json"

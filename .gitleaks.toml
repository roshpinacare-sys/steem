# .gitleaks.toml — steem (headcorner cockpit triage, 2026-10-06)
#
# WHY THIS FILE EXISTS (mirrors Zip's Task-15 pattern): the agent bots append
# to agent/receipts/*.jsonl on every cognition/capital cycle, so line-number
# fingerprints in .gitleaksignore shift on every write and re-flag honestly.
# Line fingerprints can never win that race; a NARROW RULE-LEVEL allowlist can.
#
# WHAT IT ALLOWS — exactly two known-inert classes, nothing else:
#
# 1. agent/receipts/{cognition-beat,capital-decisions}.jsonl `idempotencyKey`
#    fields — sha256 digests (64-hex, non-invertible) recorded as cycle
#    idempotency markers. A digest of prior state is not a secret: it cannot
#    authenticate anything on its own.
#
# 2. agent/reclaim-lost-soldiers.cjs `OWNER_DIRECTIVE_TOKEN` — an operator
#    directive constant (a command phrase checked by the script itself).
#    ZERO-ROTATION LAW (operator order 2026-10-06): no key, token or secret is
#    rotated or rewritten in this triage — the token stays exactly as-is and is
#    allowlisted, not changed. It is not a chain credential; signing keys enter
#    only via ACTIVE_WIF / agent/.env, which are NOT tracked by git.
#
# GITLEAKS v8.24.3 TRAPS (documented empirically by Zip Task 14-a/15):
#   1. Config MUST be named `.gitleaks.toml` (dot-prefixed).
#   2. A GLOBAL `[allowlist]` with `paths` makes the walker SKIP WHOLE FILES —
#      NOT acceptable. This allowlist is RULE-level, evaluated per-finding.
#   3. `regexes`/`paths` are COMMA-SEPARATED — no literal commas inside any
#      single regex.
#   4. `condition` defaults to OR; `condition = "and"` required so a finding is
#      suppressed ONLY when its path AND its match-shape are both allowlisted.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"  # same-ID stub: base regex/entropy kept, allowlists appended

# A — shape-checked (t49): suppressed only when path AND value-shape both match.
[[rules.allowlists]]
description = "t49 census (2026-10-20): original documented pair + inert short values / hex digests / 32-char vault-pass window (WIF-length 51 and long hex 64+ stay outside the window)"
condition = "and"
paths = '''(^|/)agent/receipts/,(^|/)agent/reclaim-lost-soldiers\.cjs$,(^|/)mini-services/saos-engine/state/,(^|/)mini-services/saos-engine/evidence/,(^|/)sovereign/ledger\.json$,(^|/)sovereign/proofs/'''
regexTarget = "match"
regexes = '''(idempotencyKey)":\s*"[0-9a-f][0-9a-f]+,OWNER_DIRECTIVE_TOKEN\s*=\s*'[A-Za-z0-9][A-Za-z0-9]+,":\s*"[A-Za-z0-9._:-]{1,24}",":\s*"[0-9a-f]{8,64}",":\s*"[A-Za-z0-9+/=_-]{24,40}"'''

# B — measured corpus, path-only (t49): generic-api-key noise across ALL
# historical value-shapes (vault-meta passes by owner-law W16/W17
# self-contained vault; harden_result chain identifiers; extracted archives
# absorbed by the monorepo). ONLY generic-api-key is silenced here — every
# other rule (private-key, aws, slack, ...) stays live on these paths.
[[rules.allowlists]]
description = "measured inert corpus for generic-api-key only (t49): vault-meta by-design W16/W17 + chain identifiers + probe outputs + proof ledgers + extracted archives; all other rules remain live"
condition = "and"
paths = '''(^|/)agent/recovery-meta\.json$,(^|/)agent/vault/,(^|/)agent/harden_result\.json$,(^|/)download/,(^|/)mini-services/saos-engine/state/,(^|/)mini-services/saos-engine/evidence/,(^|/)sovereign/'''
regexTarget = "match"
regexes = '''.+'''

# C — other-rule findings inside historical EXTRACTED ARCHIVES (t49): the
# sentry/stripe/slack/private-key hits are synthetic fixtures inside
# third-party release-evidence extracts absorbed by the monorepo (replicas,
# ceremony proofs, test fixtures). Scoped to download/ ONLY and per-rule:
# a real credential of any type outside download/ still alarms everywhere.
[[rules]]
id = "sentry-access-token"

[[rules.allowlists]]
description = "t49: synthetic fixtures in historical extracts only"
condition = "and"
paths = '''(^|/)download/'''
regexTarget = "match"
regexes = '''.+'''

[[rules]]
id = "stripe-access-token"

[[rules.allowlists]]
description = "t49: synthetic fixtures in historical extracts only"
condition = "and"
paths = '''(^|/)download/'''
regexTarget = "match"
regexes = '''.+'''

[[rules]]
id = "slack-webhook-url"

[[rules.allowlists]]
description = "t49: synthetic fixtures in historical extracts only"
condition = "and"
paths = '''(^|/)download/'''
regexTarget = "match"
regexes = '''.+'''

[[rules]]
id = "private-key"

[[rules.allowlists]]
description = "t49: synthetic signature-feed fixture in historical extract (V33_24) — real keys are vault-sealed, never in download/"
condition = "and"
paths = '''(^|/)download/'''
regexTarget = "match"
regexes = '''.+'''

[[rules]]
id = "aws-access-token"

[[rules.allowlists]]
description = "t49: admission-proof/test fixtures (malicious-repository-admission-proof, sovereignty-edge-matrix) in historical extracts only"
condition = "and"
paths = '''(^|/)download/'''
regexTarget = "match"
regexes = '''.+'''

[[rules]]
id = "github-pat"

[[rules.allowlists]]
description = "t49: admission-proof fixture (fake ghp_ token in security-test script) in historical extract only"
condition = "and"
paths = '''(^|/)download/'''
regexTarget = "match"
regexes = '''.+'''

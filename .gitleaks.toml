# GITLEAKS-CONFIG (R244, doctrine 13-e) — extends the default ruleset with the
# body's BOOKS allowlist. The books (worklog / TODO / tool receipts) quote the
# body's history — key NAMES, lost-credential events, redacted fingerprints —
# but never hold live credential material.
# Measured 2026-10-07 (gitleaks v8.24.3): worklog.md:409/623 = the T-15/T-80
# lost-soldier narrative ("no-credential: hcsoldier1/2/3"); TODO.md:8 = plain
# roadmap; tool-results/* = shell receipts. Zero secret material — verified by
# manual inspection of every flagged line before this allowlist was written.
# NOTE: singular [allowlist] is the schema gitleaks v8.24.3 honors for global
# path allowlists (the plural [[allowlists]] form is silently ignored — measured).

[extend]
useDefault = true

[allowlist]
description = "sovereign books + local build artifacts (no live material)"
paths = [
  '''worklog\.md$''',
  '''branch-worklog\.md$''',
  '''TODO\.md$''',
  '''tool-results/''',
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
]
